<script>
  function showError(title, detail) {
    var root = document.getElementById('root');
    if (root) {
      root.innerHTML =
        '<div style="padding:20px;font-family:-apple-system,monospace;white-space:pre-wrap;word-break:break-word;color:#b91c1c;background:#fff;line-height:1.5;">' +
        '<div style="font-weight:bold;font-size:16px;margin-bottom:10px;">⚠️ ' + title + '</div>' +
        '<div style="font-size:13px;margin-bottom:16px;">불러오는 중 문제가 생겼어요. 대부분 네트워크 문제라 다시 시도하면 해결돼요.</div>' +
        '<button onclick="location.reload()" style="width:100%;padding:14px;border-radius:10px;border:none;background:#b91c1c;color:#fff;font-size:15px;font-weight:bold;font-family:inherit;">다시 시도</button>' +
        '<div style="font-size:11px;margin-top:16px;color:#7a6f52;">계속 안 되면 홈 화면 아이콘을 삭제 후 다시 추가해보세요.</div>' +
        '<div style="font-size:10px;margin-top:12px;color:#a3a3a3;">' + detail + '</div></div>';
    }
  }
  window.addEventListener('error', function (e) {
    showError('오류가 발생했어요', (e.error && e.error.stack) ? e.error.stack : (e.message || String(e)));
  });
  window.addEventListener('unhandledrejection', function (e) {
    var reason = e.reason;
    showError('오류가 발생했어요 (Promise)', (reason && reason.stack) ? reason.stack : String(reason));
  });
  window.__appMounted = false;
  setTimeout(function () {
    if (!window.__appMounted) {
      showError('불러오는 데 시간이 너무 오래 걸려요', '네트워크 상태를 확인하고 다시 시도해주세요. (필요한 파일을 받아오지 못했어요)');
    }
  }, 15000);
</script>

window.storage = {
  async get(key, shared = false) {
    if (supabase) {
      try {
        const { data, error } = await supabase.from(TABLE).select("value").eq("key", key).eq("shared", !!shared).maybeSingle();
        if (error) throw error;
        if (!data) return null;
        return { key, value: data.value, shared };

    }

      if (raw === null) return null;
      return { key, value: raw, shared };
    } catch (e) { console.error("storage.get (localStorage) 실패", e); return null; }
  },
  async set(key, value, shared = false) {
    if (supabase) {
      try {
        const { error } = await supabase.from(TABLE).upsert({ key, shared: !!shared, value, updated_at: new Date().toISOString() }, { onConflict: "key,shared" });

        return { key, value, shared };

    try {
      localStorage.setItem(localKey(key, shared), value);
      return { key, value, shared };
    } catch (e) { console.error("storage.set (localStorage) 실패", e); return null; }
  },
  async delete(key, shared = false) {
    if (supabase) {
      try {
        const { error } = await supabase.from(TABLE).delete().eq("key", key).eq("shared", !!shared);
        if (error) throw error;
        return { key, deleted: true, shared };
      } catch (e) { console.error("storage.delete (supabase) 실패", e); return null; }
    }
    try {
      localStorage.removeItem(localKey(key, shared));
      return { key, deleted: true, shared };
    } catch (e) { console.error("storage.delete (localStorage) 실패", e); return null; }
  },
  async list(prefix = "", shared = false) {
    if (supabase) {
      try {
        let query = supabase.from(TABLE).select("key").eq("shared", !!shared);
        if (prefix) query = query.like("key", `${prefix}%`);
        const { data, error } = await query;
        if (error) throw error;
        return { keys: (data || []).map(r => r.key), prefix, shared };
      } catch (e) { console.error("storage.list (supabase) 실패", e); return null; }
    }
    try {
      const fullPrefix = localKey(prefix, shared);
      const keys = [];
      for (let i = 0; i < localStorage.length; i++) {
        const k = localStorage.key(i);
        if (k && k.startsWith(fullPrefix)) keys.push(k.replace(localKey("", shared), ""));
      }
      return { keys, prefix, shared };
    } catch (e) { console.error("storage.list (localStorage) 실패", e); return null; }
  },
};

const mainStore = {
  // 서버 데이터의 마지막 수정 시각만 가져옴 (응답이 아주 작아서 전송량이 거의 들지 않음). 행이 없으면 "".
  async getUpdatedAt() {
    if (!supabase) return null; // localStorage 모드는 비교 불가 → 항상 전체 읽기(로컬이라 비용 없음)
    const { data, error } = await supabase.from(TABLE).select("updated_at").eq("key", STORAGE_KEY).eq("shared", true).maybeSingle();
    if (error) throw error;
    return data ? (data.updated_at || "") : "";
  },
  // 전체 데이터 + 수정 시각. 행이 없으면 null.
  async getFull() {
    if (!supabase) {
      const raw = localStorage.getItem(localKey(STORAGE_KEY, true));
      return raw === null ? null : { value: raw, updatedAt: null };
    }
    const { data, error } = await supabase.from(TABLE).select("value, updated_at").eq("key", STORAGE_KEY).eq("shared", true).maybeSingle();
    if (error) throw error;
    return data ? { value: data.value, updatedAt: data.updated_at || "" } : null;
  },
  // 저장 후 서버에 기록된 수정 시각을 돌려줌
  async save(value) {
    const stamp = new Date().toISOString();
    if (!supabase) { localStorage.setItem(localKey(STORAGE_KEY, true), value); return stamp; }
    const { data, error } = await supabase.from(TABLE)
      .upsert({ key: STORAGE_KEY, shared: true, value, updated_at: stamp }, { onConflict: "key,shared" })
      .select("updated_at").maybeSingle();
    if (error) throw error;
    return (data && data.updated_at) || stamp;
  },
};
const sameStamp = (a, b) => a === b || (!!a && !!b && Date.parse(a) === Date.parse(b));
const POLL_INTERVAL_MS = 15000;

function useAppData() {
  const [data, setDataState] = useState(emptyData());
  const [loading, setLoading] = useState(true);
  const [loadError, setLoadError] = useState(false);
  const [saving, setSaving] = useState(false);
  const [saveError, setSaveError] = useState(false);
  const dataRef = useRef(data);
  const savingRef = useRef(saving);
  const loadedOkRef = useRef(false);   // 서버에서 데이터를 제대로 받아온 적이 있는지 (없으면 저장 금지)
  const serverStampRef = useRef(null); // 마지막으로 받거나 저장한 서버 수정 시각
  useEffect(() => { dataRef.current = data; }, [data]);
  useEffect(() => { savingRef.current = saving; }, [saving]);

  const parseValue = (value) => ({ ...emptyData(), ...JSON.parse(value) });

  // 전체 데이터를 받아 화면에 반영. 실패하면 예외를 던짐.
  const loadFull = async () => {
    const res = await mainStore.getFull();
    serverStampRef.current = res ? res.updatedAt : "";
    if (res && res.value) {
      const parsed = parseValue(res.value);
      if (JSON.stringify(parsed) !== JSON.stringify(dataRef.current)) {
        dataRef.current = parsed;
        setDataState(parsed);
      }
    }
    loadedOkRef.current = true;
    setLoadError(false);
  };

  // 가벼운 변경 확인: 서버 수정 시각이 바뀐 경우에만 전체 데이터를 다시 받음
  const fetchLatest = async () => {
    try {
      if (!loadedOkRef.current) { await loadFull(); return; }
      const stamp = await mainStore.getUpdatedAt();
      if (stamp === null || !sameStamp(stamp, serverStampRef.current)) await loadFull();
    } catch (e) { console.error("최신 데이터 확인 실패", e); }
  };

  const initialLoad = async () => {
    setLoading(true);
    try { await loadFull(); }
    catch (e) { console.error("데이터 불러오기 실패", e); setLoadError(true); }
    setLoading(false);
  };

  useEffect(() => { initialLoad(); }, []);

  // 화면이 보일 때만 15초마다 변경 확인 (백그라운드 탭·꺼진 화면에서는 확인하지 않음)
  useEffect(() => {
    const interval = setInterval(() => {
      if (document.visibilityState === "visible" && !savingRef.current) fetchLatest();
    }, POLL_INTERVAL_MS);
    const onVisible = () => { if (document.visibilityState === "visible" && !savingRef.current) fetchLatest(); };
    document.addEventListener("visibilitychange", onVisible);
    window.addEventListener("focus", onVisible);
    return () => {
      clearInterval(interval);
      document.removeEventListener("visibilitychange", onVisible);
      window.removeEventListener("focus", onVisible);
    };
  }, []);

  const writeToServer = async (next) => {
    const json = JSON.stringify(next);
    try {
      serverStampRef.current = await mainStore.save(json);
    } catch (e) {
      console.error("저장 실패, 재시도 중", e);
      try { serverStampRef.current = await mainStore.save(json); }
      catch (e2) { console.error("저장 재시도 실패", e2); setSaveError(true); }
    }
  };

  const setData = async (next) => {
    // 데이터를 못 불러온 상태에서 저장하면 서버의 기존 데이터를 빈 값으로 덮어쓸 수 있으므로 차단
    if (!loadedOkRef.current) { setSaveError(true); return; }
    dataRef.current = next;
    setDataState(next);
    setSaving(true);
    setSaveError(false);
    await writeToServer(next);
    setSaving(false);
  };

  // 작은 변경(토글 등): 서버가 그사이 바뀌었으면 최신 데이터 위에 patchFn을 다시 적용해서 저장 (다른 기기 변경 보존)
  const patchData = async (patchFn) => {
    if (!loadedOkRef.current) { setSaveError(true); return; }
    let base = dataRef.current;
    const optimistic = patchFn(base);
    dataRef.current = optimistic;
    setDataState(optimistic);
    setSaving(true);
    setSaveError(false);
    try {
      const stamp = await mainStore.getUpdatedAt();
      if (stamp === null || !sameStamp(stamp, serverStampRef.current)) {
        const res = await mainStore.getFull();
        if (res && res.value) base = parseValue(res.value);
      }
    } catch (e) { /* 최신 데이터를 못 받아오면 로컬 데이터 기준으로 진행 */ }
    const next = patchFn(base);
    dataRef.current = next;
    setDataState(next);
    await writeToServer(next);
    setSaving(false);
  };

  return { data, setData, patchData, loading, loadError, retryLoad: initialLoad, saving, saveError };
}


function syncAlerts(alerts, sourceKey, shouldExist, buildAlert) {
  const existingPending = alerts.find(a => a.sourceKey === sourceKey && a.status === "대기");
  const existingHandled = alerts.find(a => a.sourceKey === sourceKey && a.status !== "대기");
  if (shouldExist) {
    if (existingPending) {
      return alerts.map(a => a.sourceKey === sourceKey && a.status === "대기" ? { ...a, ...buildAlert(), id: a.id, sourceKey, status: "대기" } : a);
    }
    if (existingHandled) return alerts; // 이미 확인·발송 처리된 건은 조건이 그대로여도 재알림 안 만듦
    return [...alerts, { id: uid(), sourceKey, status: "대기", createdAt: new Date().toISOString(), ...buildAlert() }];
  }
  return existingPending ? alerts.filter(a => !(a.sourceKey === sourceKey && a.status === "대기")) : alerts;
}

function PinBoxes({ value, onChange, length = 4 }) {
  const refs = useRef([]);
  const digits = value.split("").concat(Array(length).fill("")).slice(0, length);
  const setDigit = (i, v) => {
    if (!/^[0-9]?$/.test(v)) return;
    const next = digits.slice(); next[i] = v; onChange(next.join(""));
    if (v && i < length - 1) refs.current[i + 1]?.focus();
  };
  const onKeyDown = (i, e) => { if (e.key === "Backspace" && !digits[i] && i > 0) refs.current[i - 1]?.focus(); };
  return (
    <div className="flex gap-2">
      {digits.map((d, i) => (
        <input key={i} ref={el => (refs.current[i] = el)} value={d} onChange={e => setDigit(i, e.target.value)} onKeyDown={e => onKeyDown(i, e)}
          inputMode="numeric" maxLength={1} className="w-12 h-14 text-center text-xl rounded-xl outline-none"
          style={{ background: "#efe6d0", border: "1px solid #ddcda0", color: "var(--gold)" }} />
      ))}
    </div>
  );
}

}

function Dashboard({ data }) {

    ? Math.round(todaysPlanners.reduce((s, p) => s + (p.planned ? (p.done / p.planned) * 100 : 0), 0) / todaysPlanners.length)

    <div className="flex gap-3 flex-wrap">

      <StatCard label="오늘 평균 성취율" value={avgRate === null ? "-" : `${avgRate}%`} tone={avgRate !== null && avgRate < PASS_RATE ? "var(--coral)" : "var(--gold)"} />
      <StatCard label="발송 대기 알림" value={pendingAlerts} tone={pendingAlerts ? "var(--coral)" : "var(--gold)"} />

  );
}

  const tasks = data.dailyTasks || [];
  const pendingCount = tasks.filter(t => !t.done).length;
  const totalCount = tasks.length;
  const filtered = filter === "전체" ? tasks : tasks.filter(t => t.type === filter);
  const overdueRetests = data.tests.filter(t => t.retest && t.retestDate && t.retestDate < todayStr())
    .map(t => ({ ...t, student: data.students.find(s => s.id === t.studentId) }))
    .sort((a, b) => (a.retestDate || "").localeCompare(b.retestDate || ""));
  const undatedRetests = data.tests.filter(t => t.retest && !t.retestDate)
    .map(t => ({ ...t, student: data.students.find(s => s.id === t.studentId) }));
  const recordRetestResult = (t, retestScoreStr) => {
    const retestScore = Number(retestScoreStr);
    if (isNaN(retestScore)) return;
    const didPass = retestScore >= t.passLine;
    const historyLine = `재시험 ${todayStr()}: ${retestScore}점 (${didPass ? "통과" : "재재시험 필요"})`;
    setData({
      ...data,
      tests: data.tests.map(x => x.id === t.id ? {
        ...x,
        score: retestScore,
        passed: didPass,
        retest: !didPass,
        retestDate: "",
        retestCount: (x.retestCount || 0) + 1,
        note: [x.note, historyLine].filter(Boolean).join("\n"),
      } : x),
    });
  };

  const saveNick = () => { setData({ ...data, dashboardNickname: nickDraft }); setEditingNick(false); };
  const toggleDone = (id) => setData({ ...data, dailyTasks: tasks.map(t => t.id === id ? { ...t, done: !t.done } : t) });
  const removeTask = (id) => setData({ ...data, dailyTasks: tasks.filter(t => t.id !== id) });
  const addTask = () => {
    if (!form.label.trim()) return;
    const label = form.type === "등원" ? `${form.label.trim()} · 첫 수업` : form.label.trim();
    setData({ ...data, dailyTasks: [...tasks, { id: uid(), type: form.type, label, time: form.time, done: false }] });
    setForm({ type: "등원", label: "", time: "" });
    setShowAdd(false);
  };

  const dayNames = ["일", "월", "화", "수", "목", "금", "토"];

  const badgeStyle = { TEST: { bg: "#173226", fg: "#f4efe1" }, 등원: { bg: "var(--gold)", fg: "#fffaf2" } };

  return (
    <div className="flex flex-col gap-4">
      <div className="rounded-2xl p-5" style={{ background: "#173226" }}>
        <div className="text-[10px] tracking-[0.3em] mb-3" style={{ color: "var(--gold)" }}>ROUTINE MATH ACADEMY</div>
        <div className="flex items-center gap-2 flex-wrap mb-2">
          {editingNick ? (
            <input autoFocus value={nickDraft} onChange={e => setNickDraft(e.target.value)} onBlur={saveNick} onKeyDown={e => e.key === "Enter" && saveNick()}
              className="bg-transparent border-b outline-none text-lg font-bold" style={{ color: "#f4efe1", borderColor: "var(--gold)", fontFamily: "'Noto Serif KR', serif", width: 120 }} />
          ) : (
            <h3 className="text-lg font-bold" style={{ color: "#f4efe1", fontFamily: "'Noto Serif KR', serif" }}>{data.dashboardNickname || "수학쌤"}님, 오늘도 애쓰셨어요</h3>
          )}
          <button onClick={() => { setNickDraft(data.dashboardNickname || "수학쌤"); setEditingNick(true); }} className="text-[11px] px-2.5 py-1 rounded-full" style={{ border: "1px solid rgba(244,239,225,0.35)", color: "rgba(244,239,225,0.75)" }}>닉네임 수정</button>
        </div>
        <div className="text-xs" style={{ color: "rgba(244,239,225,0.55)" }}>{todayLabel} · 정규수업일</div>
      </div>

      <div className="grid grid-cols-2 gap-3">
        <div className="rounded-2xl p-4" style={panel}>

          <div className="text-3xl font-bold" style={{ color: "#173226", fontFamily: "'Noto Serif KR', serif" }}>{totalCount}</div>
        </div>
        <div className="rounded-2xl p-4" style={{ background: "#173226" }}>
          <div className="text-xs mb-1" style={{ color: "rgba(244,239,225,0.6)" }}>처리 대기</div>
          <div className="text-3xl font-bold" style={{ color: "var(--gold)", fontFamily: "'Noto Serif KR', serif" }}>{pendingCount}</div>
        </div>
      </div>

      {overdueRetests.length > 0 && (
        <div className="rounded-2xl p-4" style={{ background: "#fde3c8", border: "2px solid var(--coral)" }}>
          <h3 className="font-bold mb-2 flex items-center gap-2 text-sm" style={{ color: "#8a3a1e" }}><FlaskConical size={16} color="var(--coral)" />지난 재시험 미처리 ({overdueRetests.length}건)</h3>

function applyPlannerEntry(data, setData, patch, id) {
  const student = data.students.find(s => s.id === patch.studentId);
  if (!student) return;
  const rate = patch.planned > 0 ? Math.round((patch.done / patch.planned) * 100) : 0;
  const finalId = id || uid();
  const planners = id ? data.planners.map(p => p.id === id ? { ...p, ...patch } : p) : [...data.planners, { id: finalId, ...patch }];
  const alerts = syncAlerts(data.alerts, `planner:${finalId}`, rate < PASS_RATE, () => ({
    studentId: patch.studentId, kind: "성취율 미달",
    message: `[루틴수학] ${student.name} 학생 ${patch.date} 플래너 성취율 ${rate}% 입니다 (계획 ${patch.planned} / 완료 ${patch.done}).`,
  }));
  setData({ ...data, planners, alerts });
}

function syncHomeworkAlert(entry, data) {
  const student = data.students.find(s => s.id === entry.studentId);
  return syncAlerts(data.alerts, `homework:${entry.id}`, !entry.submitted, () => ({
    studentId: entry.studentId, kind: "숙제 미제출",
    message: `[루틴수학] ${student?.name || ""} 학생 ${entry.date} "${entry.title}" 숙제가 미제출 상태입니다.`,
  }));
}

function fileToCompressedDataURL(file, maxWidth = 480, quality = 0.45) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        const scale = Math.min(1, maxWidth / img.width);
        const canvas = document.createElement("canvas");
        canvas.width = Math.round(img.width * scale);
        canvas.height = Math.round(img.height * scale);
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        resolve(canvas.toDataURL("image/jpeg", quality));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

            ))}
          </ul>
        )}
      </div>

  );

    if (!studentId || !name.trim() || score === "") return;
    const student = data.students.find(s => s.id === studentId);
    const entry = { id: uid(), studentId, name, testType, date, score: Number(score), passLine: Number(passLine), passed: Number(score) >= Number(passLine), retest: false, note: note.trim() };
    const alerts = syncAlerts(data.alerts, `test:${entry.id}`, entry.score < entry.passLine, () => ({
      studentId, kind: "테스트 기준미달",
      message: `[루틴수학] ${student?.name || ""} 학생 [${testType}] "${entry.name}" 결과 ${entry.score}점 (기준 ${entry.passLine}점 미달)입니다.`,
    }));
    setData({ ...data, tests: [...data.tests, entry], alerts });
    setName(""); setScore(""); setNote("");
  };
  const remove = (id) => setData({ ...data, tests: data.tests.filter(t => t.id !== id), alerts: data.alerts.filter(a => a.sourceKey !== `test:${id}` || a.status !== "대기") });
  const updateTestField = (testId, field, value) => setData({ ...data, tests: data.tests.map(t => t.id === testId ? { ...t, [field]: value } : t) });
  const recordRetestResult = (t, retestScoreStr) => {
    const retestScore = Number(retestScoreStr);
    if (isNaN(retestScore)) return;
    const didPass = retestScore >= t.passLine;
    const historyLine = `재시험 ${todayStr()}: ${retestScore}점 (${didPass ? "통과" : "재재시험 필요"})`;
    setData({
      ...data,
      tests: data.tests.map(x => x.id === t.id ? {
        ...x,
        score: retestScore,
        passed: didPass,
        retest: !didPass,
        retestDate: "",
        retestCount: (x.retestCount || 0) + 1,
        note: [x.note, historyLine].filter(Boolean).join("\n"),
      } : x),
    });
  };
  const list = data.tests.filter(t => scopedIds.has(t.studentId) && (!filter || t.studentId === filter)).sort((a, b) => b.date.localeCompare(a.date));
  const summaryByType = filter ? TEST_TYPES.map(tp => {
    const arr = data.tests.filter(t => t.studentId === filter && (t.testType || "일일테스트") === tp);
    return { tp, count: arr.length, avg: arr.length ? Math.round(arr.reduce((s, t) => s + t.score, 0) / arr.length) : null };
  }) : null;

  return (
    <div className="flex flex-col gap-4">
      {!showAddForm ? (
        <div className="rounded-2xl px-4 py-3 flex items-center justify-between gap-3 flex-wrap" style={panel}>
          <span className="text-xs" style={{ color: "#6b6250" }}>평소 시험 결과는 <b>오늘의 루틴 → 오늘의 평가</b>에서 입력하세요.</span>
          <button onClick={() => setShowAddForm(true)} className="px-3 py-1.5 rounded-lg text-xs font-semibold flex items-center gap-1" style={{ border: "1px solid #ddcda0", color: "#5c543e", background: "#fffaf0" }}><Plus size={13} />추가 입력</button>
        </div>
      ) : (
      <div className="rounded-2xl p-4 flex flex-col gap-3" style={panel}>
        <div className="flex items-center justify-between">
          <h3 className="font-bold" style={{ fontFamily: "'Noto Serif KR', serif" }}>테스트 결과 추가 입력</h3>
          <button onClick={() => setShowAddForm(false)} className="text-xs flex items-center gap-1" style={{ color: "#8a7f5e" }}><X size={14} />접기</button>
        </div>
        <p className="text-[11px] -mt-1" style={{ color: "#8a7f5e" }}>같은 날 시험을 하나 더 봤거나, 루틴 기록 없이 시험 결과만 넣을 때 쓰세요. 학부모 루틴 알림은 만들어지지 않아요.</p>
        <div className="grid grid-cols-2 gap-3">
          <Field label="학생"><StudentSelect students={scopedStudents} value={studentId} onChange={setStudentId} /></Field>
          <Field label="유형">
            <select className={inputCls} style={inputStyle} value={testType} onChange={e => setTestType(e.target.value)}>
              {TEST_TYPES.map(t => <option key={t}>{t}</option>)}
            </select>
          </Field>
          <Field label="날짜"><input type="date" className={inputCls} style={inputStyle} value={date} onChange={e => setDate(e.target.value)} /></Field>
          <Field label="시험명"><input className={inputCls} style={inputStyle} value={name} onChange={e => setName(e.target.value)} /></Field>
          <Field label="점수"><input type="number" className={inputCls} style={inputStyle} value={score} onChange={e => setScore(e.target.value)} /></Field>
          <Field label="기준 점수"><input type="number" className={inputCls} style={inputStyle} value={passLine} onChange={e => setPassLine(e.target.value)} /></Field>
        </div>
        <Field label="선생님 코멘트 (선택)"><input className={inputCls} style={inputStyle} value={note} onChange={e => setNote(e.target.value)} placeholder="예: 이번 시험 서술형에서 실수가 많았어요" /></Field>
        <button onClick={add} className="self-start px-4 py-2 rounded-lg text-sm font-semibold flex items-center gap-1" style={btnGold}><Plus size={16} />결과 추가</button>
      </div>
      )}
      <div className="rounded-2xl p-4" style={panel}>
        <div className="flex items-center justify-between mb-3">
          <h3 className="font-bold" style={{ fontFamily: "'Noto Serif KR', serif" }}>테스트 기록 ({list.length}건)</h3>
          <StudentSelect students={scopedStudents} value={filter} onChange={setFilter} allowAll />
        </div>
        {summaryByType && (
          <div className="grid grid-cols-2 gap-2 mb-3">
            {summaryByType.map(s => (
              <div key={s.tp} className="rounded-lg p-2" style={{ background: "#efe6d0" }}>
                <div className="text-[11px]" style={{ color: "#7a6f52" }}>{s.tp} ({s.count}회)</div>
                <div className="text-sm font-bold" style={{ color: s.avg !== null && s.avg < PASS_RATE ? "var(--coral)" : "var(--gold)" }}>{s.avg === null ? "-" : `평균 ${s.avg}점`}</div>
              </div>
            ))}
          </div>
        )}
        {list.length === 0 ? <EmptyState text="등록된 테스트 결과가 없습니다." /> : (
          <ul className="flex flex-col gap-2">
            {list.map(t => {
              const low = t.score < t.passLine;
              const passed = t.passed !== undefined ? t.passed : !low;
              return (
                <li key={t.id} className="flex flex-col gap-2 p-3 rounded-lg" style={{ background: low ? "#f8e3c9" : "#efe6d0" }}>
                  <div className="flex items-center justify-between">
                    <div className="text-sm" style={{ color: "#4a4332" }}>
                      <b style={{ color: "#2b2417" }}>{studentName(t.studentId)}</b> · {t.name} · {t.date}
                      <span className="text-[10px] ml-2 px-1.5 py-0.5 rounded-full" style={{ background: "#e4d8ba", color: "#5c543e" }}>{t.testType || "주간테스트"}</span>
                      <span className="font-bold ml-2" style={{ color: low ? "var(--coral)" : "var(--gold)" }}>{t.score}점</span>
                      <span className="text-xs" style={{ color: "#7a6f52" }}> (기준 {t.passLine}점)</span>
                    </div>
                    <button onClick={() => remove(t.id)} className="p-1.5 rounded-md flex-shrink-0" style={{ background: "#efe3c8" }}><Trash2 size={14} color="var(--coral)" /></button>
                  </div>
                  <div className="flex items-center gap-2 flex-wrap">
                    <button onClick={() => updateTestField(t.id, "passed", !passed)} className="px-2.5 py-1 rounded-full text-xs font-semibold" style={{ background: passed ? "#4c8c5f" : "var(--coral)", color: "#fff" }}>{passed ? "통과" : "미통과"}</button>
                    <button onClick={() => updateTestField(t.id, "retest", !t.retest)} className="px-2.5 py-1 rounded-full text-xs font-semibold" style={{ background: t.retest ? "var(--coral)" : "#e4d8ba", color: t.retest ? "#fff" : "#5c543e" }}>{t.retest ? "재시험 필요" : "재시험 없음"}</button>
                    {t.retest && (
                      <>
                        <input type="date" className="rounded-lg px-2 py-1 text-xs" style={inputStyle} value={t.retestDate || ""} onChange={e => updateTestField(t.id, "retestDate", e.target.value)} />
                        <RetestResultInput onSubmit={(score) => recordRetestResult(t, score)} />
                        {t.retestCount > 0 && <span className="text-[10px] px-1.5 py-0.5 rounded-full" style={{ background: "#e4d8ba", color: "#5c543e" }}>재시험 {t.retestCount}회째</span>}
                      </>
                    )}
                  </div>
                  <input className={inputCls} style={{ ...inputStyle, padding: "6px 10px" }} placeholder="강사 메모 (선택)" value={t.note || ""} onChange={e => updateTestField(t.id, "note", e.target.value)} />
                </li>
              );
            })}
          </ul>
        )}
      </div>
    </div>
  );
}

// ================= 오늘의 루틴 =================
function DailyRoutineTab({ data, setData, scopeClassGroups }) {
  const [studentId, setStudentId] = useState("");
  const [date, setDate] = useState(todayStr());
  const [items, setItems] = useState(ROUTINE_ITEM_DEFS.map(d => ({ ...d, result: d.kind === "count" ? "" : (d.kind === "choice" ? "" : false) })));
  const [testName, setTestName] = useState("");
  const [testScore, setTestScore] = useState("");
  const [testType, setTestType] = useState("일일테스트");
  const [testPassLine, setTestPassLine] = useState(String(PASS_RATE));
  const [testNote, setTestNote] = useState("");
  const [comment, setComment] = useState("");
  const [editingId, setEditingId] = useState(null);
  const resetTestFields = () => { setTestName(""); setTestScore(""); setTestType("일일테스트"); setTestPassLine(String(PASS_RATE)); setTestNote(""); };
  const students = studentsInScope(data.students, scopeClassGroups);
  const studentName = (id) => data.students.find(s => s.id === id)?.name || "-";

  const updateItem = (key, field, value) => setItems(items.map(it => it.key === key ? { ...it, [field]: value } : it));

  // 그날 기한인 숙제의 실제 제출 기록 (강사가 참고할 수 있도록 낱개로 보여주기만 함 — 최종 선택은 강사가 직접 클릭)
  const todaysHomeworks = studentId ? data.homeworks.filter(h => h.studentId === studentId && (h.dueDate || h.date) < date) : [];

  const practiceItem = items.find(it => it.key === "practice");
  const wrongItem = items.find(it => it.key === "wrong");
  const practiceCount = Number(practiceItem?.result) || 0;
  const wrongCount = Number(wrongItem?.result) || 0;
  const accuracy = practiceCount > 0 ? Math.max(0, Math.min(100, Math.round(((practiceCount - wrongCount) / practiceCount) * 100))) : null;

  const rateOf = (it) => {
    if (it.key === "homework") return it.result === "완료" ? 100 : (it.result === "기한초과" ? 50 : (it.result === "미제출" ? 0 : null));
    if (it.key === "wrong") return null; // 정답률로 따로 집계, 완료율 평균에는 안 넣음
    if (it.key === "practice") return Number(it.result) > 0 ? 100 : 0;
    if (it.key === "class") return null; // 새로 배움/복습은 종류 정보라 완료율에 안 넣음 (일수 breakdown으로 별도 표시)
    if (it.key === "review") return null; // 진행중 일수로 따로 집계, 완료율 평균에는 안 넣음
    if (it.kind === "boolean" || it.kind === "choice") return it.result ? 100 : 0;
    return 0;
  };

  const save = () => {
    if (!studentId) return;
    const student = data.students.find(s => s.id === studentId);
    const hwSummary = todaysHomeworks.map(h => {
      if (!h.submitted) return `• ${h.title} : 미제출`;
      return `• ${h.title} : ${h.submittedLate ? "기한초과 제출" : "제출"}`;
    }).join("\n");
    const hwAutoStatus = todaysHomeworks.length === 0 ? null :
      todaysHomeworks.some(h => !h.submitted) ? "미제출" :
      todaysHomeworks.some(h => h.submittedLate) ? "기한초과" : "완료";
    const itemsToSave = items.map(it => it.key === "homework" ? { ...it, result: hwAutoStatus, note: hwSummary } : it);
    const rates = itemsToSave.map(rateOf).filter(r => r !== null);
    const score = rates.length ? Math.round(rates.reduce((a, b) => a + b, 0) / rates.length) : 0;
    const routineId = editingId || uid();
    const existing = editingId ? data.routines.find(r => r.id === editingId) : null;
    const routine = { id: routineId, studentId, date, items: itemsToSave, testName, testScore: testScore ? Number(testScore) : null, testType, testPassLine: Number(testPassLine) || PASS_RATE, testNote: testNote.trim(), comment, score, createdAt: existing?.createdAt || new Date().toISOString() };

    const attendance = data.attendance.find(a => a.studentId === studentId && a.date === date);
    // 같은 날 학습 효율 기록이 있으면 루틴 알림 한 통에 합쳐서 보냄
    const effLog = (data.effLogs || []).find(l => l.studentId === studentId && l.date === date);
    const message = buildDailyReportText(student, date, itemsToSave, testName, testScore, comment, score, attendance) + effAlertBlock(effLog);
    let alerts = syncAlerts(data.alerts, `routine:${routineId}`, true, () => ({ studentId, kind: "오늘의 루틴", message }));
    alerts = alerts.filter(a => !(a.sourceKey === `eff:${studentId}:${date}` && a.status === "대기"));
    const routines = editingId ? data.routines.map(r => r.id === editingId ? routine : r) : [...data.routines, routine];

    // "오늘의 평가" 점수를 "테스트 기록"·"성적 추이"에도 반영되도록 data.tests에 함께 기록 (수정 시 같은 항목을 갱신)
    const linkedTestId = `routine-${routineId}`;
    let tests = data.tests.filter(t => t.id !== linkedTestId);
    const hasTest = testName.trim() && testScore !== "";
    const passLineNum = Number(testPassLine) || PASS_RATE;
    if (hasTest) {
      tests = [...tests, { id: linkedTestId, studentId, name: testName.trim(), testType, date, score: Number(testScore), passLine: passLineNum, passed: Number(testScore) >= passLineNum, retest: false, note: testNote.trim() }];
    }
    // 주간·월말·누적테스트 기준 미달이면 테스트 결과 탭에서 입력할 때처럼 "테스트 기준미달" 알림도 생성 (일일테스트는 루틴 알림에 점수가 들어가므로 생략)
    alerts = syncAlerts(alerts, `test:${linkedTestId}`, !!hasTest && testType !== "일일테스트" && Number(testScore) < passLineNum, () => ({
      studentId, kind: "테스트 기준미달",
      message: `[루틴수학] ${student?.name || ""} 학생 [${testType}] "${testName.trim()}" 결과 ${Number(testScore)}점 (기준 ${passLineNum}점 미달)입니다.`,
    }));

    setData({ ...data, routines, alerts, tests });
    resetTestFields(); setComment("");
    setItems(ROUTINE_ITEM_DEFS.map(d => ({ ...d, result: d.kind === "count" ? "" : (d.kind === "choice" ? "" : false) })));
    setEditingId(null);
  };

  const editRoutine = (r) => {
    setEditingId(r.id);
    setStudentId(r.studentId);
    setDate(r.date);
    setItems(ROUTINE_ITEM_DEFS.map(def => {
      const found = (r.items || []).find(it => it.key === def.key);
      return { ...def, result: found ? found.result : (def.kind === "count" ? "" : (def.kind === "choice" ? "" : false)), note: found?.note || "" };
    }));
    setTestName(r.testName || "");
    setTestScore(r.testScore != null ? String(r.testScore) : "");
    const linked = data.tests.find(t => t.id === `routine-${r.id}`);
    setTestType(r.testType || linked?.testType || "일일테스트");
    setTestPassLine(String(r.testPassLine ?? linked?.passLine ?? PASS_RATE));
    setTestNote(linked?.note ?? r.testNote ?? "");
    setComment(r.comment || "");
  };

  const cancelEdit = () => {
    setEditingId(null);
    resetTestFields(); setComment("");
    setItems(ROUTINE_ITEM_DEFS.map(d => ({ ...d, result: d.kind === "count" ? "" : (d.kind === "choice" ? "" : false) })));
  };

  const removeRoutine = (id) => setData({ ...data, routines: data.routines.filter(r => r.id !== id), alerts: data.alerts.filter(a => (a.sourceKey !== `routine:${id}` && a.sourceKey !== `test:routine-${id}`) || a.status !== "대기"), tests: data.tests.filter(t => t.id !== `routine-${id}`) });

  // 기록 찾기: 학생·월을 고르면 해당 기록 전체, 아무것도 안 고르면 최근 작성 10개
  const [listStudent, setListStudent] = useState("");
  const [listMonth, setListMonth] = useState("");
  const scopedForList = studentsInScope(data.students, scopeClassGroups);
  const filtering = !!(listStudent || listMonth);
  const mine = data.routines
    .filter(r => scopedForList.some(s => s.id === r.studentId))
    .filter(r => !listStudent || r.studentId === listStudent)
    .filter(r => !listMonth || r.date.slice(0, 7) === listMonth)
    .sort((a, b) => filtering ? (b.date.localeCompare(a.date) || (b.createdAt || "").localeCompare(a.createdAt || "")) : (b.createdAt || "").localeCompare(a.createdAt || ""))
    .slice(0, filtering ? 200 : 10);

  return (
    <div className="flex flex-col gap-4">
      <div className="rounded-2xl p-4 flex flex-col gap-3" style={panel}>
        <h3 className="font-bold" style={{ fontFamily: "'Noto Serif KR', serif" }}>오늘의 루틴 입력</h3>
        <div className="grid grid-cols-2 gap-3">
          <Field label="학생"><StudentSelect students={students} value={studentId} onChange={setStudentId} /></Field>
          <Field label="날짜"><input type="date" className={inputCls} style={inputStyle} value={date} onChange={e => setDate(e.target.value)} /></Field>
        </div>
        <div className="flex flex-col gap-2">
          <p className="text-[11px]" style={{ color: "#8a7f5e" }}>진도수업: N=새로 배움 · R=복습 중 · D=다시 진행(재학습) &nbsp;|&nbsp; 개념복습: P=진행중 · C=완료 &nbsp;|&nbsp; 숙제: 완료=기한 내 · 기한초과 · 미제출</p>
          {items.map(it => {
            if (it.kind === "count") {
              return (
                <div key={it.key} className="flex items-center gap-2 p-2 rounded-lg" style={{ background: "#efe6d0" }}>
                  <span className="text-sm w-16 flex-shrink-0" style={{ color: "#2b2417" }}>{it.label}</span>
                  <input type="number" min="0" className={inputCls} style={inputStyle} placeholder="0" value={it.result} onChange={e => updateItem(it.key, "result", e.target.value)} />
                  <span className="text-xs flex-shrink-0" style={{ color: "#7a6f52" }}>{it.unit}</span>
                </div>
              );
            }
            if (it.key === "homework") {
              const hwAutoStatus = todaysHomeworks.length === 0 ? null :
                todaysHomeworks.some(h => !h.submitted) ? "미제출" :
                todaysHomeworks.some(h => h.submittedLate) ? "기한초과" : "완료";
              return (
                <div key={it.key} className="flex flex-col gap-1.5 p-2 rounded-lg" style={{ background: "#efe6d0" }}>
                  <span className="text-sm" style={{ color: "#2b2417" }}>{it.label}</span>
                  {todaysHomeworks.length === 0 ? (
                    <p className="text-[11px]" style={{ color: "#8a7f5e" }}>참고 — 이 날짜 기한인 숙제가 없어요</p>
                  ) : (
                    <div className="flex flex-col gap-1.5">
                      {todaysHomeworks.map(h => {
                        const isLate = h.submittedLate;
                        const timeStr = h.submittedAt ? new Date(h.submittedAt).toLocaleTimeString("ko-KR", { hour: "2-digit", minute: "2-digit" }) : "";
                        const photoCount = (h.photos || (h.photo ? [h.photo] : [])).length;
                        const submittedDateStr = h.submittedAt ? h.submittedAt.slice(0, 10) : null;
                        const studyBlocks = (submittedDateStr && studentId) ? data.plannerBlocks.filter(b => b.studentId === studentId && b.date === submittedDateStr && b.done) : [];
                        const studyTotal = studyBlocks.reduce((s, b) => s + minutesBetween(b.start, b.end), 0);
                        const studyBySubj = {};
                        studyBlocks.forEach(b => { if (b.subject) studyBySubj[b.subject] = (studyBySubj[b.subject] || 0) + minutesBetween(b.start, b.end); });
                        return (
                          <div key={h.id} className="flex flex-col gap-1 text-[11px] px-2 py-1.5 rounded-md" style={{ background: "#fffcf6" }}>
                            <div className="flex items-center justify-between">
                              <span style={{ color: "#4a4332" }}>{h.title} ({h.date}){photoCount > 0 && ` · 질문 ${photoCount}개`}</span>
                              <span className="font-semibold" style={{ color: !h.submitted ? "var(--coral)" : (isLate ? "var(--coral)" : "#4c8c5f") }}>
                                {!h.submitted ? "미제출" : (isLate ? `제출 (${timeStr})` : `제출 (${timeStr})`)}
                              </span>
                            </div>
                            {isLate && <p className="text-[10px]" style={{ color: "var(--coral)" }}>제출기한을 초과했습니다</p>}
                            {studyTotal > 0 && (
                              <div className="flex items-center gap-1.5 flex-wrap">
                                <span style={{ color: "#8a7f5e" }}>{submittedDateStr} 순공시간</span>
                                <span className="font-bold" style={{ color: "var(--gold)" }}>{formatMinutes(studyTotal)}</span>
                                {Object.entries(studyBySubj).map(([subj, min]) => (
                                  <span key={subj} className="text-[9px] font-semibold px-1.5 py-0.5 rounded-full text-white" style={{ background: colorForSubject(subj, studentSubjectList(data, studentId)) }}>{subj} {formatMinutes(min)}</span>
                                ))}
                              </div>
                            )}

                        );
                      })}

                    <span className="text-sm w-16 flex-shrink-0" style={{ color: "#2b2417" }}>{it.label}</span>
                    <div className="ml-auto flex gap-1.5 flex-wrap justify-end">
                      {it.options.map(opt => (
                        <button key={opt.value} onClick={() => updateItem(it.key, "result", opt.value)} className="px-2.5 py-1.5 rounded-full text-[11px] font-bold"

                      ))}

                  </div>
                  <input className={inputCls} style={{ ...inputStyle, padding: "6px 10px" }} placeholder="공부한 단원 (예: 이차함수의 최대·최소)" value={it.note || ""} onChange={e => updateItem(it.key, "note", e.target.value)} />
                </div>
              );
            }
            return (
              <div key={it.key} className="flex items-center gap-2 p-2 rounded-lg" style={{ background: "#efe6d0" }}>
                <span className="text-sm w-16 flex-shrink-0" style={{ color: "#2b2417" }}>{it.label}</span>
                <button onClick={() => updateItem(it.key, "result", !it.result)} className="ml-auto px-3 py-1.5 rounded-full text-xs font-semibold"
                  style={{ background: it.result ? "#4c8c5f" : "#e4d8ba", color: it.result ? "#fff" : "#5c543e" }}>{it.result ? "완료" : "미완료"}</button>
              </div>
            );
          })}
          {practiceCount > 0 && (
            <div className="p-3 rounded-lg flex flex-col gap-1.5" style={{ background: "#fffcf6", border: "1px solid #e4d8ba" }}>
              <div className="flex items-center justify-between text-sm">
                <span style={{ color: "#2b2417" }}>오늘 {practiceCount}문제 풀이 · 오답 {wrongCount}문제</span>
                <span className="font-bold" style={{ color: accuracy >= 80 ? "#4c8c5f" : accuracy >= 60 ? "var(--gold)" : "var(--coral)" }}>정답률 {accuracy}%</span>
              </div>
              <div className="w-full h-2 rounded-full overflow-hidden" style={{ background: "#f8e3c9" }}>
                <div className="h-full rounded-full" style={{ width: `${accuracy}%`, background: accuracy >= 80 ? "#4c8c5f" : accuracy >= 60 ? "var(--gold)" : "var(--coral)" }} />
              </div>
            </div>
          )}
        </div>
        <div className="grid grid-cols-2 gap-3">
          <Field label="오늘의 평가 (시험명)"><input className={inputCls} style={inputStyle} value={testName} onChange={e => setTestName(e.target.value)} placeholder="예: 함수 단원 TEST" /></Field>

        <p className="text-[11px] -mt-1" style={{ color: "#8a7f5e" }}>시험명과 점수를 넣으면 "테스트 결과" 기록과 성적 추이에도 자동으로 들어가요. 시험 코멘트는 월간 리포트에 [시험 유형]과 함께 표시돼요.</p>
        <Field label="선생님 코멘트"><textarea rows={2} className={inputCls} style={inputStyle} value={comment} onChange={e => setComment(e.target.value)} placeholder="오늘 개념 이해는 좋았습니다..." /></Field>

          <button onClick={save} className="px-4 py-2 rounded-lg text-sm font-semibold flex items-center gap-1" style={btnGold}>{editingId ? <Pencil size={16} /> : <Plus size={16} />}{editingId ? "수정 저장" : "저장하고 알림 생성"}</button>

        </div>
        <div className="flex items-center justify-between gap-2 mb-3 flex-wrap">

          <ul className="flex flex-col gap-2">

              const p = (r.items || []).find(it => it.key === "practice");
              const w = (r.items || []).find(it => it.key === "wrong");
              const pc = Number(p?.result) || 0, wc = Number(w?.result) || 0;
              const acc = pc > 0 ? Math.round(((pc - wc) / pc) * 100) : null;
              return (
                <li key={r.id} className="p-3 rounded-lg" style={{ background: editingId === r.id ? "#f8e3c9" : "#efe6d0" }}>
                  <div className="flex items-center justify-between">
                    <span className="text-sm" style={{ color: "#2b2417" }}><b>{studentName(r.studentId)}</b> · {r.date}</span>

                      {(r.items || []).filter(it => it.kind === "choice" && it.result).map(it => (
                        <span key={it.key} className="text-[10px] font-bold px-1.5 py-0.5 rounded-full" style={{ background: "#e4d8ba", color: "#5c543e" }}>{it.result}</span>
                      ))}
                      <button onClick={() => editRoutine(r)} className="p-1 rounded-md" style={{ background: "#efe3c8" }}><Pencil size={12} color="#5c543e" /></button>
                      <button onClick={() => removeRoutine(r.id)} className="p-1 rounded-md" style={{ background: "#efe3c8" }}><Trash2 size={12} color="var(--coral)" /></button>
                    </div>
                  </div>
                  {pc > 0 && <div className="text-xs mt-1" style={{ color: "#7a6f52" }}>{pc}문제 풀이 · 오답 {wc} · 정답률 {acc}%</div>}
                  {r.testName && <div className="text-xs mt-1" style={{ color: "#7a6f52" }}>{r.testName} {r.testScore}점</div>}
                </li>
              );
            })}
          </ul>
        )}
      </div>
    </div>
  );
}

// ================= 주간 루틴 =================
function buildDailyReportText(student, date, items, testName, testScore, comment, score, attendance) {
  const lines = [];
  lines.push("🌱 오늘의 ROUTINE");
  lines.push(`${student?.name || ""} / ${student?.grade || ""}`);
  lines.push("");
  if (attendance) {
    lines.push(`출결: ${attendance.status}${attendance.time ? ` (${attendance.time})` : ""}`);
  } else {
    lines.push("출결: 기록 없음");
  }
  lines.push("");
  lines.push("오늘 할 일 · 결과");
  const practiceItem = items.find(it => it.key === "practice");
  const wrongItem = items.find(it => it.key === "wrong");
  const pc = Number(practiceItem?.result) || 0, wc = Number(wrongItem?.result) || 0;
  items.forEach(it => {
    if (it.key === "wrong") return; // 문제풀이 줄에서 함께 표기
    if (it.key === "practice") {
      if (pc > 0) {
        const acc = Math.max(0, Math.min(100, Math.round(((pc - wc) / pc) * 100)));
        lines.push(`문제풀이 · ${pc}문제 (오답 ${wc}문제 · 정답률 ${acc}%)`);
      } else {
        lines.push(`문제풀이 · 기록 없음`);
      }
    } else if (it.kind === "boolean") {
      let statusText = "해당없음";
      if (it.result !== null) {
        if (it.result) statusText = "✅ 제출완료";
        else statusText = it.overdue ? "❌ 기한 초과" : "❌ 미완료";
      }
      lines.push(`${it.label} · ${statusText}`);
    } else if (it.kind === "choice") {
      const opt = (it.options || []).find(o => o.value === it.result);
      lines.push(`${it.label} · ${opt ? `${opt.value} (${opt.label})` : "-"}${it.note ? (it.note.includes("\n") ? `\n${it.note}` : ` — ${it.note}`) : ""}`);
    }
  });
  if (testName) {
    lines.push("");
    lines.push("오늘의 평가");
    lines.push(testName);
    lines.push(`${testScore}점`);
  }
  if (comment) {
    lines.push("");
    lines.push("선생님 코멘트");
    lines.push(comment);
  }
  return lines.join("\n");
}

function buildWeeklyReportText(student, weekStart, itemAverages, overall, testAvg, avgPracticeCount, avgAccuracy, reviewBreakdown, struggleStreak) {
  const lines = [];
  lines.push("📊 주간 ROUTINE");
  lines.push(`${student?.name || ""} / ${student?.grade || ""}`);
  lines.push("");
  lines.push(`이번 주 실제 달성률 ${overall === null ? "-" : `${overall}%`}`);
  lines.push("");
  if (struggleStreak >= 3) lines.push(`⚠️ 개념복습 완료 후 ${struggleStreak}회 연속 진행중 — 진도수업 재학습 권장`);
  itemAverages.forEach(it => {
    lines.push(`${it.label} ${it.avg === null ? "기록없음" : `${it.avg}%`}`);
  });
  if (avgPracticeCount !== null) lines.push(`하루 평균 문제풀이 ${avgPracticeCount}문제`);
  if (avgAccuracy !== null) lines.push(`평균 정답률 ${avgAccuracy}%`);
  if (testAvg !== null) lines.push(`테스트 평균 ${testAvg}점`);
  return lines.join("\n");
}

function weeklyPlannerTaskRate(data, studentId, weekStart) {
  const tasks = (data.plannerTasks || []).filter(t => t.studentId === studentId && mondayOf(t.date) === weekStart);
  if (tasks.length === 0) return null;
  const done = tasks.filter(t => t.done).length;
  return Math.round((done / tasks.length) * 100);
}

function monthlyPlannerTaskRate(data, studentId, monthStr) {
  const tasks = (data.plannerTasks || []).filter(t => t.studentId === studentId && t.date.slice(0, 7) === monthStr);
  if (tasks.length === 0) return null;
  const done = tasks.filter(t => t.done).length;
  return Math.round((done / tasks.length) * 100);
}

function monthlyRoutineStats(data, studentId, monthStr) {
  const monthRoutines = data.routines.filter(r => r.studentId === studentId && r.date.slice(0, 7) === monthStr);
  const perItem = {};
  ROUTINE_ITEM_DEFS.forEach(def => { perItem[def.key] = []; });
  const practiceCounts = [];
  const accuracies = [];
  monthRoutines.forEach(r => {
    const items = r.items || [];
    const practiceItem = items.find(it => it.key === "practice");
    const wrongItem = items.find(it => it.key === "wrong");
    const pc = Number(practiceItem?.result) || 0;
    const wc = Number(wrongItem?.result) || 0;
    if (pc > 0) {
      practiceCounts.push(pc);
      accuracies.push(Math.max(0, Math.min(100, Math.round(((pc - wc) / pc) * 100))));
    }
    items.forEach(it => {
      if (it.key === "wrong" || it.key === "practice" || it.key === "class" || it.key === "review") return; // 따로 집계
      if (it.key === "homework") {
        if (!it.result) return;
        const hwRate = it.result === "완료" ? 100 : (it.result === "기한초과" ? 50 : 0);
        perItem.homework.push(hwRate);
        return;
      }
      const rate = (it.kind === "boolean" || it.kind === "choice") ? (it.result ? 100 : 0) : 0;
      if (rate !== null && perItem[it.key]) perItem[it.key].push(rate);
    });
  });
  const itemAverages = ROUTINE_ITEM_DEFS.filter(def => def.key !== "wrong" && def.key !== "practice" && def.key !== "class" && def.key !== "review").map(def => {
    const arr = perItem[def.key];
    return { ...def, avg: arr.length ? Math.round(arr.reduce((a, b) => a + b, 0) / arr.length) : null };
  });
  const avgPracticeCount = practiceCounts.length ? Math.round(practiceCounts.reduce((a, b) => a + b, 0) / practiceCounts.length) : null;
  const avgAccuracy = accuracies.length ? Math.round(accuracies.reduce((a, b) => a + b, 0) / accuracies.length) : null;
  const validAverages = itemAverages.filter(x => x.avg !== null).map(x => x.avg);
  const overall = validAverages.length ? Math.round(validAverages.reduce((a, b) => a + b, 0) / validAverages.length) : null;
  const testScores = monthRoutines.filter(r => r.testScore != null).map(r => r.testScore);
  const testAvg = testScores.length ? Math.round(testScores.reduce((a, b) => a + b, 0) / testScores.length) : null;
  return { monthRoutines, itemAverages, overall, testAvg, avgPracticeCount, avgAccuracy };
}

function monthlyStudyMinutes(data, studentId, monthStr) {
  return data.plannerBlocks.filter(b => b.studentId === studentId && b.done && b.date.slice(0, 7) === monthStr)
    .reduce((s, b) => s + minutesBetween(b.start, b.end), 0);
}

function monthlyHomeworkSubmitRate(data, studentId, monthStr) {
  const hws = data.homeworks.filter(h => h.studentId === studentId && (h.dueDate || h.date).slice(0, 7) === monthStr);
  if (hws.length === 0) return null;
  const onTime = hws.filter(h => h.submitted && !h.submittedLate).length;
  return Math.round((onTime / hws.length) * 100);
}

function monthlyHomeworkCounts(data, studentId, monthStr) {
  const hws = data.homeworks.filter(h => h.studentId === studentId && (h.dueDate || h.date).slice(0, 7) === monthStr);
  const onTime = hws.filter(h => h.submitted && !h.submittedLate).length;
  const late = hws.filter(h => h.submitted && h.submittedLate).length;
  const missing = hws.filter(h => !h.submitted).length;
  return { onTime, late, missing };
}

// ===== 월간 리포트 계산 헬퍼 =====
function assignedTeacherName(data, classGroup) {
  const t = data.teachers.find(t => (t.classGroups || []).includes(classGroup));
  return t?.name || "원장";
}

function attendanceStatsForMonth(data, studentId, monthStr) {
  const records = data.attendance.filter(a => a.studentId === studentId && a.date.slice(0, 7) === monthStr);
  const present = records.filter(a => a.status === "출석").length;
  const late = records.filter(a => a.status === "지각").length;
  const absent = records.filter(a => a.status === "결석").length;
  const total = present + late + absent;
  const rate = total > 0 ? Math.round(((present + late) / total) * 100) : null;
  return { present, late, absent, total, rate };
}

function progressExecutionRate(data, studentId, monthStr) {
  const monthRoutines = data.routines.filter(r => r.studentId === studentId && r.date.slice(0, 7) === monthStr);
  if (monthRoutines.length === 0) return null;
  const withProgress = monthRoutines.filter(r => {
    const classItem = (r.items || []).find(it => it.key === "class");
    return classItem && (classItem.result === "N" || classItem.result === "R");
  }).length;
  return Math.round((withProgress / monthRoutines.length) * 100);
}

function conceptUnderstandingRate(data, studentId, monthStr) {
  const monthRoutines = data.routines.filter(r => r.studentId === studentId && r.date.slice(0, 7) === monthStr);
  let p = 0, c = 0;
  monthRoutines.forEach(r => {
    const reviewItem = (r.items || []).find(it => it.key === "review");
    if (reviewItem?.result === "P") p++;
    else if (reviewItem?.result === "C") c++;
  });
  if (p + c === 0) return null;
  return Math.round((c / (p + c)) * 100);
}

function dailyTestStatsForMonth(data, studentId, monthStr) {
  const allTests = data.tests.filter(t => t.studentId === studentId && t.date.slice(0, 7) === monthStr);
  const avgTests = allTests.filter(t => t.testType === "일일테스트" || t.testType === "주간테스트");
  const avg = avgTests.length > 0 ? Math.round(avgTests.reduce((s, t) => s + t.score, 0) / avgTests.length) : null;
  return { totalCount: allTests.length, avg };
}

function formalTestComparison(data, studentId, type, monthStr) {
  const monthEnd = `${monthStr}-31`;
  const list = data.tests.filter(t => t.studentId === studentId && t.testType === type && t.date <= monthEnd).sort((a, b) => b.date.localeCompare(a.date));
  return { current: list[0] || null, previous: list[1] || null };
}

function allTestsTrendForMonth(data, studentId, monthStr) {
  return data.tests.filter(t => t.studentId === studentId && t.date.slice(0, 7) === monthStr).sort((a, b) => a.date.localeCompare(b.date));
}

// 최근 N개월(이번 달 포함) 동안의 특정 유형 테스트
function testsTrendRecentMonths(data, studentId, monthStr, types, months) {
  const [y, m] = monthStr.split("-").map(Number);
  const start = new Date(y, m - months, 1);
  const startStr = `${start.getFullYear()}-${String(start.getMonth() + 1).padStart(2, "0")}`;
  return data.tests.filter(t => t.studentId === studentId && types.includes(t.testType || "일일테스트") && t.date.slice(0, 7) >= startStr && t.date.slice(0, 7) <= monthStr)
    .sort((a, b) => a.date.localeCompare(b.date));
}

const TREND_TYPE_COLORS = { "일일테스트": "#e2822f", "주간테스트": "#3d9a50", "월말테스트": "#3b6fb6", "누적테스트": "#8a4fb0" };

// 여러 유형을 한 그래프에: 유형마다 색이 다른 선. 가로축은 날짜 순서(같은 날짜는 같은 위치)
function MultiTypeTrendChart({ tests }) {
  const w = 600, h = 180, padL = 26, padR = 18, padT = 22, padB = 22;
  const dates = [...new Set(tests.map(t => t.date))].sort();
  const n = dates.length;
  const xFor = (d) => n === 1 ? (padL + w - padR) / 2 : padL + dates.indexOf(d) * ((w - padL - padR) / (n - 1));
  const yFor = (score) => padT + (1 - Math.max(0, Math.min(100, score)) / 100) * (h - padT - padB);
  const byType = TEST_TYPES.map(tp => ({ tp, list: tests.filter(t => (t.testType || "일일테스트") === tp) })).filter(g => g.list.length > 0);
  return (
    <svg viewBox={`0 0 ${w} ${h}`} width="100%" height={h} style={{ WebkitPrintColorAdjust: "exact", printColorAdjust: "exact" }}>
      <line x1={padL} y1={padT} x2={padL} y2={h - padB} stroke="#e4d8ba" />
      <line x1={padL} y1={h - padB} x2={w - padR} y2={h - padB} stroke="#e4d8ba" />
      {byType.map(g => g.list.length > 1 && (
        <polyline key={g.tp} points={g.list.map(t => `${xFor(t.date)},${yFor(t.score)}`).join(" ")} fill="none" stroke={TREND_TYPE_COLORS[g.tp]} strokeWidth="2.5" />
      ))}
      {byType.map(g => g.list.map(t => (
        <g key={t.id}>
          <circle cx={xFor(t.date)} cy={yFor(t.score)} r="4.5" fill={TREND_TYPE_COLORS[g.tp]} />
          <text x={xFor(t.date)} y={yFor(t.score) - 9} fontSize="10" fill={TREND_TYPE_COLORS[g.tp]} fontWeight="700" textAnchor="middle" fontFamily="'Noto Sans KR', sans-serif">{t.score}</text>
        </g>
      )))}
      {dates.map(d => <text key={d} x={xFor(d)} y={h - 5} fontSize="9" fill="#7a6f52" textAnchor="middle" fontFamily="'Noto Sans KR', sans-serif">{d.slice(5)}</text>)}
    </svg>
  );
}

function TestTrendChart({ trend, color, colorByType, dateFormat }) {
  if (trend.length === 0) return <p className="text-xs" style={{ color: "#7a6f52" }}>기록이 없어요.</p>;
  const w = 600, h = 160, padL = 26, padR = 14, padT = 20, padB = 22;
  const n = trend.length;
  const xFor = (i) => n === 1 ? (padL + w - padR) / 2 : padL + i * ((w - padL - padR) / (n - 1));
  const yFor = (score) => padT + (1 - Math.max(0, Math.min(100, score)) / 100) * (h - padT - padB);
  const lineColor = color || "var(--gold)";
  const dotColor = (t) => colorByType ? (TREND_TYPE_COLORS[t.testType || "일일테스트"] || lineColor) : lineColor;
  const points = trend.map((t, i) => `${xFor(i)},${yFor(t.score)}`).join(" ");
  const fmt = (d) => dateFormat === "month" ? `${Number(d.slice(5, 7))}월` : d.slice(5);
  return (
    <svg viewBox={`0 0 ${w} ${h}`} width="100%" height={h}>
      <line x1={padL} y1={padT} x2={padL} y2={h - padB} stroke="#e4d8ba" />
      <line x1={padL} y1={h - padB} x2={w - padR} y2={h - padB} stroke="#e4d8ba" />
      {n > 1 && <polyline points={points} fill="none" stroke={colorByType ? "#c9b98f" : lineColor} strokeWidth="2.5" />}
      {trend.map((t, i) => (
        <g key={t.id || i}>
          <circle cx={xFor(i)} cy={yFor(t.score)} r="4.5" fill={dotColor(t)} />
          <text x={xFor(i)} y={yFor(t.score) - 9} fontSize="10" fill="#4a4332" textAnchor="middle" fontFamily="'Noto Sans KR', sans-serif">{t.score}</text>
          <text x={xFor(i)} y={h - 5} fontSize="9" fill="#7a6f52" textAnchor="middle" fontFamily="'Noto Sans KR', sans-serif">{fmt(t.date)}</text>
        </g>
      ))}
    </svg>
  );
}

// 월간 리포트 직접 입력 칸. 입력 내용은 리포트 화면의 임시 내용(draft)에 바로 반영되고, "임시저장"을 눌러야 서버에 저장됨.
function ManualField({ label, value, onSave, placeholder, multiline, editable, minHeight }) {
  const local = value || "";
  const setLocal = (v) => onSave(v);
  const commit = () => {};
  return (
    <div>
      {label && <div className="text-xs mb-1" style={{ color: "#7a6f52" }}>{label}</div>}
      {editable ? (
        multiline ? (
          <textarea className="w-full rounded-lg px-2 py-1.5 text-sm" style={{ ...inputStyle, minHeight: minHeight || 54 }} value={local} onChange={e => setLocal(e.target.value)} onBlur={commit} placeholder={placeholder} />
        ) : (
          <input className="w-full rounded-lg px-2 py-1.5 text-sm" style={inputStyle} value={local} onChange={e => setLocal(e.target.value)} onBlur={commit} placeholder={placeholder} />
        )
      ) : (
        <div className="text-sm" style={{ color: "#2b2417", whiteSpace: "pre-line" }}>{value || "-"}</div>
      )}
    </div>
  );
}

// ================= 진도표 (반별·개별) =================
const PROGRESS_YELLOW = "#f1dc3c"; // 이미 진행한 진도
const PROGRESS_GREEN = "#3d9a50";  // 이번 주 진도

// 해당 월의 주 목록 (월 단위로 끊음). 월~일 기준으로 나누되 그 달 날짜만 포함.
// 달 첫머리·끝에 2일 이하로 남는 조각은 옆 주에 붙임. 예) 8/1-8/2 → 8/1-8/9, 8/31 → 8/24-8/31
function progressWeeksOfMonth(month) {
  const [y, m] = month.split("-").map(Number);
  const first = `${month}-01`;
  const last = `${month}-${String(new Date(y, m, 0).getDate()).padStart(2, "0")}`;
  const md = (d) => `${Number(d.slice(5, 7))}/${Number(d.slice(8, 10))}`;
  const days = (a, b) => Math.round((Date.parse(b) - Date.parse(a)) / 86400000) + 1;
  const segs = [];
  for (let mon = mondayOf(first); mon <= last; mon = addDaysToDateStr(mon, 7)) {
    const sun = addDaysToDateStr(mon, 6);
    segs.push({ from: mon < first ? first : mon, to: sun > last ? last : sun });
  }
  if (segs.length > 1 && days(segs[0].from, segs[0].to) <= 2) { segs[1].from = segs[0].from; segs.shift(); }
  if (segs.length > 1 && days(segs[segs.length - 1].from, segs[segs.length - 1].to) <= 2) { segs[segs.length - 2].to = segs[segs.length - 1].to; segs.pop(); }
  return segs.map(g => ({ key: g.from, label: `${md(g.from)}-${md(g.to)}` }));
}

function progressCellKeys(chart) {
  return (chart.units || []).flatMap(u => Array.from({ length: Math.max(1, Number(u.cells) || 1) }, (_, i) => `${u.id}:${i}`));
}

// 학생 리포트에 보여줄 진도표: 그 학생의 개별 진도표 + 학생이 속한 반의 진도표
// 반 진도 → 개별 진도, 같은 과정의 교재끼리 붙어 있도록 정렬
function sortProgressCharts(list) {
  return [...list].sort((a, b) =>
    (a.ownerType === b.ownerType ? 0 : a.ownerType === "class" ? -1 : 1) ||
    (a.classGroup || a.studentId || "").localeCompare(b.classGroup || b.studentId || "") ||
    a.title.localeCompare(b.title) ||
    (a.createdAt || "").localeCompare(b.createdAt || ""));
}

function progressChartsForStudent(data, student) {
  if (!student) return [];
  return sortProgressCharts((data.progressCharts || []).filter(c =>
    (c.ownerType === "student" && c.studentId === student.id) ||
    (c.ownerType === "class" && c.classGroup && c.classGroup === student.classGroup)
  ));
}

function ProgressChartGrid({ chart, month, editable, onChange, ownerLabel }) {
  const weeks = progressWeeksOfMonth(month);
  const units = chart.units || [];
  const marks = chart.marks || {};
  const hasSubLabels = units.some(u => (u.labels || []).some(Boolean));

  // 칸마다 직접 지정: "" (빈칸) → "g" (초록·이번 주 진도) → "y" (노랑·이미 진행한 진도) → "" …
  // 예전 형식(초록 칸 id 배열)도 그대로 읽음
  const weekMap = (weekKey) => {
    const m = marks[weekKey];
    if (Array.isArray(m)) return Object.fromEntries(m.map(c => [c, "g"]));
    return m || {};
  };
  // 누를 때마다 초록 ↔ 노랑. 잘못 누른 칸은 "지우개"를 켜고 누르면 빈칸이 됨
  const NEXT_STATE = { "": "g", g: "y", y: "g" };
  const [eraser, setEraser] = useState(false);
  const toggleWeek = (weekKey, cell) => {
    const cur = { ...weekMap(weekKey) };
    if (eraser) delete cur[cell];
    else cur[cell] = NEXT_STATE[cur[cell] || ""];
    onChange({ ...chart, marks: { ...marks, [weekKey]: cur } });
  };
  // 이 달의 빈칸을 한 번에 모두 초록으로 (이미 노랑으로 바꾼 칸은 그대로 둠)
  const allCells = progressCellKeys(chart);
  const fillAllGreen = () => {
    const next = { ...marks };
    weeks.forEach(w => {
      const cur = { ...weekMap(w.key) };
      allCells.forEach(c => { if (!cur[c]) cur[c] = "g"; });
      next[w.key] = cur;
    });
    setEraser(false);
    onChange({ ...chart, marks: next });
  };

  const cellBorder = "1px solid #2b2417";
  const headStyle = { border: cellBorder, background: "#e8eef7", color: "#2b2417", padding: "4px 6px", fontWeight: 600 };
  const cellStyle = (color, clickable) => ({ border: cellBorder, background: color || "#fff", minWidth: 34, height: 30, cursor: clickable ? "pointer" : "default", WebkitPrintColorAdjust: "exact", printColorAdjust: "exact" });
  const Row = ({ label, colorOf, onCell, labelStyle }) => (
    <tr>
      <td style={{ ...headStyle, background: "#f4f6fa", whiteSpace: "nowrap", fontWeight: 500, ...labelStyle }}>{label}</td>
      {units.map(u => Array.from({ length: Math.max(1, Number(u.cells) || 1) }, (_, i) => {
        const cell = `${u.id}:${i}`;
        return <td key={cell} style={cellStyle(colorOf(cell), !!onCell)} onClick={onCell ? () => onCell(cell) : undefined} />;
      }))}
    </tr>
  );

  return (
    <div className="flex flex-col gap-1.5">
      <div className="flex items-center justify-between gap-2 flex-wrap">
        <div className="flex items-center gap-1.5 text-sm font-bold" style={{ color: "#2b2417" }}>
          {ownerLabel && <span className="text-[10px] px-1.5 py-0.5 rounded font-semibold" style={{ background: "#e4d8ba", color: "#5c543e" }}>{ownerLabel}</span>}
          {chart.title}{chart.textbook ? <span className="text-xs font-normal" style={{ color: "#7a6f52" }}> · {chart.textbook}</span> : null}
        </div>
        <div className="flex items-center gap-2 text-[11px]" style={{ color: "#4a4332" }}>
          <span className="flex items-center gap-1"><span className="inline-block w-3.5 h-3.5" style={{ background: PROGRESS_YELLOW, border: "1px solid #999", WebkitPrintColorAdjust: "exact", printColorAdjust: "exact" }} />이미 진행한 진도</span>
          <span className="flex items-center gap-1"><span className="inline-block w-3.5 h-3.5" style={{ background: PROGRESS_GREEN, border: "1px solid #999", WebkitPrintColorAdjust: "exact", printColorAdjust: "exact" }} />이번 주 진도</span>
          {editable && (
            <button onClick={fillAllGreen} className="px-2 py-0.5 rounded-md text-[11px] font-semibold" style={{ background: PROGRESS_GREEN, color: "#fff" }}>
              모두 초록
            </button>
          )}
          {editable && (
            <button onClick={() => setEraser(!eraser)} className="px-2 py-0.5 rounded-md text-[11px] font-semibold" style={eraser ? { background: "var(--coral)", color: "#fff" } : { border: "1px solid #ddcda0", color: "#5c543e", background: "#fffaf0" }}>
              🧽 지우개 {eraser ? "켜짐" : ""}
            </button>
          )}
        </div>
      </div>
      <div style={{ overflowX: "auto" }}>
        <table style={{ borderCollapse: "collapse", fontSize: 12, width: "100%" }}>
          <thead>
            <tr>
              <th rowSpan={hasSubLabels ? 2 : 1} style={{ ...headStyle, whiteSpace: "nowrap" }}>{chart.textbook || "주차"}</th>
              {units.map(u => <th key={u.id} colSpan={Math.max(1, Number(u.cells) || 1)} style={headStyle}>{u.name}</th>)}
            </tr>
            {hasSubLabels && (
              <tr>
                {units.map(u => Array.from({ length: Math.max(1, Number(u.cells) || 1) }, (_, i) => (
                  <th key={`${u.id}:${i}`} style={{ ...headStyle, fontSize: 10, fontWeight: 500 }}>{(u.labels || [])[i] || ""}</th>
                )))}
              </tr>
            )}
          </thead>
          <tbody>
            {weeks.map(w => {
              const wm = weekMap(w.key);
              return <Row key={w.key} label={w.label} colorOf={c => wm[c] === "g" ? PROGRESS_GREEN : wm[c] === "y" ? PROGRESS_YELLOW : null} onCell={editable ? (c => toggleWeek(w.key, c)) : null} />;
            })}
          </tbody>
        </table>
      </div>
      {editable && <p className="text-[11px]" style={{ color: "#8a7f5e" }}>{eraser ? <b style={{ color: "var(--coral)" }}>지우개가 켜져 있어요. 누른 칸이 빈칸이 돼요. 다 지웠으면 지우개를 다시 눌러 꺼주세요.</b> : <><b>"모두 초록"</b>을 누르면 이 달의 빈칸이 한 번에 초록이 돼요. 그다음 노랑으로 바꿀 칸만 누르면 돼요. (다시 누르면 초록으로 돌아가요.) 잘못 칠한 칸은 "지우개"를 켜고 누르면 빈칸이 돼요.</>}</p>}
    </div>
  );
}

function ProgressChartTab({ data, setData, scopeClassGroups }) {
  const charts = data.progressCharts || [];
  const scopedStudents = studentsInScope(data.students, scopeClassGroups);
  const scopedIds = new Set(scopedStudents.map(s => s.id));
  const classOptions = [...new Set([...CLASS_GROUPS, ...data.students.map(s => s.classGroup).filter(Boolean)])]
    .filter(g => !scopeClassGroups || !scopeClassGroups.length || scopeClassGroups.includes(g));
  const visible = sortProgressCharts(charts.filter(c => c.ownerType === "class" ? classOptions.includes(c.classGroup) : scopedIds.has(c.studentId)));
  const studentName = (id) => data.students.find(s => s.id === id)?.name || "-";
  const ownerText = (c) => c.ownerType === "class" ? `반 · ${c.classGroup}` : `개별 · ${studentName(c.studentId)}`;

  const [selectedId, setSelectedId] = useState(null); // 펼친 진도표 (null = 아직 안 고름 → 첫 번째를 펼침, "" = 모두 접음)
  const [month, setMonth] = useState(todayStr().slice(0, 7));
  const [form, setForm] = useState(null); // 새로 만들기·구조 수정 중인 진도표
  // 선택한 진도표가 없으면(새로고침 직후 등) 첫 번째 진도표를 자동으로 보여줌
  const selected = selectedId === null ? visible[0] : visible.find(c => c.id === selectedId);

  const blankForm = () => ({ id: "", title: "", textbook: "", ownerType: "class", classGroup: classOptions[0] || "", studentId: "", units: [{ id: uid(), name: "", cells: 2, labelsText: "" }] });
  const toForm = (c) => ({ ...c, units: (c.units || []).map(u => ({ ...u, labelsText: (u.labels || []).join(", ") })) });
  const saveChart = (chart) => setData({ ...data, progressCharts: charts.map(c => c.id === chart.id ? chart : c) });

  const submitForm = () => {
    if (!form.title.trim()) return alert("과정 이름을 입력해 주세요.");
    if (form.ownerType === "class" && !form.classGroup) return alert("반을 선택해 주세요.");
    if (form.ownerType === "student" && !form.studentId) return alert("학생을 선택해 주세요.");
    const units = form.units.filter(u => u.name.trim()).map(u => ({ id: u.id, name: u.name.trim(), cells: Math.min(20, Math.max(1, Number(u.cells) || 1)), labels: u.labelsText.split(",").map(x => x.trim()) }));
    if (units.length === 0) return alert("단원을 하나 이상 입력해 주세요.");
    const base = { title: form.title.trim(), textbook: form.textbook.trim(), ownerType: form.ownerType, classGroup: form.ownerType === "class" ? form.classGroup : "", studentId: form.ownerType === "student" ? form.studentId : "", units };
    if (form.id) {
      const prev = charts.find(c => c.id === form.id);
      saveChart({ ...prev, ...base });
    } else {
      const chart = { id: uid(), ...base, marks: {}, createdAt: new Date().toISOString() };
      setData({ ...data, progressCharts: [...charts, chart] });
      setSelectedId(chart.id);
    }
    setForm(null);
  };
  // 같은 과정에 교재 추가: 단원 구성을 그대로 복사하고 진도 표시는 비운 새 진도표를 만듦 (단원이 다르면 복사 후 구조 수정)
  const addTextbook = (c) => {
    const name = window.prompt(`"${c.title}" 과정에 추가할 교재 이름을 입력하세요.\n(단원 구성이 그대로 복사돼요. 다르면 만든 뒤 구조 수정에서 바꿔주세요.)`, "");
    if (!name || !name.trim()) return;
    const copy = { ...c, id: uid(), textbook: name.trim(), units: (c.units || []).map(u => ({ ...u })), marks: {}, createdAt: new Date().toISOString() };
    setData({ ...data, progressCharts: [...charts, copy] });
    setSelectedId(copy.id);
  };
  const removeChart = (c) => {
    if (!window.confirm(`"${c.title}" (${ownerText(c)}) 진도표를 삭제할까요?\n표시한 진도 기록도 함께 지워져요.`)) return;
    setData({ ...data, progressCharts: charts.filter(x => x.id !== c.id) });
    if (selected?.id === c.id) setSelectedId("");
  };
  const setUnit = (idx, patch) => setForm({ ...form, units: form.units.map((u, i) => i === idx ? { ...u, ...patch } : u) });

  return (
    <div className="flex flex-col gap-4">
      <div className="rounded-2xl p-4 flex flex-col gap-3" style={panel}>
        <div className="flex items-center justify-between gap-2 flex-wrap">
          <h3 className="font-bold" style={{ fontFamily: "'Noto Serif KR', serif" }}>진도표 ({visible.length})</h3>
          {!form && <button onClick={() => setForm(blankForm())} className="px-3 py-1.5 rounded-lg text-xs font-semibold flex items-center gap-1" style={btnGold}><Plus size={14} />새 진도표</button>}
        </div>
        <div className="flex items-center gap-2">
          <span className="text-xs font-semibold" style={{ color: "#5c543e" }}>표시할 달</span>
          <input type="month" className={inputCls} style={{ ...inputStyle, width: "auto" }} value={month} onChange={e => setMonth(e.target.value)} />
        </div>
        <p className="text-[11px]" style={{ color: "#8a7f5e" }}>진도표를 누르면 아래로 펼쳐져서 바로 표시할 수 있어요. 반 진도표는 그 반 학생 모두의 월간 리포트에, 개별 진도표는 그 학생의 월간 리포트에만 나와요. 둘 다 있으면 둘 다 보여요. 교재가 여러 권이면 "교재 추가"로 교재마다 진도표를 따로 만들어 주세요.</p>
        {visible.length === 0 ? <EmptyState text="아직 만든 진도표가 없습니다." /> : (
          <ul className="flex flex-col gap-1.5">
            {visible.map(c => (
              <li key={c.id} className="rounded-lg overflow-hidden" style={{ background: c.id === selected?.id ? "#fde3c8" : "#efe6d0", border: c.id === selected?.id ? "1.5px solid var(--gold)" : "1.5px solid transparent" }}>
              <div className="flex items-center justify-between gap-2 p-2.5" style={{ cursor: "pointer" }} onClick={() => setSelectedId(c.id === selected?.id ? "" : c.id)}>
                <div className="text-sm flex items-center" style={{ color: "#2b2417" }}>
                  <ChevronLeft size={16} color="#8a7f5e" className="flex-shrink-0 mr-1" style={{ transform: c.id === selected?.id ? "rotate(-90deg)" : "rotate(180deg)", transition: "transform .15s" }} />
                  <span className="text-[10px] px-1.5 py-0.5 rounded font-semibold mr-1.5" style={{ background: c.ownerType === "class" ? "#dfe7f3" : "#f3e1ef", color: "#4a4332" }}>{c.ownerType === "class" ? "반" : "개별"}</span>
                  <b>{c.title}</b> <span className="text-xs" style={{ color: "#7a6f52" }}>· {c.ownerType === "class" ? c.classGroup : studentName(c.studentId)}{c.textbook ? ` · ${c.textbook}` : ""}</span>
                </div>
                <div className="flex gap-1 flex-shrink-0" onClick={e => e.stopPropagation()}>
                  <button onClick={() => addTextbook(c)} className="px-2 py-1 rounded-md text-[11px] font-semibold flex items-center gap-1" style={{ background: "#efe3c8", color: "#5c543e" }} title="같은 과정에 교재 추가"><Copy size={12} />교재 추가</button>
                  <button onClick={() => setForm(toForm(c))} className="p-1.5 rounded-md" style={{ background: "#efe3c8" }} title="구조 수정"><Pencil size={14} color="#5c543e" /></button>
                  <button onClick={() => removeChart(c)} className="p-1.5 rounded-md" style={{ background: "#efe3c8" }} title="삭제"><Trash2 size={14} color="var(--coral)" /></button>
                </div>
              </div>
              {c.id === selected?.id && !form && (
                <div className="p-3" style={{ background: "#fffaf0", borderTop: "1px solid #e4d8ba" }}>
                  <ProgressChartGrid chart={c} month={month} editable onChange={saveChart} ownerLabel={ownerText(c)} />
                </div>
              )}
              </li>
            ))}
          </ul>
        )}
      </div>

      {form && (
        <div className="rounded-2xl p-4 flex flex-col gap-3" style={{ ...panel, border: "1.5px solid var(--gold)" }}>
          <h3 className="font-bold" style={{ fontFamily: "'Noto Serif KR', serif" }}>{form.id ? "진도표 구조 수정" : "새 진도표 만들기"}</h3>
          <div className="grid grid-cols-2 gap-3">
            <Field label="과정 이름"><input className={inputCls} style={inputStyle} value={form.title} onChange={e => setForm({ ...form, title: e.target.value })} placeholder="예: 중3-2 기본" /></Field>
            <Field label="교재"><input className={inputCls} style={inputStyle} value={form.textbook} onChange={e => setForm({ ...form, textbook: e.target.value })} placeholder="예: 쎈" /></Field>
            <Field label="대상">
              <select className={inputCls} style={inputStyle} value={form.ownerType} onChange={e => setForm({ ...form, ownerType: e.target.value })}>
                <option value="class">반 진도</option>
                <option value="student">개별 진도</option>
              </select>
            </Field>
            {form.ownerType === "class" ? (
              <Field label="반">
                <select className={inputCls} style={inputStyle} value={form.classGroup} onChange={e => setForm({ ...form, classGroup: e.target.value })}>
                  {classOptions.map(g => <option key={g} value={g}>{g}</option>)}
                </select>
              </Field>
            ) : (
              <Field label="학생"><StudentSelect students={scopedStudents} value={form.studentId} onChange={v => setForm({ ...form, studentId: v })} /></Field>
            )}
          </div>
          <div className="flex flex-col gap-2">
            <span className="text-xs font-semibold" style={{ color: "#5c543e" }}>단원 (왼쪽부터 순서대로)</span>
            {form.units.map((u, i) => (
              <div key={u.id} className="grid gap-2 items-end" style={{ gridTemplateColumns: "1.3fr 0.6fr 2fr auto" }}>
