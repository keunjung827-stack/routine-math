// 반별 출석 인정 기준 시각 편집 (반마다 다른 시간 지정 가능, 없으면 기본값 적용)
function AttendanceCutoffEditor({ data, setData, groups }) {
  const [drafts, setDrafts] = useState({ ...(data.attendanceCutoffTimes || {}) });
  const [defaultDraft, setDefaultDraft] = useState(data.attendanceCutoffDefault || "16:00");
  const [savedKey, setSavedKey] = useState(null);

  const saveGroup = (g) => {
    setData({ ...data, attendanceCutoffTimes: { ...(data.attendanceCutoffTimes || {}), [g]: drafts[g] } });
    setSavedKey(g);
    setTimeout(() => setSavedKey(null), 1500);
  };
  const saveDefault = () => {
    setData({ ...data, attendanceCutoffDefault: defaultDraft });
    setSavedKey("__default__");
    setTimeout(() => setSavedKey(null), 1500);
  };

  return (
    <div className="rounded-2xl p-4 flex flex-col gap-3" style={panel}>
      <h3 className="font-bold" style={{ fontFamily: "'Noto Serif KR', serif" }}>출석 인정 기준 시각 (반별)</h3>
      <p className="text-[11px]" style={{ color: "#8a7f5e" }}>학생이 앱에서 "출석하기"를 누를 때, 자기 반에 설정된 기준 시각 이전이면 출석 · 이후면 지각으로 자동 기록돼요. 반이 없거나 아래 목록에 없는 반은 기본 기준 시각이 적용됩니다.</p>
      <div className="flex gap-2 items-end">
        <Field label="기본 기준 시각"><input type="time" className={inputCls} style={inputStyle} value={defaultDraft} onChange={e => setDefaultDraft(e.target.value)} /></Field>
        <button onClick={saveDefault} className="px-4 py-2.5 rounded-lg text-sm font-semibold" style={btnGold}>{savedKey === "__default__" ? "저장됨" : "저장"}</button>
      </div>
      {groups.length === 0 ? (
        <p className="text-xs" style={{ color: "#8a7f5e" }}>등록된 반이 없습니다. 학생 등록 시 "반/그룹"을 입력하면 여기에 나타나요.</p>
      ) : groups.map(g => (
        <div key={g} className="flex gap-2 items-end">
          <Field label={g}>
            <input type="time" className={inputCls} style={inputStyle}
              value={drafts[g] ?? data.attendanceCutoffDefault ?? "16:00"}
              onChange={e => setDrafts({ ...drafts, [g]: e.target.value })} />
          </Field>
          <button onClick={() => saveGroup(g)} className="px-4 py-2.5 rounded-lg text-sm font-semibold" style={btnGold}>{savedKey === g ? "저장됨" : "저장"}</button>
        </div>
      ))}
    </div>
  );
}

function AttendanceTab({ data, setData, scopeClassGroups }) {
  const [date, setDate] = useState(todayStr());
  const students = studentsInScope(data.students, scopeClassGroups);
  const extraGroups = [...new Set(data.students.map(s => s.classGroup).filter(Boolean))].filter(g => !CLASS_GROUPS.includes(g)).sort();
  const allGroups = [...CLASS_GROUPS, ...extraGroups];
  const groups = scopeClassGroups && scopeClassGroups.length ? allGroups.filter(g => scopeClassGroups.includes(g)) : allGroups;
  const entryFor = (studentId) => data.attendance.find(a => a.studentId === studentId && a.date === date);

  const setStatus = (studentId, status) => {
    const existing = entryFor(studentId);
    let attendance;
    if (existing) attendance = data.attendance.map(a => a.id === existing.id ? { ...a, status } : a);
    else attendance = [...data.attendance, { id: uid(), studentId, date, status }];
    setData({ ...data, attendance });
  };

  const clearStatus = (studentId) => {
    const existing = entryFor(studentId);
    if (!existing) return;
    setData({ ...data, attendance: data.attendance.filter(a => a.id !== existing.id) });
  };

  const statusColor = { "출석": "#4c8c5f", "지각": "var(--gold)", "결석": "var(--coral)" };

  return (
    <div className="flex flex-col gap-4">
      <div className="rounded-2xl p-4" style={panel}>
        <Field label="날짜"><input type="date" className={inputCls} style={inputStyle} value={date} onChange={e => setDate(e.target.value)} /></Field>
      </div>
      <AttendanceCutoffEditor data={data} setData={setData} groups={groups} />
      <div className="rounded-2xl p-4" style={panel}>
        <h3 className="font-bold mb-3" style={{ fontFamily: "'Noto Serif KR', serif" }}>{date} 출결 ({students.length}명)</h3>
        {students.length === 0 ? <EmptyState text="학생이 없습니다." /> : (
          <ul className="flex flex-col gap-2">
            {students.map(s => {
              const entry = entryFor(s.id);
              const cur = entry?.status;
              return (
                <li key={s.id} className="flex items-center justify-between p-2.5 rounded-lg flex-wrap gap-y-1" style={{ background: "#efe6d0" }}>
                  <div className="text-sm" style={{ color: "#2b2417" }}>
                    {s.name}
                    {entry?.time && <span className="text-xs ml-2" style={{ color: "#7a6f52" }}>{entry.time} 도착{entry.source === "student" ? " · 학생 직접 체크인" : ""}</span>}
                  </div>
                  <div className="flex gap-1.5 items-center">
                    {ATT_STATUSES.map(st => (
                      <button key={st} onClick={() => setStatus(s.id, st)} className="px-2.5 py-1 rounded-full text-xs font-semibold"
                        style={{ background: cur === st ? statusColor[st] : "#e4d8ba", color: cur === st ? "#fff" : "#5c543e" }}>{st}</button>
                    ))}
                    {entry && (
                      <button onClick={() => clearStatus(s.id)} className="p-1.5 rounded-full" style={{ background: "#f8e3c9" }} title="기록 취소"><Trash2 size={13} color="var(--coral)" /></button>
                    )}
                  </div>
                </li>
              );
            })}
          </ul>
        )}
      </div>
    </div>
  );
}

const REQUEST_TYPES = [
  { id: "결석", label: "결석 신고", icon: Calendar },
  { id: "보강변경", label: "보강 시간 변경", icon: Repeat },
  { id: "클리닉변경", label: "클리닉 시간 변경", icon: FlaskConical },
];
const reqStatusColor = { "대기": "#7a6f52", "승인": "#4c8c5f", "거절": "var(--coral)" };

function RequestForm({ type, studentId, onSubmit, onCancel }) {
  const [targetDate, setTargetDate] = useState("");
  const [desiredDate, setDesiredDate] = useState("");
  const [desiredTime, setDesiredTime] = useState("");
  const [reason, setReason] = useState("");
  const needsDesired = type !== "결석";
  const submit = () => {
    if (!targetDate || !reason.trim()) return;
    if (needsDesired && (!desiredDate || !desiredTime)) return;
    onSubmit({ id: uid(), studentId, type, targetDate, desiredDate, desiredTime, reason, status: "대기", createdAt: new Date().toISOString(), adminNote: "" });
  };
  return (
    <div className="flex flex-col gap-3 p-4 rounded-2xl" style={panel}>
      <h3 className="font-bold" style={{ fontFamily: "'Noto Serif KR', serif" }}>{REQUEST_TYPES.find(t => t.id === type)?.label}</h3>
      <div>
        <label className="text-xs" style={{ color: "#7a6f52" }}>{type === "결석" ? "결석 날짜" : "기존 일정 날짜"}</label>
        <input type="date" className={inputCls} style={{ ...inputStyle, marginTop: 4 }} value={targetDate} onChange={e => setTargetDate(e.target.value)} />
      </div>
      {needsDesired && (
        <div className="grid grid-cols-2 gap-2">
          <div><label className="text-xs" style={{ color: "#7a6f52" }}>희망 날짜</label><input type="date" className={inputCls} style={{ ...inputStyle, marginTop: 4 }} value={desiredDate} onChange={e => setDesiredDate(e.target.value)} /></div>
          <div><label className="text-xs" style={{ color: "#7a6f52" }}>희망 시간</label><input type="time" className={inputCls} style={{ ...inputStyle, marginTop: 4 }} value={desiredTime} onChange={e => setDesiredTime(e.target.value)} /></div>
        </div>
      )}
      <div><label className="text-xs" style={{ color: "#7a6f52" }}>사유</label><textarea rows={3} className={inputCls} style={{ ...inputStyle, marginTop: 4 }} value={reason} onChange={e => setReason(e.target.value)} /></div>
      <div className="flex gap-2">
        <button onClick={submit} className="px-4 py-2 rounded-lg text-sm font-semibold" style={btnGold}>제출</button>
        <button onClick={onCancel} className="px-4 py-2 rounded-lg text-sm" style={{ border: "1px solid #ddcda0", color: "#5c543e" }}>취소</button>
      </div>
      <p className="text-[11px]" style={{ color: "#8a7f5e" }}>제출하면 관리자에게 바로 전달되어 확인 후 승인/거절됩니다.</p>
    </div>
  );
}

// 오늘 할 일 계획 (과목별로 묶어서 체크리스트로 표시, 타임테이블과 같은 과목 색상 사용)
function PlannerTaskList({ data, setData, studentId, date, readOnly, adminDelete }) {
  const [subject, setSubject] = useState("");
  const [content, setContent] = useState("");
  // 삭제 가능 시간(10분)이 지나면 X 버튼이 사라지도록 30초마다 화면 갱신
  const [now, setNow] = useState(Date.now());
  useEffect(() => { const id = setInterval(() => setNow(Date.now()), 30000); return () => clearInterval(id); }, []);
  const tasks = (data.plannerTasks || []).filter(t => t.studentId === studentId && t.date === date);
  const bySubject = {};
  tasks.forEach(t => { (bySubject[t.subject] = bySubject[t.subject] || []).push(t); });

  const DELETE_WINDOW_MS = 10 * 60 * 1000;
  // 학생은 추가 후 10분 안에만 삭제 가능 (오타·중복 수정용). 그 뒤엔 못 한 일을 지워서 달성률을 올릴 수 없음.
  const canStudentDelete = (t) => !!t.createdAt && now - t.createdAt < DELETE_WINDOW_MS;
  // 미룬 할 일이 들어갈 날짜: 오늘 이후 계획이면 다음 날, 이미 지난 날짜 계획이면 오늘
  const today = todayStr();
  const postponeTarget = date >= today ? addDaysToDateStr(date, 1) : today;
  const shortDate = (d) => { const [, m, dd] = d.split("-"); return `${Number(m)}/${Number(dd)}`; };

  const add = () => {
    if (!subject.trim() || !content.trim()) return;
    setData({ ...data, plannerTasks: [...(data.plannerTasks || []), { id: uid(), studentId, date, subject: subject.trim(), content: content.trim(), done: false, createdAt: Date.now() }] });
    setContent("");
  };
  const toggle = (t) => { if (t.postponedTo) return; setData({ ...data, plannerTasks: data.plannerTasks.map(x => x.id === t.id ? { ...x, done: !x.done } : x) }); };
  const remove = (id) => setData({ ...data, plannerTasks: data.plannerTasks.filter(t => t.id !== id) });
  const removeByAdmin = (t) => { if (window.confirm(`"${t.content}" 계획을 삭제할까요?\n삭제하면 달성률 계산에서도 빠져요.`)) remove(t.id); };
  // 내일로 미루기: 원래 날짜엔 "미룸"으로 남아 미완료로 계산되고, 같은 할 일이 다음 날 목록에 추가됨
  const postponeMany = (list) => {
    if (list.length === 0) return;
    const ids = new Set(list.map(t => t.id));
    const copies = list.map(t => ({ id: uid(), studentId, date: postponeTarget, subject: t.subject, content: t.content, done: false, carriedFrom: t.date }));
    setData({ ...data, plannerTasks: [...data.plannerTasks.map(x => ids.has(x.id) ? { ...x, done: false, postponedTo: postponeTarget } : x), ...copies] });
  };
  const postpone = (t) => postponeMany([t]);
  // 지난 날짜인데 체크도, 미루기도 안 한 할 일 → 마무리 안내
  const unfinished = tasks.filter(t => !t.done && !t.postponedTo);
  const isPast = date < today;
  const targetLabel = `${shortDate(postponeTarget)}${postponeTarget === today ? "(오늘)" : ""}`;

  const circle = (t) => (
    <span className="w-5 h-5 rounded-full flex items-center justify-center flex-shrink-0" style={{ border: `2px solid ${t.done ? "#4c8c5f" : t.postponedTo ? "#c9b98f" : "#ddcda0"}`, background: t.done ? "#4c8c5f" : "transparent", borderStyle: t.postponedTo ? "dashed" : "solid" }}>
      {t.done && <Check size={12} color="#fff" />}
    </span>
  );
  const label = (t) => (
    <span className="flex flex-col">
      <span>{t.content}</span>
      {(t.postponedTo || t.carriedFrom) && (
        <span className="text-[10px] font-semibold" style={{ color: t.postponedTo ? "var(--coral)" : "#8a5a17", textDecoration: "none" }}>
          {t.postponedTo ? `→ ${shortDate(t.postponedTo)}로 미룸` : `↩ ${shortDate(t.carriedFrom)}에서 넘어옴`}
        </span>
      )}
    </span>
  );
  const textStyle = (t) => ({ color: t.done || t.postponedTo ? "#8a7f5e" : "#2b2417", textDecoration: t.done ? "line-through" : "none" });

  return (
    <div className="rounded-2xl p-4 flex flex-col gap-3" style={panel}>
      <h3 className="font-bold flex items-center gap-2" style={{ fontFamily: "'Noto Serif KR', serif" }}>📋 {readOnly ? "그날 계획" : "오늘 할 일 계획"}</h3>
      {!readOnly && (
        <div className="rounded-xl px-3 py-2.5 flex items-start gap-2.5" style={{ background: "#fdecd8", border: "2px solid #e2822f" }}>
          <span className="w-6 h-6 rounded-full flex items-center justify-center flex-shrink-0 mt-0.5" style={{ background: "#e2822f" }}><Check size={14} color="#fff" strokeWidth={3} /></span>
          <div className="flex flex-col gap-0.5">
            <b className="text-sm flex items-center flex-wrap gap-1" style={{ color: "#8a3a0f" }}>다 한 일은 할 일 앞의<span className="inline-block w-4 h-4 rounded-full flex-shrink-0" style={{ border: "2px solid #ddcda0", background: "#fff" }} />를 눌러 줄을 그어주세요!</b>
            <span className="text-xs" style={{ color: "#6b4a1f" }}>줄 그은 할 일만 <b>이번 주 달성률</b>에 들어가요. 했는데 안 누르면 못 한 걸로 계산돼요.</span>
          </div>
        </div>
      )}
      {!readOnly && isPast && unfinished.length > 0 && (
        <div className="rounded-xl px-3 py-2.5 flex flex-col gap-2" style={{ background: "#fbe3dc", border: "2px solid var(--coral)" }}>
          <div className="flex items-start gap-2">
            <Repeat size={16} color="var(--coral)" className="flex-shrink-0 mt-0.5" />
            <div className="flex flex-col gap-0.5">
              <b className="text-sm" style={{ color: "#8a2a0f" }}>완료하지 못한 계획이 {unfinished.length}개 있어요.</b>
              <span className="text-xs" style={{ color: "#6b3a1f" }}>했는데 체크를 깜빡했다면 눌러서 줄을 그어주고, 못 한 일은 {targetLabel} 계획으로 미뤄주세요.</span>
            </div>
          </div>
          <button onClick={() => postponeMany(unfinished)} className="self-start px-3 py-1.5 rounded-lg text-xs font-semibold flex items-center gap-1" style={{ background: "var(--coral)", color: "#fff" }}>
            <Repeat size={12} />남은 {unfinished.length}개 모두 {targetLabel}로 미루기
          </button>
        </div>
      )}
      {!readOnly && (
        <>
          <div className="grid grid-cols-2 gap-2">
            <input className={inputCls} style={inputStyle} value={subject} onChange={e => setSubject(e.target.value)} placeholder="과목 (예: 수학)" />
            <input className={inputCls} style={inputStyle} value={content} onChange={e => setContent(e.target.value)} placeholder="할 일 (예: 쎈B 30문제)" onKeyDown={e => e.key === "Enter" && add()} />
          </div>
          <button onClick={add} className="self-start px-4 py-2 rounded-lg text-sm font-semibold flex items-center gap-1" style={btnGold}><Plus size={16} />추가</button>
        </>
      )}
      {tasks.length === 0 ? <EmptyState text="계획한 할 일이 없습니다." /> : (
        <div className="flex flex-col gap-3">
          {Object.keys(bySubject).map(subj => (
            <div key={subj}>
              <div className="flex items-center gap-1.5 mb-1.5">
                <span className="w-2.5 h-2.5 rounded-full flex-shrink-0" style={{ background: colorForSubject(subj, studentSubjectList(data, studentId)) }} />
                <span className="text-xs font-bold" style={{ color: "#2b2417" }}>{subj}</span>
              </div>
              <ul className="flex flex-col gap-1.5">
                {bySubject[subj].map(t => (
                  <li key={t.id} className="flex items-center gap-2 p-2 rounded-lg" style={{ background: t.postponedTo ? "#f4ecd9" : "#efe6d0" }}>
                    {readOnly ? (
                      <>
                        <div className="flex items-center gap-2 text-sm flex-1" style={textStyle(t)}>{circle(t)}{label(t)}</div>
                        {adminDelete && <button onClick={() => removeByAdmin(t)} title="선생님 삭제"><Trash2 size={14} color="#a89d84" /></button>}
                      </>
                    ) : (
                      <>
                        <button onClick={() => toggle(t)} disabled={!!t.postponedTo} className="flex items-center gap-2 text-sm flex-1 text-left" style={textStyle(t)}>{circle(t)}{label(t)}</button>
                        {!t.done && !t.postponedTo && (
                          <button onClick={() => postpone(t)} className="text-[10px] px-2 py-1 rounded-full font-semibold flex-shrink-0" style={{ background: "#e4d8ba", color: "#5c543e" }}>
                            {shortDate(postponeTarget)}로 미루기
                          </button>
                        )}
                        {canStudentDelete(t) && (
                          <button onClick={() => remove(t.id)} title="잘못 적었으면 눌러서 지우고 다시 적어주세요" className="flex items-center gap-1 text-[10px] px-2 py-1 rounded-full font-semibold flex-shrink-0" style={{ background: "#fff6e8", color: "#8a5a17", border: "1px solid #ddcda0" }}>
                            <X size={11} />지우기 {Math.max(1, Math.ceil((DELETE_WINDOW_MS - (now - t.createdAt)) / 60000))}분
                          </button>
                        )}
                      </>
                    )}
                  </li>
                ))}
              </ul>
            </div>
          ))}
        </div>
      )}
      {!readOnly && tasks.length > 0 && (
        <div className="rounded-xl px-3 py-2.5 text-xs flex flex-col gap-1.5 leading-relaxed" style={{ background: "#f1ece0", border: "1px solid #e0d6bf", color: "#4a4332" }}>
          <span className="flex items-start gap-1.5"><Lock size={13} className="flex-shrink-0 mt-0.5" color="#8a7f5e" /><span><b>계획 수정 시간은 10분이에요.</b> 할 일을 잘못 적었다면 추가한 뒤 10분 안에 "지우기"를 눌러 지우고 다시 적어주세요. 10분이 지나면 지울 수 없어요.</span></span>
          <span className="flex items-start gap-1.5"><Repeat size={13} className="flex-shrink-0 mt-0.5" color="#8a7f5e" /><span><b>하루를 마무리할 때 못 한 일은 "{shortDate(postponeTarget)}로 미루기"를 눌러주세요.</b> 그 할 일이 {targetLabel} 계획으로 옮겨져요. 이 날 달성률에는 못 한 일로 남으니, 옮겨간 날에 꼭 끝내주세요.</span></span>
        </div>
      )}
      {!readOnly && <p className="text-[11px]" style={{ color: "#8a7f5e" }}>과목명을 아래 순공 타이머에서 쓸 것과 똑같이 입력하면, 타임테이블 색깔이랑 계획 색깔이 서로 맞춰져요.</p>}
    </div>
  );
}

// 순공 타이머: 시작/멈춤을 누르면 쉬는 시간은 자동으로 빠지고, 끝나면 오늘 플래너에 자동 기록됨
function StudyTimer({ data, setData, studentId }) {
  const storageKey = `routine_math_timer_${studentId}`;
  const loadSaved = () => {
    try {
      const raw = localStorage.getItem(storageKey);
      return raw ? JSON.parse(raw) : null;
    } catch (e) { return null; }
  };
  const saved = loadSaved();
  const serverDraft = (data.timerDrafts || {})[studentId];
  // 로컬 저장소에 기록이 없는데(예: 브라우저 저장공간이 초기화됨) 서버에 백업된 일시정지 기록이 있으면 그걸로 복구
  const initial = (saved && (saved.elapsedMs > 0 || saved.running)) ? saved : (serverDraft || saved);
  const [running, setRunning] = useState(initial?.running || false);
  const [elapsedMs, setElapsedMs] = useState(initial?.elapsedMs || 0);
  const [segmentStart, setSegmentStart] = useState(initial?.segmentStart || null);
  const [subject, setSubject] = useState(initial?.subject || "");
  const [detail, setDetail] = useState(initial?.detail || "");
  const [, forceTick] = useState(0);

  // 화면이 꺼졌다 켜지거나(폰이 백그라운드에서 페이지를 새로고침해도) 이어서 계산되도록 로컬에 저장
  useEffect(() => {
    try { localStorage.setItem(storageKey, JSON.stringify({ running, elapsedMs, segmentStart, subject, detail })); }
    catch (e) { /* 저장 공간 문제 - 무시 */ }
  }, [running, elapsedMs, segmentStart, subject, detail]);

  useEffect(() => {
    if (!running) return;
    const id = setInterval(() => forceTick(t => t + 1), 1000);
    return () => clearInterval(id);
  }, [running]);

  // 진행중일 때는 화면이 꺼지거나 앱을 나가도 계속 정확하게 흘러가요.
  // (기술적으로 "잠깐 화면 끔"이랑 "다른 데 가서 딴짓"을 구분할 방법이 없어서,
  //  강제로 끊기보다는 기록을 투명하게 남겨서 나중에 확인 가능하게 하는 쪽을 택함 —
  //  저장 안 하고 "나가기"를 누르면 그 세션은 초기화됨)

  const currentElapsedMs = elapsedMs + (running && segmentStart ? (Date.now() - segmentStart) : 0);
  const totalSeconds = Math.floor(currentElapsedMs / 1000);
  const hh = String(Math.floor(totalSeconds / 3600)).padStart(2, "0");
  const mm = String(Math.floor((totalSeconds % 3600) / 60)).padStart(2, "0");
  const ss = String(totalSeconds % 60).padStart(2, "0");

  const start = () => { setSegmentStart(Date.now()); setRunning(true); };
  const pause = () => {
    const newElapsed = elapsedMs + (Date.now() - segmentStart);
    setElapsedMs(newElapsed);
    setSegmentStart(null);
    setRunning(false);
    setData({ ...data, timerDrafts: { ...(data.timerDrafts || {}), [studentId]: { running: false, elapsedMs: newElapsed, segmentStart: null, subject, detail, pausedAt: new Date().toISOString() } } });
  };
  const reset = () => {
    setElapsedMs(0); setSegmentStart(null); setRunning(false);
    try { localStorage.removeItem(storageKey); } catch (e) { /* 무시 */ }
    if ((data.timerDrafts || {})[studentId]) {
      const drafts = { ...data.timerDrafts };
      delete drafts[studentId];
      setData({ ...data, timerDrafts: drafts });
    }
  };

  // 참고: 화면 꺼짐/다른 앱 전환은 웹에서 구분할 방법이 없어서(둘 다 동일하게 "숨김" 처리됨),
  // 진행중일 때 자동으로 멈추게 하면 정상적인 "화면 끄고 책으로 공부" 상황까지 멈춰버려서
  // 이 기능은 빼고, 실제 시계 시각 기준으로 계속 흘러가게 둡니다.

  const saveToPlanner = () => {
    const totalMinutes = Math.round(currentElapsedMs / 60000);
    if (totalMinutes < 1) return;
    const now = new Date();
    const pad = (n) => String(n).padStart(2, "0");
    const end = `${pad(now.getHours())}:${pad(now.getMinutes())}`;
    const startDate = new Date(now.getTime() - totalMinutes * 60000);
    const startStr = `${pad(startDate.getHours())}:${pad(startDate.getMinutes())}`;
    const newBlocks = [...data.plannerBlocks, { id: uid(), studentId, date: todayStr(), start: startStr, end, subject: subject.trim() || "기타", detail: detail.trim(), done: true }];

    const daysBefore = new Set(data.plannerBlocks.filter(b => b.studentId === studentId && b.done).map(b => b.date)).size;
    const daysAfter = new Set(newBlocks.filter(b => b.studentId === studentId && b.done).map(b => b.date)).size;
    let alerts = data.alerts;
    if (daysAfter > daysBefore && daysAfter % 30 === 0) {
      const student = data.students.find(s => s.id === studentId);
      const coupons = daysAfter / 30;
      alerts = [...alerts, {
        id: uid(), studentId, sourceKey: `badge30:${studentId}:${coupons}`, kind: "칭찬배지 달성",
        message: `[루틴수학] ${student?.name || ""} 학생이 순공 칭찬배지 30개를 모았어요! 음료쿠폰을 지급해주세요. (통산 ${coupons}번째)`,
        status: "대기", createdAt: new Date().toISOString(),
      }];
    }

    const drafts = { ...(data.timerDrafts || {}) };
    delete drafts[studentId];
    setData({ ...data, plannerBlocks: newBlocks, alerts, timerDrafts: drafts });
    setElapsedMs(0); setSegmentStart(null); setRunning(false);
    try { localStorage.removeItem(storageKey); } catch (e) { /* 무시 */ }
    setSubject("");
    setDetail("");
  };

  return (
    <div className="rounded-2xl p-4 flex flex-col gap-3" style={panel}>
      <h3 className="font-bold flex items-center gap-2" style={{ fontFamily: "'Noto Serif KR', serif" }}>⏱ 순공 타이머</h3>
      <div className="text-center py-3">
        <div className="text-4xl font-bold tabular-nums" style={{ color: "#2b2417", fontFamily: "'Noto Serif KR', serif" }}>{hh}:{mm}:{ss}</div>
      </div>
      <Field label="과목 (예: 수학)"><input className={inputCls} style={inputStyle} value={subject} onChange={e => setSubject(e.target.value)} placeholder="예: 수학" /></Field>
      <Field label="학습 내용 (선택)"><input className={inputCls} style={inputStyle} value={detail} onChange={e => setDetail(e.target.value)} placeholder="예: 공통수학2 이차방정식 오답 정리" /></Field>
      {!running ? (
        <button onClick={start} className="w-full py-3 rounded-xl text-sm font-bold" style={btnGold}>{currentElapsedMs > 0 ? "이어서 공부하기" : "공부 시작"}</button>
      ) : (
        <button onClick={pause} className="w-full py-3 rounded-xl text-sm font-bold" style={{ background: "var(--coral)", color: "#fff" }}>쉬는 중 (탭해서 멈춤)</button>
      )}
      <div className="rounded-lg p-2.5" style={{ background: "#fff3d6", border: "1px solid #f0d99a" }}>
        <p className="text-xs font-bold text-center" style={{ color: "#8a5a17" }}>📋 과목·시간·타임테이블이 선생님 화면에 그대로 기록돼요 — 정직하게 기록해주세요!</p>
      </div>
      {currentElapsedMs > 0 && !running && (
        <div className="flex gap-2">
          <button onClick={saveToPlanner} className="flex-1 py-2.5 rounded-lg text-sm font-semibold" style={{ background: "#4c8c5f", color: "#fff" }}>순공시간으로 저장</button>
          <button onClick={reset} className="px-4 py-2.5 rounded-lg text-sm" style={{ border: "1px solid #ddcda0", color: "#5c543e" }}>초기화</button>
        </div>
      )}
      <p className="text-[11px]" style={{ color: "#8a7f5e" }}>공부할 때 "공부 시작", 쉴 때 눌러서 멈추고, 다시 누르면 이어서 계산돼요. 다 끝나면 "순공시간으로 저장"을 누르면 오늘 플래너에 자동으로 기록돼요.</p>
    </div>
  );
}

// 하루 학습 타임테이블 (사진 속 다이어리처럼 시간대별 막대로 시각화)
const SUBJECT_PALETTE = ["#e63946", "#f77f00", "#d4a017", "#2a9d3e", "#1d6fd6", "#7b2cbf", "#c2185b", "#00897b", "#5d4037", "#43568c", "#8d6e00", "#37474f"];
function studentSubjectList(data, studentId) {
  return [...new Set(data.plannerBlocks.filter(b => b.studentId === studentId).map(b => b.subject).filter(Boolean))].sort();
}
function colorForSubject(subject, subjectList) {
  if (!subject) return SUBJECT_PALETTE[0];
  if (subjectList && subjectList.length) {
    const idx = subjectList.indexOf(subject);
    if (idx >= 0) return SUBJECT_PALETTE[idx % SUBJECT_PALETTE.length];
  }
  // subjectList가 없을 때만 예비로 해시 사용 (겹칠 수 있음 — 되도록 subjectList를 넘겨서 호출할 것)
  let hash = 0;
  for (let i = 0; i < subject.length; i++) hash = (hash * 31 + subject.charCodeAt(i)) >>> 0;
  return SUBJECT_PALETTE[hash % SUBJECT_PALETTE.length];
}

function DayTimeline({ blocks, subjectList }) {
  if (blocks.length === 0) return <EmptyState text="이 날짜에 기록된 공부 시간이 없습니다." />;
  const toMinutes = (hhmm) => { const [h, m] = (hhmm || "00:00").split(":").map(Number); return h * 60 + m; };
  // 당일 오전 6시 ~ 다음날 새벽 3시 고정 (21시간)
  const rangeStartHour = 6;
  const rangeEndHour = 27; // 다음날 새벽 3시
  const rowHeight = 30;
  const wrapMinutes = (mins) => (mins < 180 ? mins + 24 * 60 : mins); // 자정 넘어가는 시각 보정 (예: 00:30 → 24:30)
  const subjects = [...new Set(blocks.map(b => b.subject).filter(Boolean))];
  const wrappedBlocks = blocks.map(b => ({ ...b, s: wrapMinutes(toMinutes(b.start)), e: wrapMinutes(toMinutes(b.end)) }));

  const hours = [];
  for (let h = rangeStartHour; h < rangeEndHour; h++) hours.push(h);

  return (
    <div className="flex flex-col gap-2">
      <div className="flex items-stretch">
        <div className="flex-shrink-0" style={{ width: 30 }} />
        <div className="relative flex-1 flex">
          {["10분", "20분", "30분", "40분", "50분", "60분"].map((label, i) => (
            <div key={i} className="flex-1 text-[10px] text-center" style={{ color: "#a89d84" }}>{label}</div>
          ))}
        </div>
      </div>
      <div className="rounded-lg overflow-hidden" style={{ border: "1px solid #e4d8ba", background: "#fffcf6" }}>
        {hours.map(h => {
          const hourStart = h * 60, hourEnd = h * 60 + 60;
          const displayHour = h > 24 ? h - 24 : h;
          const segments = wrappedBlocks.map(b => {
            const os = Math.max(b.s, hourStart), oe = Math.min(b.e, hourEnd);
            if (oe <= os) return null;
            return {
              id: b.id + "-" + h,
              leftPct: ((os - hourStart) / 60) * 100,
              widthPct: ((oe - os) / 60) * 100,
              color: b.done === false ? "#e4d8ba" : colorForSubject(b.subject, subjectList),
              opacity: b.done === false ? 0.6 : 1,
            };
          }).filter(Boolean);
          return (
            <div key={h} className="flex items-stretch" style={{ height: rowHeight, borderTop: h === rangeStartHour ? "none" : "1px solid #e4d8ba" }}>
              <div className="flex-shrink-0 text-[10px] flex items-center justify-end pr-1" style={{ width: 30, color: "#a89d84", borderRight: "1px solid #e4d8ba" }}>{displayHour}시</div>
              <div className="relative flex-1">
                {[1, 2, 3, 4, 5].map(c => (
                  <div key={c} style={{ position: "absolute", left: `${(c * 100) / 6}%`, top: 0, bottom: 0, borderLeft: "1px dotted #ecdfc0" }} />
                ))}
                {segments.map(seg => (
                  <div key={seg.id} className="absolute rounded-sm" style={{ left: `${seg.leftPct}%`, width: `${seg.widthPct}%`, top: 3, bottom: 3, background: seg.color, opacity: seg.opacity }} />
                ))}
              </div>
            </div>
          );
        })}
      </div>
      {subjects.length > 0 && (
        <div className="flex flex-wrap gap-x-3 gap-y-1 px-1">
          {subjects.map(subj => (
            <div key={subj} className="flex items-center gap-1.5">
              <span className="w-2.5 h-2.5 rounded-full flex-shrink-0" style={{ background: colorForSubject(subj, subjectList) }} />
              <span className="text-[10px]" style={{ color: "#7a6f52" }}>{subj}</span>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

function StudentPlannerTimetable({ data, setData, studentId }) {
  const [date, setDate] = useState(todayStr());

  const dayBlocks = data.plannerBlocks.filter(b => b.studentId === studentId && b.date === date).sort((a, b) => a.start.localeCompare(b.start));
  const recentDates = [...new Set(data.plannerBlocks.filter(b => b.studentId === studentId).map(b => b.date))].sort((a, b) => b.localeCompare(a)).slice(0, 7);
  const todayPureMinutes = dayBlocks.filter(b => b.done).reduce((s, b) => s + minutesBetween(b.start, b.end), 0);

  const toggleDone = (b) => setData({ ...data, plannerBlocks: data.plannerBlocks.map(x => x.id === b.id ? { ...x, done: !x.done } : x) });
  const remove = (id) => setData({ ...data, plannerBlocks: data.plannerBlocks.filter(b => b.id !== id) });

  const streak = studyStreak(data, studentId);
  const badgeInfo = studyBadgeProgress(data, studentId);

  return (
    <div className="flex flex-col gap-4">
      {streak >= 2 && (
        <div className="rounded-xl p-3 flex items-center gap-2" style={{ background: "#fff3d6", border: "1px solid #f0d99a" }}>
          <span style={{ fontSize: 20 }}>🔥</span>
          <span className="text-sm font-bold" style={{ color: "#8a5a17" }}>{streak}일 연속 순공 기록 중이에요!</span>
        </div>
      )}
      {badgeInfo.totalDays > 0 && (
        <div className="rounded-xl p-3 flex flex-col gap-2" style={{ background: badgeInfo.progress === 30 ? "#fde3c8" : "#fffcf6", border: "1px solid #e4d8ba" }}>
          <div className="flex flex-col gap-0.5">
            <span className="text-sm font-bold" style={{ color: "#8a5a17" }}>
              {badgeInfo.progress === 30 ? "🎉 칭찬배지 30개 다 모았어요! 선생님께 음료쿠폰 받으세요!" : `칭찬배지 도장판 ${badgeInfo.progress}/30`}
            </span>
            {badgeInfo.progress < 30 && (
              <span className="inline-block self-start mt-1 text-xs font-bold px-2 py-1 rounded-full" style={{ background: "var(--coral)", color: "#fff" }}>
                🎁 불꽃 30개를 완성해서 음료쿠폰을 받으세요!
              </span>
            )}
          </div>
          <StampGrid filled={badgeInfo.progress} icon="🔥" />
        </div>
      )}
      <PlannerTaskList data={data} setData={setData} studentId={studentId} date={date} />
      <StudyTimer data={data} setData={setData} studentId={studentId} />

      <div className="rounded-2xl p-4 flex flex-col gap-3" style={panel}>
        <div className="flex items-center justify-between">
          <h3 className="font-bold" style={{ fontFamily: "'Noto Serif KR', serif" }}>학습 타임테이블</h3>
          <input type="date" className="rounded-lg px-2 py-1.5 text-xs" style={inputStyle} value={date} onChange={e => setDate(e.target.value)} />
        </div>
        <DayTimeline blocks={dayBlocks} subjectList={studentSubjectList(data, studentId)} />
        <div className="flex items-center justify-between pt-1">
          <span className="text-xs" style={{ color: "#7a6f52" }}>{date}</span>
          <span className="text-sm font-bold" style={{ color: "var(--gold)" }}>순수 공부시간 {formatMinutes(todayPureMinutes)}</span>
        </div>
        <p className="text-[11px]" style={{ color: "#8a7f5e" }}>위 "순공 타이머"로 공부를 저장하면 여기에 과목·시간이 자동으로 채워져요.</p>
      </div>

      {dayBlocks.length > 0 && (
        <div className="rounded-2xl p-4" style={panel}>
          <h3 className="font-bold mb-3" style={{ fontFamily: "'Noto Serif KR', serif" }}>{date} 기록 ({dayBlocks.length}건)</h3>
          <ul className="flex flex-col gap-2">
            {dayBlocks.map(b => (
              <li key={b.id} className="flex items-center justify-between p-2.5 rounded-lg" style={{ background: b.done ? "#efe6d0" : "#f8e3c9" }}>
                <div className="text-sm" style={{ color: "#2b2417" }}>
                  <span className="text-xs mr-2" style={{ color: "#7a6f52" }}>{b.start}–{b.end} ({formatMinutes(minutesBetween(b.start, b.end))})</span>{b.subject}
                  {b.detail && <div className="text-xs mt-0.5" style={{ color: "#7a6f52" }}>{b.detail}</div>}

                <div className="flex items-center gap-2">
                  <button onClick={() => toggleDone(b)} className="px-2.5 py-1 rounded-full text-xs font-semibold" style={{ background: b.done ? "#4c8c5f" : "#e4d8ba", color: b.done ? "#fff" : "#5c543e" }}>{b.done ? "포함" : "제외"}</button>
                  <button onClick={() => remove(b.id)} className="p-1 rounded-md" style={{ background: "#efe3c8" }}><Trash2 size={12} color="var(--coral)" /></button>

              const blocks = data.plannerBlocks.filter(b => b.studentId === studentId && b.date === d);

          </ul>
        )}
      </div>
    </div>
  );
}

function StudentHomeworkTab({ data, setData, studentId }) {
  const mine = data.homeworks.filter(h => h.studentId === studentId).sort((a, b) => b.date.localeCompare(a.date));
  const [openPhotoFor, setOpenPhotoFor] = useState(null);
  const [uploadingId, setUploadingId] = useState(null);
  const hasTodayStudy = data.plannerBlocks.some(b => b.studentId === studentId && b.date === todayStr() && b.done);

  const photosOf = (h) => h.photos || (h.photo ? [h.photo] : []);

  const toggle = (h) => {
    const nextSubmitted = !h.submitted;
    const now = new Date();
    const isLate = nextSubmitted && h.dueDate && todayStr() > h.dueDate;
    const updated = { ...h, submitted: nextSubmitted, submittedAt: nextSubmitted ? now.toISOString() : null, submittedLate: nextSubmitted ? isLate : h.submittedLate, lateSubmittedAt: nextSubmitted && isLate ? now.toISOString() : (nextSubmitted ? null : h.lateSubmittedAt) };
    const alerts = syncHomeworkAlert(updated, data);
    setData({ ...data, homeworks: data.homeworks.map(x => x.id === h.id ? updated : x), alerts });
  };

  const onPickPhoto = async (h, files) => {
    if (!files || files.length === 0) return;
    setUploadingId(h.id);
    try {
      const newUrls = [];
      for (const file of Array.from(files)) {
        const dataUrl = await fileToCompressedDataURL(file);
        newUrls.push(dataUrl);
      }
      setData({ ...data, homeworks: data.homeworks.map(x => x.id === h.id ? { ...x, photos: [...photosOf(x), ...newUrls], photo: null } : x) });
    } catch (e) {
      console.error("사진 처리 실패", e);
    }
    setUploadingId(null);
  };

  const removeOnePhoto = (h, index) => setData({ ...data, homeworks: data.homeworks.map(x => x.id === h.id ? { ...x, photos: photosOf(x).filter((_, i) => i !== index), photo: null } : x) });
  const removeAllPhotos = (h) => setData({ ...data, homeworks: data.homeworks.map(x => x.id === h.id ? { ...x, photos: [], photo: null, note: "" } : x) });

  return (
    <div className="rounded-2xl p-4" style={panel}>
      <h3 className="font-bold mb-3" style={{ fontFamily: "'Noto Serif KR', serif" }}>숙제 제출</h3>
      {!hasTodayStudy && (
        <div className="rounded-lg p-2.5 mb-3" style={{ background: "#fff3d6", border: "1px solid #f0d99a" }}>
          <p className="text-sm font-bold" style={{ color: "#8a5a17" }}>💡 오늘 순공 타이머 기록이 아직 없어요 — 플래너에서 한번 써보세요!</p>
        </div>
      )}
      {mine.length === 0 ? <EmptyState text="등록된 숙제가 없습니다." /> : (
        <ul className="flex flex-col gap-3">
          {mine.map(h => {
            const photos = photosOf(h);
            return (
              <li key={h.id} className="p-3 rounded-lg flex flex-col gap-2" style={{ background: h.submitted ? "#efe6d0" : "#f8e3c9" }}>
                <div className="flex items-center justify-between">
                  <span className="text-sm" style={{ color: "#2b2417" }}>
                    {h.date} · {h.title}
                    {h.dueDate && <span className="text-[10px] ml-2 px-1.5 py-0.5 rounded-full" style={{ background: (h.submittedLate || (!h.submitted && h.dueDate < todayStr())) ? "var(--coral)" : "#e4d8ba", color: (h.submittedLate || (!h.submitted && h.dueDate < todayStr())) ? "#fff" : "#5c543e" }}>{h.submittedLate ? `기한 초과 (${h.lateSubmittedAt ? new Date(h.lateSubmittedAt).toLocaleString("ko-KR", { month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit" }) : ""} 제출)` : (!h.submitted && h.dueDate < todayStr()) ? "기한 초과" : `기한 ${h.dueDate}`}</span>}
                  </span>
                  <button onClick={() => toggle(h)} className="px-3 py-1 rounded-full text-xs font-semibold flex items-center gap-1" style={{ background: h.submitted ? (h.submittedLate ? "var(--coral)" : "#4c8c5f") : "var(--coral)", color: "#fff" }}>
                    {h.submitted ? <Check size={12} /> : <ClipboardCheck size={12} />}{h.submitted ? "제출완료 (취소)" : "제출하기"}
                  </button>
                </div>
                {h.submitted && h.reviewedByStaff && (
                  <span className="self-start text-[10px] font-semibold px-2 py-0.5 rounded-full flex items-center gap-1" style={{ background: "#4c8c5f", color: "#fff" }}><Check size={10} />선생님이 확인했어요</span>
                )}
                <div className="flex items-center gap-2 flex-wrap">
                  <label className="text-xs underline cursor-pointer" style={{ color: "var(--gold)" }}>
                    {uploadingId === h.id ? "처리 중…" : photos.length > 0 ? "사진 더 올리기" : "모르는 문제 사진 올리기"}
                    <input type="file" accept="image/*" capture="environment" multiple className="hidden" onChange={e => onPickPhoto(h, e.target.files)} />
                  </label>
                  {photos.length > 0 && (
                    <>
                      <button onClick={() => setOpenPhotoFor(openPhotoFor === h.id ? null : h.id)} className="text-xs underline" style={{ color: "#7a6f52" }}>
                        {openPhotoFor === h.id ? "접기" : `보기 (${photos.length}장)`}
                      </button>
                      <button onClick={() => removeAllPhotos(h)} className="text-xs" style={{ color: "var(--coral)" }}>전체삭제</button>
                    </>
                  )}
                </div>
                {photos.length > 0 && openPhotoFor === h.id && (
                  <div className="flex gap-2 overflow-x-auto pb-1">
                    {photos.map((src, i) => (
                      <div key={i} className="relative flex-shrink-0">
                        <img src={src} alt="모르는 문제" className="rounded-lg" style={{ height: 160 }} />
                        <button onClick={() => removeOnePhoto(h, i)} className="absolute top-1 right-1 w-5 h-5 rounded-full flex items-center justify-center" style={{ background: "rgba(0,0,0,0.55)" }}>
                          <X size={12} color="#fff" />
                        </button>
                      </div>
                    ))}
                  </div>
                )}
              </li>
            );
          })}
        </ul>
      )}
      <p className="text-[11px] mt-3" style={{ color: "#8a7f5e" }}>사진은 앱 저장 공간을 함께 쓰기 때문에 너무 많이 쌓이면 저장이 안 될 수 있어요. 확인이 끝난 사진은 삭제해 주세요.</p>
    </div>
  );
}

function StudentClassroom({ data, setData, studentId }) {
  const student = data.students.find(s => s.id === studentId);
  const grade = student?.grade;

  // 강의실에 들어오면 현재 학년에 해당하는 영상을 모두 "확인함" 처리 (새 영상 알림 배지 해제)
  useEffect(() => {
    const seen = new Set(student?.seenVideoIds || []);
    const matching = data.videos.filter(v => v.target === "ALL" || v.target === grade);
    const unseenIds = matching.filter(v => !seen.has(v.id)).map(v => v.id);
    if (unseenIds.length > 0) {
      setData({ ...data, students: data.students.map(s => s.id === studentId ? { ...s, seenVideoIds: [...(s.seenVideoIds || []), ...unseenIds] } : s) });
    }
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [data.videos.length, studentId]);

  return (
    <div className="flex flex-col gap-4">
      <div className="rounded-2xl p-4" style={{ background: "#173226", border: "1px solid #173226" }}>
        <div className="text-[10px] tracking-[0.25em] mb-2" style={{ color: "var(--gold)" }}>EDUCATION</div>
        <div className="text-sm whitespace-pre-wrap leading-relaxed" style={{ color: "#f4efe1" }}>{data.eduPhilosophy}</div>
      </div>

      <div className="rounded-2xl p-4" style={panel}>
        <h3 className="font-bold mb-1" style={{ fontFamily: "'Noto Serif KR', serif" }}>{grade} 강의실</h3>
        <p className="text-xs whitespace-pre-wrap" style={{ color: "#7a6f52" }}>{(data.curricula && data.curricula[grade]) || CLASS_DETAILS[grade] || "루틴반"}</p>
      </div>

      <StudentVideos data={data} studentId={studentId} />

      <ClassScheduleCard data={data} studentId={studentId} />

      <SeatStatus data={data} />
    </div>
  );
}

function AnnouncementsTab({ data, setData }) {
  const [title, setTitle] = useState("");
  const [message, setMessage] = useState("");

  const [target, setTarget] = useState("ALL");

  const add = () => {
    if (!title.trim()) return;
    const item = { id: uid(), title: title.trim(), message: message.trim(), date, target, createdAt: new Date().toISOString() };
    setData({ ...data, announcements: [item, ...(data.announcements || [])] });
    setTitle(""); setMessage(""); setDate(""); setTarget("ALL");
  };
  const remove = (id) => setData({ ...data, announcements: (data.announcements || []).filter(a => a.id !== id) });
  const list = [...(data.announcements || [])].sort((a, b) => b.createdAt.localeCompare(a.createdAt));

  return (
    <div className="rounded-2xl p-4 flex flex-col gap-3" style={panel}>

        <div className="flex gap-2">

      </div>
      {list.length === 0 ? <EmptyState text="등록된 공지사항이 없습니다." /> : (
        <ul className="flex flex-col gap-2">
          {list.map(a => (

// 학생: 오늘 출석 체크인 (도착 시 직접 누르면 기준 시각과 비교해 출석/지각 자동 기록)
function StudentAttendanceCheckin({ data, setData, studentId }) {
  const today = todayStr();
  const todays = data.attendance.find(a => a.studentId === studentId && a.date === today);
  const student = data.students.find(s => s.id === studentId);
  const cutoff = (student?.classGroup && data.attendanceCutoffTimes?.[student.classGroup]) || data.attendanceCutoffDefault || "16:00";

  const checkIn = () => {
    const now = new Date();
    const time = `${String(now.getHours()).padStart(2, "0")}:${String(now.getMinutes()).padStart(2, "0")}`;
    const [ch, cm] = cutoff.split(":").map(Number);
    const graceTotalMin = ch * 60 + cm + 5; // 정규수업시간 기준 5분까지는 출석으로 인정
    const graceLimit = `${String(Math.floor(graceTotalMin / 60) % 24).padStart(2, "0")}:${String(graceTotalMin % 60).padStart(2, "0")}`;
    const status = time <= graceLimit ? "출석" : "지각";
    const entry = { id: uid(), studentId, date: today, status, time, source: "student" };
    setData({ ...data, attendance: [...data.attendance, entry] });
  };

  const statusColor = { "출석": "#4c8c5f", "지각": "var(--gold)", "결석": "var(--coral)" };

  return (
    <div className="rounded-2xl p-5" style={{ background: "#173226" }}>
      <div className="text-[10px] tracking-[0.3em] mb-3" style={{ color: "var(--gold)" }}>ROUTINE MATH ACADEMY</div>
      <h3 className="text-lg font-bold mb-1" style={{ color: "#f4efe1", fontFamily: "'Noto Serif KR', serif" }}>오늘 출석 체크인</h3>
      <p className="text-xs mb-4" style={{ color: "rgba(244,239,225,0.6)" }}>{today} · 기준 시각 {cutoff}{student?.classGroup ? ` (${student.classGroup} 반 기준)` : " (기본 기준)"} · 5분까지는 출석 인정, 그 이후는 지각</p>
      {todays ? (
        <div className="rounded-xl p-4 flex items-center justify-between" style={{ background: "#1f4534" }}>
          <span className="text-sm" style={{ color: "#f4efe1" }}>{todays.time ? `${todays.time} 도착` : "체크인 완료"}</span>
          <span className="text-xs font-bold px-3 py-1 rounded-full" style={{ background: statusColor[todays.status], color: "#fff" }}>{todays.status}</span>
        </div>
      ) : (
        <button onClick={checkIn} className="w-full py-3.5 rounded-xl text-sm font-semibold" style={btnGold}>출석하기</button>
      )}
    </div>
  );
}

  const newVideoCount = data.videos.filter(v => (v.target === "ALL" || v.target === student?.grade) && !seenVideoIds.has(v.id)).length;
  const upcomingSessionCount = data.sessions.filter(s => s.studentId === studentId && s.status === "예정" && s.date >= todayStr()).length;
  const retestTests = data.tests.filter(t => t.studentId === studentId && t.retest);
  const noticeCount = (data.announcements || []).filter(a => a.target === "ALL" || a.target === student?.grade).length;

  // 선생님이 새로 "확인"한 숙제·플래너를 로그인 직후 눈에 띄게 알려주고, 한 번 보면 다시 안 뜨게 표시
  const seenHw = new Set(student?.seenReviewedHomeworkIds || []);
  const seenPlanner = new Set(student?.seenReviewedPlannerDates || []);
  const newReviewedHw = data.homeworks.filter(h => h.studentId === studentId && h.reviewedByStaff && !seenHw.has(h.id));
  const newReviewedPlanner = (data.plannerChecks || []).filter(c => c.studentId === studentId && !seenPlanner.has(c.date));
  const hasNewReview = newReviewedHw.length > 0 || newReviewedPlanner.length > 0;
  useEffect(() => {
    if (!hasNewReview) return;
    const t = setTimeout(() => {
      setData({
        ...data,
        students: data.students.map(s => s.id === studentId ? {
          ...s,
          seenReviewedHomeworkIds: [...(s.seenReviewedHomeworkIds || []), ...newReviewedHw.map(h => h.id)],
          seenReviewedPlannerDates: [...(s.seenReviewedPlannerDates || []), ...newReviewedPlanner.map(c => c.date)],
        } : s),
      });
    }, 4000); // 몇 초 보여준 뒤 확인 처리
    return () => clearTimeout(t);
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [hasNewReview]);

  return (
    <div className="min-h-screen px-5 pb-6" style={{ background: "#f6f1e4", paddingTop: "max(24px, calc(env(safe-area-inset-top) + 16px))" }}>

        </div>
        <button onClick={onLogout} className="p-2 rounded-lg" style={{ border: "1px solid #ddcda0" }}><LogOut size={16} color="#7a6f52" /></button>
      </div>
      {hasNewReview && (
        <div className="rounded-2xl p-3 mb-4 flex flex-col gap-1.5" style={{ background: "#fde3c8", border: "2px solid #b3261e" }}>
          <div className="flex items-center gap-2">
            <span style={{ fontSize: 22 }}>🔥</span>
            <span className="text-sm font-bold" style={{ color: "#b3261e" }}>선생님이 확인했어요!</span>
          </div>
          {newReviewedHw.length > 0 && (
            <p className="text-xs" style={{ color: "#8a3a1e" }}>숙제: {newReviewedHw.map(h => `${h.title} (${h.date})`).join(", ")}</p>
          )}
          {newReviewedPlanner.length > 0 && (
            <p className="text-xs" style={{ color: "#8a3a1e" }}>플래너: {newReviewedPlanner.map(c => c.date).join(", ")}</p>

      <div className="flex gap-2 mb-4 flex-wrap">
        {STUDENT_TABS.map(t => {
          const Icon = t.icon; const active = tab === t.id;
          const badge = t.id === "classroom" ? newVideoCount : (t.id === "sessions" ? upcomingSessionCount : (t.id === "notices" ? noticeCount : (t.id === "retest" ? retestTests.length : 0)));

              style={{ background: active ? "#efe3c8" : "transparent", border: `1px solid ${active ? "var(--gold)" : "#e4d8ba"}` }}>

function App() {
  const { data, setData, patchData, loading, loadError, retryLoad, saving, saveError } = useAppData();
  const [view, setView] = useState("gate");
  const [studentId, setStudentId] = useState(null);
  const [teacherId, setTeacherId] = useState(null);

  // 새 버전이 배포되면 자동으로 최신 코드를 다시 받아옴 (학생 기기에서 캐시 지우기 불필요)
  useEffect(() => {
    const checkVersion = async () => {
      try {
        const res = await fetch("./version.txt", { cache: "no-store" });
        if (!res.ok) return;
        const v = (await res.text()).trim();
        if (v && typeof APP_VERSION !== "undefined" && v !== APP_VERSION) {
          const url = new URL(window.location.href);
          url.searchParams.set("v", v);
          window.location.replace(url.toString());
        }
      } catch (e) { /* version.txt 없음 또는 네트워크 오류 - 무시 */ }
    };
    checkVersion();
    const interval = setInterval(checkVersion, 30 * 1000);
    return () => clearInterval(interval);
  }, []);

  // 마감기한이 지난 미제출 숙제가 있으면, 학생별로 하루에 한 번 소통 알림 생성
  useEffect(() => {
    if (loading) return;
    const today = todayStr();
    let alerts = data.alerts;
    let changed = false;
    data.students.forEach(s => {
      const overdueCount = data.homeworks.filter(h => h.studentId === s.id && !h.submitted && (h.dueDate || h.date) < today).length;
      const sourceKey = `overdue-homework-daily:${s.id}:${today}`;
      const next = syncAlerts(alerts, sourceKey, overdueCount > 0, () => ({
        studentId: s.id, kind: "숙제 마감 초과",
        message: `[루틴수학] ${s.name} 학생의 마감기한이 지난 미제출 숙제가 ${overdueCount}건 있습니다.`,
      }));
      if (next !== alerts) { alerts = next; changed = true; }
    });
    if (changed) setData({ ...data, alerts });
  }, [loading, data.homeworks, data.students]);

  // 오늘이 재시험 날짜인 시험은, "오늘 할 일" 체크리스트에 TEST 항목으로 자동 표시 (해결되면 자동으로 사라짐)
  useEffect(() => {
    if (loading) return;
    const today = todayStr();
    const tasks = data.dailyTasks || [];
    const todayRetests = data.tests.filter(t => t.retest && t.retestDate === today);
    let next = tasks;
    let changed = false;
    todayRetests.forEach(t => {
      const taskId = `retest-${t.id}`;
      if (!next.find(x => x.id === taskId)) {
        const student = data.students.find(s => s.id === t.studentId);
        next = [...next, { id: taskId, type: "TEST", label: `${student?.name || ""} 재시험 · ${t.name}`, time: "", done: false }];
        changed = true;
      }
    });
    const validIds = new Set(todayRetests.map(t => `retest-${t.id}`));
    const filtered = next.filter(x => !String(x.id).startsWith("retest-") || validIds.has(x.id));
    if (filtered.length !== next.length) { next = filtered; changed = true; }
    if (changed) setData({ ...data, dailyTasks: next });
  }, [loading, data.tests, data.students]);

  // 오늘 출석/지각 체크된 학생은 "오늘 할 일" 체크리스트에 등원 항목으로 자동 표시 (시각 포함, 완료 처리됨)
  useEffect(() => {
    if (loading) return;
    const today = todayStr();
    const tasks = data.dailyTasks || [];
    const todayArrivals = data.attendance.filter(a => a.date === today && (a.status === "출석" || a.status === "지각"));
    let next = tasks;
    let changed = false;
    todayArrivals.forEach(a => {
      const taskId = `attend-${a.id}`;
      const existing = next.find(x => x.id === taskId);
      const student = data.students.find(s => s.id === a.studentId);
      const label = `${student?.name || ""} 등원${a.status === "지각" ? " (지각)" : ""}`;
      if (!existing) {
        next = [...next, { id: taskId, type: "등원", label, time: a.time || "", done: true }];
        changed = true;
      } else if (existing.label !== label) {
        next = next.map(x => x.id === taskId ? { ...x, label, time: a.time || "" } : x);
        changed = true;
      }
    });
    const validIds = new Set(todayArrivals.map(a => `attend-${a.id}`));
    const filtered = next.filter(x => !String(x.id).startsWith("attend-") || validIds.has(x.id));
    if (filtered.length !== next.length) { next = filtered; changed = true; }
    if (changed) setData({ ...data, dailyTasks: next });
  }, [loading, data.attendance, data.students]);

  useEffect(() => {
    if (document.getElementById("routine-font-link")) return;
    const link = document.createElement("link");
    link.id = "routine-font-link"; link.rel = "stylesheet";
    link.href = "https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700&family=Pretendard:wght@400;500;600&display=swap";
    document.head.appendChild(link);
  }, []);

  useEffect(() => {
    document.title = "루틴수학";
    const setMeta = (name, content) => {
      let m = document.querySelector(`meta[name="${name}"]`);
      if (!m) { m = document.createElement("meta"); m.name = name; document.head.appendChild(m); }
      m.content = content;
    };
    setMeta("apple-mobile-web-app-title", "루틴수학");
    setMeta("apple-mobile-web-app-capable", "yes");
    setMeta("mobile-web-app-capable", "yes");
  }, []);

  // 홈 화면 아이콘 배지: 학부모 알림 대기 + 요청 대기 + 답장 필요한 1:1 문의 합계
  // (Badging API — 홈 화면에 추가한 상태에서 앱을 최근에 열어본 적이 있어야 갱신돼요.
  //  앱을 아예 안 열고 있어도 실시간으로 뜨게 하려면 별도의 푸시 알림 서버가 필요해요.)
  useEffect(() => {
    if (loading) return;
    if (!("setAppBadge" in navigator)) return;
    const total = data.alerts.filter(a => a.status === "대기").length
      + data.requests.filter(r => r.status === "대기").length
      + pendingMessageThreads(data);
    try {
      if (total > 0) navigator.setAppBadge(total).catch(() => {});
      else navigator.clearAppBadge().catch(() => {});
    } catch (e) { /* Badging API 미지원 브라우저는 무시 */ }
  }, [data, loading]);

  if (loading) return <div className="min-h-screen flex items-center justify-center" style={{ background: "#f6f1e4" }}><Loader2 className="animate-spin" color="var(--gold)" /></div>;

  if (loadError) return (
    <div className="min-h-screen flex items-center justify-center p-6" style={{ background: "#f6f1e4" }}>
      <div className="rounded-2xl p-6 flex flex-col gap-3 items-center text-center max-w-sm" style={{ background: "#fffaf0", border: "1px solid #e4d8ba" }}>
        <div className="text-3xl">⚠️</div>
        <b style={{ color: "#2b2417" }}>서버에서 데이터를 불러오지 못했어요</b>
        <p className="text-sm" style={{ color: "#5c543e" }}>인터넷 연결을 확인하고 다시 시도해 주세요. 계속 안 되면 선생님께 알려주세요.</p>
        <p className="text-[11px]" style={{ color: "#8a7f5e" }}>기존 데이터를 보호하기 위해, 연결될 때까지는 아무것도 저장되지 않아요.</p>
        <button onClick={retryLoad} className="px-4 py-2 rounded-lg text-sm font-semibold" style={{ background: "#e2822f", color: "#1a1508" }}>다시 시도</button>
      </div>
    </div>
  );

  const teacher = data.teachers.find(t => t.id === teacherId);

  return (
    <div style={{ "--gold": "#e2822f", "--coral": "#c65a1f" }}>
      <style>{`* { font-family: 'Pretendard', sans-serif; } h1,h2,h3 { color: #2b2417; } input:focus, select:focus, textarea:focus { border-color: var(--gold) !important; } @media print { body * { visibility: hidden; } #print-area, #print-area * { visibility: visible; } #print-area { position: absolute; top: 0; left: 0; width: 100%; margin: 0; padding: 16px; } #print-area input, #print-area textarea { border: none !important; background: transparent !important; padding: 0 !important; resize: none; } .print-hide { display: none !important; } #print-area * { -webkit-print-color-adjust: exact; print-color-adjust: exact; } #print-area .avoid-break, #print-area .rounded-2xl, #print-area .rounded-lg, #print-area .rounded-xl, #print-area tr, #print-area svg, #print-area table { break-inside: avoid; page-break-inside: avoid; } #print-area h3, #print-area h4 { break-after: avoid; page-break-after: avoid; } #print-area { display: table !important; } #print-area > * { margin-bottom: 16px; } #print-area .print-footer-space { display: table-footer-group !important; } #print-area .print-footer-space > div { height: 14mm; } #print-area .print-header-space { display: table-header-group !important; } #print-area .print-header-space > div { height: 14mm; } #print-area .print-footer { display: flex !important; position: fixed; left: 16px; right: 16px; bottom: 0; } } .print-only { display: none; }`}</style>

      {view === "gate" && <RoleGate onStudent={() => setView("studentLogin")} onTeacher={() => setView("teacherLogin")} onAdmin={() => setView("adminGate")} />}

      {view === "studentLogin" && (
        <PhoneLoginCard heading="학생 로그인" sub="강의실 · 플래너 · 자습실"
          onSubmit={(name, pin) => { const m = findByPhone(data.students, name, pin); if (m) { setStudentId(m.id); setView("student"); return true; } return false; }}
          onBack={() => setView("gate")} />
      )}
      {view === "student" && <StudentHome data={data} setData={setData} studentId={studentId} onLogout={() => { try { localStorage.removeItem(`routine_math_timer_${studentId}`); } catch (e) { /* 무시 */ } setStudentId(null); setView("gate"); }} />}

      {view === "teacherLogin" && (
        <TeacherLoginCard data={data} onLogin={(id) => { setTeacherId(id); setView("teacher"); }} onBack={() => setView("gate")} />
      )}
      {view === "teacher" && teacher && <TeacherHome data={data} setData={setData} patchData={patchData} teacher={teacher} onLogout={() => { setTeacherId(null); setView("gate"); }} />}

      {view === "adminGate" && <AdminGate onPass={() => setView("admin")} onBack={() => setView("gate")} />}
      {view === "admin" && <AdminPanel data={data} setData={setData} patchData={patchData} onExit={() => setView("gate")} />}

      {saving && (
        <div className="fixed bottom-4 left-1/2 -translate-x-1/2 text-sm font-bold px-4 py-2 rounded-full flex items-center gap-2" style={{ background: "#2b2417", color: "#fff", zIndex: 9999 }}>
          <Loader2 size={14} className="animate-spin" />저장 중… (잠시만 기다려주세요)
        </div>
      )}
      {saveError && !saving && (
        <div className="fixed bottom-4 left-1/2 -translate-x-1/2 text-sm font-bold px-4 py-2 rounded-full text-center" style={{ background: "var(--coral)", color: "#fff", zIndex: 9999 }}>
          ⚠️ 저장 실패! 인터넷 연결을 확인하고 다시 시도해주세요.
        </div>
      )}
    </div>
  );
}


try {
  ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  window.__appMounted = true;
} catch (e) {
  window.showError("앱 실행 중 오류", (e && e.stack) ? e.stack : String(e));
}
</script>
</body>
</html>
