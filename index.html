                <Field label={i === 0 ? "칸 수" : ""}><input type="number" min={1} max={20} className={inputCls} style={inputStyle} value={u.cells} onChange={e => setUnit(i, { cells: e.target.value })} /></Field>
                <Field label={i === 0 ? "칸 이름 (선택, 쉼표로 구분)" : ""}><input className={inputCls} style={inputStyle} value={u.labelsText} onChange={e => setUnit(i, { labelsText: e.target.value })} placeholder="예: 개념, A, B, C" /></Field>
                <button onClick={() => setForm({ ...form, units: form.units.filter((_, j) => j !== i) })} className="p-2 rounded-md mb-0.5" style={{ background: "#efe3c8" }} disabled={form.units.length === 1}><X size={14} color="#8a7f5e" /></button>
              </div>
            ))}
            <button onClick={() => setForm({ ...form, units: [...form.units, { id: uid(), name: "", cells: 2, labelsText: "" }] })} className="self-start px-3 py-1.5 rounded-lg text-xs font-semibold flex items-center gap-1" style={{ border: "1px solid #ddcda0", color: "#5c543e" }}><Plus size={13} />단원 추가</button>
            {form.id && <p className="text-[11px]" style={{ color: "#8a7f5e" }}>칸 수를 줄이면 오른쪽 끝 칸부터 없어지고, 그 칸에 표시했던 진도도 보이지 않게 돼요.</p>}
          </div>
          <div className="flex gap-2">
            <button onClick={submitForm} className="px-4 py-2 rounded-lg text-sm font-semibold flex items-center gap-1" style={btnGold}>{form.id ? <Pencil size={16} /> : <Plus size={16} />}{form.id ? "수정 저장" : "만들기"}</button>
            <button onClick={() => setForm(null)} className="px-4 py-2 rounded-lg text-sm" style={{ border: "1px solid #ddcda0", color: "#5c543e" }}>취소</button>
          </div>
        </div>
      )}

    </div>
  );
}

// ================= 월간 리포트 PDF 파일 만들기 (html2canvas + jsPDF, 필요할 때만 불러옴) =================
const _scriptCache = {};
function loadScriptOnce(src) {
  if (!_scriptCache[src]) {
    _scriptCache[src] = new Promise((resolve, reject) => {
      const s = document.createElement("script");
      s.src = src; s.async = true;
      s.onload = resolve;
      s.onerror = () => { delete _scriptCache[src]; reject(new Error("스크립트를 불러오지 못했어요: " + src)); };
      document.head.appendChild(s);
    });
  }
  return _scriptCache[src];
}

async function exportElementToPdf(el, fileName) {
  await loadScriptOnce("https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js");
  await loadScriptOnce("https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js");
  const { jsPDF } = window.jspdf;

  // A4 세로, 여백 10mm. 폰에서도 PC와 같은 모양이 되도록 잠깐 폭을 고정해서 찍음
  const PAGE_W_MM = 210, PAGE_H_MM = 297, MARGIN_MM = 10;
  const FOOTER_MM = 10; // 페이지 하단 학원 문구 자리
  const TOP_MM = MARGIN_MM + FOOTER_MM; // 위 여백을 아래(문구 자리 포함)와 같은 높이로
  const CONTENT_W_MM = PAGE_W_MM - MARGIN_MM * 2, CONTENT_H_MM = PAGE_H_MM - TOP_MM - MARGIN_MM - FOOTER_MM;
  const CAPTURE_W = 760;
  const prev = { width: el.style.width, maxWidth: el.style.maxWidth };
  el.style.width = `${CAPTURE_W}px`; el.style.maxWidth = "none";
  await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));

  try {
    const pageHpx = CONTENT_H_MM * (CAPTURE_W / CONTENT_W_MM); // 한 페이지에 들어가는 높이(화면 px)
    const estH = el.scrollHeight;
    const scale = Math.min(2, Math.sqrt(14000000 / (CAPTURE_W * Math.max(estH, 1)))); // 폰 브라우저 캔버스 한도 고려
    let intervals = [], totalH = estH;

    const canvas = await window.html2canvas(el, {
      scale, backgroundColor: "#f6f1e4", useCORS: true, logging: false,
      onclone: (doc) => {
        const root = doc.getElementById(el.id);
        if (!root) return;
        root.querySelectorAll(".print-hide, .print-only").forEach(n => n.remove());
        // 입력칸은 글자로 바꿔서 찍음 (칸 테두리·잘림 없이)
        root.querySelectorAll("input, textarea").forEach(inp => {
          const d = doc.createElement("div");
          d.textContent = inp.value || "-";
          d.style.cssText = "white-space:pre-line;font-size:14px;line-height:1.6;color:#2b2417;";
          inp.replaceWith(d);
        });
        // 페이지를 나눌 때 자르면 안 되는 덩어리들의 위치 (한 페이지보다 큰 건 제외)
        const top0 = root.getBoundingClientRect().top;
        totalH = root.scrollHeight;
        intervals = [...root.querySelectorAll(".avoid-break, .rounded-2xl, .rounded-xl, .rounded-lg, tr, svg, table, h3")]
          .map(n => { const r = n.getBoundingClientRect(); return [r.top - top0, r.bottom - top0]; })
          .filter(([a, b]) => b - a > 1 && b - a < pageHpx * 0.95);
      },
    });

    // 자를 위치 정하기: 페이지 끝이 덩어리 한가운데면, 그 위의 가장 가까운 덩어리 경계에서 자름
    const inside = (y) => intervals.some(([a, b]) => a < y - 0.5 && y + 0.5 < b);
    const cuts = [];
    let start = 0;
    while (start < totalH - 1) {
      const end = start + pageHpx;
      if (end >= totalH) { cuts.push([start, totalH]); break; }
      let y = end;
      if (inside(y)) {
        const cand = intervals.flatMap(([a, b]) => [a, b]).filter(v => v > start + pageHpx * 0.3 && v <= end && !inside(v)).sort((p, q) => q - p);
        if (cand.length) y = cand[0] - 2;
      }
      cuts.push([start, y]);
      start = y;
    }

    // 페이지 하단 문구: "루틴수학학원 | 수학상위권집합소 … 최고의 경쟁력은 습관이다 · 1 / 3"
    try { await document.fonts.ready; } catch (e) { /* 무시 */ }
    const FONT = "Pretendard, 'Noto Sans KR', sans-serif";
    const makeFooter = (pageNo, total) => {
      const W = 1520, H = 64; // 190mm x 8mm (1mm = 8px)
      const c = document.createElement("canvas"); c.width = W; c.height = H;
      const g = c.getContext("2d");
      g.fillStyle = "#f6f1e4"; g.fillRect(0, 0, W, H);
      g.strokeStyle = "#d9ccab"; g.lineWidth = 2; g.beginPath(); g.moveTo(0, 3); g.lineTo(W, 3); g.stroke();
      g.textBaseline = "middle";
      const y = H / 2 + 6;
      let x = 0;
      g.font = `700 26px ${FONT}`;
      g.fillStyle = "#e2822f"; g.fillText("수학상위권집합소", x, y);
      g.textAlign = "right"; g.font = `500 20px ${FONT}`;
      const pageText = `   ·   ${pageNo} / ${total}`;
      g.fillStyle = "#8a7f5e"; g.fillText(pageText, W, y);
      g.fillStyle = "#2b2417"; g.fillText("최고의 경쟁력은 습관이다", W - g.measureText(pageText).width, y);
      return c.toDataURL("image/png");
    };

    const pdf = new jsPDF({ orientation: "portrait", unit: "mm", format: "a4" });
    const pxScale = canvas.width / CAPTURE_W;
    cuts.forEach(([y0, y1], i) => {
      const sy = Math.round(y0 * pxScale), sh = Math.max(1, Math.round((y1 - y0) * pxScale));
      const page = document.createElement("canvas");
      page.width = canvas.width; page.height = sh;
      const ctx = page.getContext("2d");
      ctx.fillStyle = "#f6f1e4"; ctx.fillRect(0, 0, page.width, page.height);
      ctx.drawImage(canvas, 0, sy, canvas.width, sh, 0, 0, canvas.width, sh);
      if (i > 0) pdf.addPage();
      pdf.setFillColor(246, 241, 228); pdf.rect(0, 0, PAGE_W_MM, PAGE_H_MM, "F");
      pdf.addImage(page.toDataURL("image/jpeg", 0.92), "JPEG", MARGIN_MM, TOP_MM, CONTENT_W_MM, sh / pxScale * (CONTENT_W_MM / CAPTURE_W));
      pdf.addImage(makeFooter(i + 1, cuts.length), "PNG", MARGIN_MM, PAGE_H_MM - MARGIN_MM - 8, CONTENT_W_MM, 8);
    });

    // 폰에서는 공유 창(카카오톡 등)으로, PC에서는 파일로 저장
    const blob = pdf.output("blob");
    const file = new File([blob], fileName, { type: "application/pdf" });
    const isTouch = window.matchMedia && window.matchMedia("(pointer: coarse)").matches;
    if (isTouch && navigator.canShare && navigator.canShare({ files: [file] })) {
      try { await navigator.share({ files: [file], title: fileName }); return; }
      catch (e) { if (e && e.name === "AbortError") return; }
    }
    pdf.save(fileName);
  } finally {
    el.style.width = prev.width; el.style.maxWidth = prev.maxWidth;
  }
}

// ================= 수업계획표 (반별·개별, 월 단위) =================
function nextMonthStr(month) {
  const [y, m] = month.split("-").map(Number);
  const d = new Date(y, m, 1);
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}`;
}
// 반 시간표의 수업 요일로 그 달 수업 날짜 목록 만들기
function classDatesInMonth(data, classGroup, month) {
  const blocks = (data.classSchedules && data.classSchedules[classGroup]) || [];
  const days = new Set(blocks.flatMap(b => b.days || []));
  if (days.size === 0) return [];
  const [y, m] = month.split("-").map(Number);
  const last = new Date(y, m, 0).getDate();
  const out = [];
  for (let d = 1; d <= last; d++) {
    const dt = new Date(y, m - 1, d);
    const label = DAYS[(dt.getDay() + 6) % 7]; // DAYS는 월요일부터
    if (days.has(label)) out.push(`${month}-${String(d).padStart(2, "0")}`);
  }
  return out;
}
function syllabiForStudent(data, student, month) {
  if (!student) return [];
  return (data.syllabi || []).filter(s => s.month === month && (
    (s.ownerType === "student" && s.studentId === student.id) ||
    (s.ownerType === "class" && s.classGroup && s.classGroup === student.classGroup)
  )).sort((a, b) => (a.ownerType === b.ownerType ? 0 : a.ownerType === "class" ? -1 : 1));
}
const shortMD = (d) => d ? `${Number(d.slice(5, 7))}/${Number(d.slice(8, 10))}` : "";

function SyllabusTable({ syllabus, ownerLabel }) {
  const rows = [...(syllabus.rows || [])].filter(r => r.date || (r.plan || "").trim()).sort((a, b) => (a.date || "9999").localeCompare(b.date || "9999"));
  const border = "1px solid #2b2417";
  const th = { border, background: "#e8eef7", padding: "6px 8px", fontWeight: 600, color: "#2b2417", WebkitPrintColorAdjust: "exact", printColorAdjust: "exact" };
  const td = { border, padding: "8px", verticalAlign: "middle", color: "#2b2417" };
  return (
    <div className="flex flex-col gap-1.5 avoid-break">
      {ownerLabel && <div className="text-xs font-semibold" style={{ color: "#5c543e" }}>{ownerLabel}</div>}
      <div style={{ overflowX: "auto" }}>
        <table style={{ borderCollapse: "collapse", width: "100%", fontSize: 13 }}>
          <thead>
            <tr><th style={{ ...th, width: 70 }}>날짜</th><th style={{ ...th, width: 70 }}>반</th><th style={th}>수업 계획</th></tr>
          </thead>
          <tbody>
            {rows.length === 0 ? (
              <tr><td colSpan={3} style={{ ...td, textAlign: "center", color: "#8a7f5e" }}>작성된 계획이 없어요.</td></tr>
            ) : rows.map(r => (
              <tr key={r.id}>
                <td style={{ ...td, textAlign: "center" }}>{shortMD(r.date)}</td>
                <td style={{ ...td, textAlign: "center" }}>{r.classLabel || ""}</td>
                <td style={{ ...td, whiteSpace: "pre-line", lineHeight: 1.6 }}>{r.plan || ""}</td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>
    </div>
  );
}

function SyllabusEditor({ data, syllabus, onSave, onDirtyChange }) {
  const defaultClass = (syllabus.ownerType === "class" ? syllabus.classGroup : data.students.find(s => s.id === syllabus.studentId)?.classGroup) || "";
  const shortClass = (g) => (g || "").split("-")[0] || g;
  const [rows, setRows] = useState(syllabus.rows || []);
  const savedJson = JSON.stringify(syllabus.rows || []);
  const dirty = JSON.stringify(rows) !== savedJson;
  useEffect(() => { if (!dirty) setRows(syllabus.rows || []); }, [savedJson]);
  useEffect(() => { onDirtyChange && onDirtyChange(dirty); }, [dirty]);

  const setRow = (id, patch) => setRows(rows.map(r => r.id === id ? { ...r, ...patch } : r));
  const addRow = () => setRows([...rows, { id: uid(), date: "", classLabel: shortClass(defaultClass), plan: "" }]);
  const removeRow = (id) => setRows(rows.filter(r => r.id !== id));
  const autoFill = () => {
    const dates = classDatesInMonth(data, defaultClass, syllabus.month);
    if (dates.length === 0) { alert(`"${defaultClass || "이 반"}"의 수업 요일이 시간표에 없어요.\n반별 수업 시간표에 요일을 먼저 등록하거나, "줄 추가"로 직접 넣어주세요.`); return; }
    const have = new Set(rows.map(r => r.date));
    const added = dates.filter(d => !have.has(d)).map(d => ({ id: uid(), date: d, classLabel: shortClass(defaultClass), plan: "" }));
    setRows([...rows, ...added].sort((a, b) => (a.date || "9999").localeCompare(b.date || "9999")));
  };
  const copyPrev = () => {
    const [y, m] = syllabus.month.split("-").map(Number);
    const pd = new Date(y, m - 2, 1);
    const prevMonth = `${pd.getFullYear()}-${String(pd.getMonth() + 1).padStart(2, "0")}`;
    const prev = (data.syllabi || []).find(s => s.month === prevMonth && s.ownerType === syllabus.ownerType && s.classGroup === syllabus.classGroup && s.studentId === syllabus.studentId);
    if (!prev || !(prev.rows || []).length) { alert("지난달 수업계획표가 없어요."); return; }
    alert("지난달 계획 내용을 이번 달 날짜 순서대로 채웠어요. 필요한 부분만 고쳐주세요.");
    const sortedPrev = [...prev.rows].sort((a, b) => (a.date || "").localeCompare(b.date || ""));
    const sortedCur = [...rows].sort((a, b) => (a.date || "9999").localeCompare(b.date || "9999"));
    setRows(sortedCur.map((r, i) => (!(r.plan || "").trim() && sortedPrev[i]) ? { ...r, plan: sortedPrev[i].plan } : r));
  };

  return (
    <div className="flex flex-col gap-2">
      <div className="flex gap-1.5 flex-wrap">
        <button onClick={autoFill} className="px-2.5 py-1 rounded-md text-[11px] font-semibold flex items-center gap-1" style={{ background: "#3d9a50", color: "#fff" }}><Calendar size={12} />수업 날짜 자동 채우기</button>
        <button onClick={addRow} className="px-2.5 py-1 rounded-md text-[11px] font-semibold flex items-center gap-1" style={{ border: "1px solid #ddcda0", color: "#5c543e", background: "#fffaf0" }}><Plus size={12} />줄 추가</button>
        <button onClick={copyPrev} className="px-2.5 py-1 rounded-md text-[11px] font-semibold flex items-center gap-1" style={{ border: "1px solid #ddcda0", color: "#5c543e", background: "#fffaf0" }}><Copy size={12} />지난달 계획 가져오기</button>
      </div>
      {rows.length === 0 ? <EmptyState text='"수업 날짜 자동 채우기"나 "줄 추가"로 시작하세요.' /> : (
        <div className="flex flex-col gap-1.5">
          {rows.map(r => (
            <div key={r.id} className="grid gap-1.5 items-start" style={{ gridTemplateColumns: "118px 64px 1fr auto" }}>
              <input type="date" className={inputCls} style={{ ...inputStyle, padding: "6px" }} value={r.date} onChange={e => setRow(r.id, { date: e.target.value })} />
              <input className={inputCls} style={{ ...inputStyle, padding: "6px" }} value={r.classLabel || ""} onChange={e => setRow(r.id, { classLabel: e.target.value })} placeholder="반" />
              <textarea className={inputCls} style={{ ...inputStyle, padding: "6px", minHeight: 44 }} rows={2} value={r.plan || ""} onChange={e => setRow(r.id, { plan: e.target.value })} placeholder={"예: 중3-2 일품 1단원 삼각비\n중2-2 일품 3단원 확률"} />
              <button onClick={() => removeRow(r.id)} className="p-2 rounded-md" style={{ background: "#efe3c8" }} title="줄 삭제"><X size={13} color="#8a7f5e" /></button>
            </div>
          ))}
        </div>
      )}
      <div className="flex items-center gap-2 flex-wrap">
        <button onClick={() => onSave(rows)} className="px-4 py-2 rounded-lg text-sm font-semibold" style={dirty ? { background: "#2b2417", color: "#fff" } : { background: "#fffaf0", color: "#2b2417", border: "1px solid #2b2417" }}>저장</button>
        <span className="text-[11px] font-semibold" style={{ color: dirty ? "var(--coral)" : "#8a7f5e" }}>{dirty ? "● 저장하지 않은 내용이 있어요" : "✓ 저장됨"}</span>
      </div>
      <p className="text-[11px]" style={{ color: "#8a7f5e" }}>수업 계획 칸은 Enter로 줄을 나눠 교재별로 적을 수 있어요. 클리닉 같은 일정은 일정표에 들어가니 여기엔 수업 내용만 적으면 돼요.</p>
    </div>
  );
}

function SyllabusTab({ data, setData, scopeClassGroups }) {
  const syllabi = data.syllabi || [];
  const scopedStudents = studentsInScope(data.students, scopeClassGroups);
  const scopedIds = new Set(scopedStudents.map(s => s.id));
  const classOptions = [...new Set([...CLASS_GROUPS, ...data.students.map(s => s.classGroup).filter(Boolean)])]
    .filter(g => !scopeClassGroups || !scopeClassGroups.length || scopeClassGroups.includes(g));
  const studentName = (id) => data.students.find(s => s.id === id)?.name || "-";
  const [month, setMonth] = useState(nextMonthStr(todayStr().slice(0, 7)));
  const [openId, setOpenId] = useState(null);
  const [dirty, setDirty] = useState(false);
  const [adding, setAdding] = useState(false);
  const [ownerType, setOwnerType] = useState("class");
  const [classGroup, setClassGroup] = useState(classOptions[0] || "");
  const [studentId, setStudentId] = useState("");

  const visible = syllabi.filter(s => s.month === month && (s.ownerType === "class" ? classOptions.includes(s.classGroup) : scopedIds.has(s.studentId)))
    .sort((a, b) => (a.ownerType === b.ownerType ? 0 : a.ownerType === "class" ? -1 : 1) || (a.classGroup || studentName(a.studentId)).localeCompare(b.classGroup || studentName(b.studentId)));
  const open = openId === null ? visible[0] : visible.find(s => s.id === openId);
  const confirmLeave = () => !dirty || window.confirm("저장하지 않은 수업계획이 있어요. 이동하면 사라져요. 계속할까요?");

  const create = () => {
    if (ownerType === "class" && !classGroup) return alert("반을 선택해 주세요.");
    if (ownerType === "student" && !studentId) return alert("학생을 선택해 주세요.");
    const exists = syllabi.find(s => s.month === month && s.ownerType === ownerType && (ownerType === "class" ? s.classGroup === classGroup : s.studentId === studentId));
    if (exists) { alert("이 달에 이미 만든 수업계획표가 있어요. 목록에서 열어서 수정해 주세요."); setOpenId(exists.id); setAdding(false); return; }
    const item = { id: uid(), month, ownerType, classGroup: ownerType === "class" ? classGroup : "", studentId: ownerType === "student" ? studentId : "", rows: [], createdAt: new Date().toISOString() };
    setData({ ...data, syllabi: [...syllabi, item] });
    setOpenId(item.id); setAdding(false); setDirty(false);
  };
  const saveRows = (id, rows) => setData({ ...data, syllabi: syllabi.map(s => s.id === id ? { ...s, rows, updatedAt: new Date().toISOString() } : s) });
  const remove = (s) => {
    if (!window.confirm(`${s.ownerType === "class" ? s.classGroup : studentName(s.studentId)}의 ${Number(s.month.slice(5))}월 수업계획표를 삭제할까요?`)) return;
    setData({ ...data, syllabi: syllabi.filter(x => x.id !== s.id) });
    if (open?.id === s.id) { setOpenId(""); setDirty(false); }
  };

  return (
    <div className="flex flex-col gap-4">

// ================= 루틴 학습효율 관리 (수기 기록지 → 선생님 입력 → 리포트) =================
const EFF_KINDS = ["개념", "문제풀이", "오답정리"];
const EFF_TYPES = [
  { id: "A", name: "속도형", desc: "빠른데 실수가 많음 → 정확도 관리" },
  { id: "B", name: "정체형", desc: "정확도는 괜찮은데 오래 걸림 → 풀이속도 관리" },
  { id: "C", name: "개념형", desc: "특정 개념에서 반복해서 막힘 → 개념 보충" },
  { id: "D", name: "학습습관형", desc: "공부시간이 불규칙·집중력 부족 → 학습 루틴 관리" },
];
const EFF_KIND_COLORS = { "개념": "#3b6fb6", "문제풀이": "#3d9a50", "오답정리": "#e2822f" };

// "12번 8분, 18번 6분" → { count: 2, minutes: 14 }
function parseStuck(text) {
  const t = (text || "").trim();
  if (!t) return { count: 0, minutes: 0, gaveUp: 0 };
  const parts = t.split(/[,，/]+|\s{2,}|\n/).map(x => x.trim()).filter(Boolean);
  let minutes = 0, gaveUp = 0;
  parts.forEach(p => { const m = p.match(/(\d+)\s*분/); if (m) minutes += Number(m[1]); if (/[✕✗×xX]/.test(p)) gaveUp += 1; });
  return { count: parts.length, minutes, gaveUp };
}

function effStats(rows) {
  const s = { minutes: 0, byKind: { "개념": 0, "문제풀이": 0, "오답정리": 0 }, problems: 0, correct: 0, gradedProblems: 0, solveMinutes: 0, solveProblems: 0, stuckCount: 0, stuckMinutes: 0, gaveUp: 0 };
  (rows || []).forEach(r => {
    const min = Number(r.minutes) || 0, pr = Number(r.problems) || 0, co = r.correct === "" || r.correct == null ? null : Number(r.correct);
    s.minutes += min;
    if (s.byKind[r.kind] != null) s.byKind[r.kind] += min;
    s.problems += pr;
    if (pr > 0 && co != null && !isNaN(co)) { s.gradedProblems += pr; s.correct += Math.min(co, pr); }
    if (r.kind === "문제풀이" && pr > 0 && min > 0) { s.solveMinutes += min; s.solveProblems += pr; }
    const st = parseStuck(r.stuck); s.stuckCount += st.count; s.stuckMinutes += st.minutes; s.gaveUp += st.gaveUp;
  });
  s.accuracy = s.gradedProblems > 0 ? Math.round((s.correct / s.gradedProblems) * 100) : null;
  s.secPerProblem = s.solveProblems > 0 ? Math.round((s.solveMinutes * 60) / s.solveProblems) : null;
  return s;
}
const effLogsOf = (data, studentId) => (data.effLogs || []).filter(l => l.studentId === studentId);
const effRowsBetween = (data, studentId, from, to) => effLogsOf(data, studentId).filter(l => l.date >= from && l.date <= to).flatMap(l => effLogRows(l));
const fmtMin = (m) => { m = Math.round(m || 0); const h = Math.floor(m / 60), r = m % 60; return h ? (r ? `${h}시간 ${r}분` : `${h}시간`) : `${r}분`; };
const fmtSec = (s) => s == null ? "-" : `${Math.floor(s / 60)}분 ${String(s % 60).padStart(2, "0")}초`;
// 학생 유형 힌트 (선생님 판단 보조용)
// 학생 유형은 월별로 저장: effProfiles[학생].months["2026-09"] = "B" (예전 방식의 한 개짜리 type은 월별 기록이 없을 때만 참고)
function effTypeOf(data, studentId, month) {
  const p = (data.effProfiles || {})[studentId] || {};
  const months = p.months || {};
  if (month in months) return months[month] || "";
  return Object.keys(months).length === 0 ? (p.type || "") : "";
}
function effTypeHistory(data, studentId) {
  const months = ((data.effProfiles || {})[studentId] || {}).months || {};
  return Object.keys(months).filter(m => months[m]).sort().map(m => ({ month: m, type: months[m] }));
}
const monthEndStr = (month) => { const [y, m] = month.split("-").map(Number); return `${month}-${String(new Date(y, m, 0).getDate()).padStart(2, "0")}`; };

function effTypeHint(st) {
  if (!st || st.gradedProblems < 10) return "";
  if (st.accuracy != null && st.accuracy < 75 && st.secPerProblem != null && st.secPerProblem < 180) return "A";
  if (st.accuracy != null && st.accuracy >= 80 && st.secPerProblem != null && st.secPerProblem >= 300) return "B";
  if (st.stuckCount >= 5 && st.solveProblems > 0 && st.stuckCount / st.solveProblems >= 0.15) return "C";
  return "";
}

// 주간 기록지의 하루 한 줄 → 계산용 줄들로 변환 (예전 형식 rows도 그대로 지원)
function effLogRows(l) {
  if (!l) return [];
  if (Array.isArray(l.rows)) return l.rows;
  const out = [];
  if (Number(l.conceptMin)) out.push({ id: `${l.id}c`, kind: "개념", material: l.material, minutes: l.conceptMin, problems: "", correct: "", stuck: "" });
  if (Number(l.solveMin) || Number(l.problems) || (l.stuck || "").trim()) out.push({ id: `${l.id}s`, kind: "문제풀이", material: l.material, minutes: l.solveMin, problems: l.problems, correct: l.correct, stuck: l.stuck });
  if (Number(l.reviewMin)) out.push({ id: `${l.id}r`, kind: "오답정리", material: l.material, minutes: l.reviewMin, problems: "", correct: "", stuck: "" });
  return out;
}

function EffDayEditor({ log, onSave }) {

  const [f, setF] = useState(init);
  const [base, setBase] = useState(() => JSON.stringify(init()));
  useEffect(() => { const v = init(); setF(v); setBase(JSON.stringify(v)); }, [log?.id, log?.updatedAt]);
  const dirty = JSON.stringify(f) !== base;
  const num = (v) => v.replace(/[^0-9]/g, "");

        {numField("개념 (분)", "conceptMin", EFF_KIND_COLORS["개념"])}
        {numField("문제풀이 (분)", "solveMin", EFF_KIND_COLORS["문제풀이"])}
        {numField("오답정리 (분)", "reviewMin", EFF_KIND_COLORS["오답정리"])}
      </div>
      <div className="grid grid-cols-3 gap-2">
        {numField("문제 수", "problems")}
        {numField("맞은 수", "correct")}
        <div />
      </div>
      <Field label="★ 막힌 문제 (예: 12번 8분, 18번 6분)"><input className={inputCls} style={cell} value={f.stuck} onChange={e => setF({ ...f, stuck: e.target.value })} placeholder="12번 8분, 18번 6분" /></Field>
      <div className="rounded-lg px-3 py-2 text-xs flex flex-wrap gap-x-4 gap-y-1" style={{ background: "#f4efe1", color: "#4a4332" }}>
        <span>총 <b>{fmtMin(st.minutes)}</b></span>
        <span>정답률 <b>{st.accuracy == null ? "-" : `${st.accuracy}%`}</b></span>
        <span>문제당 <b>{fmtSec(st.secPerProblem)}</b></span>
        <span>★ <b>{st.stuckCount}</b>회 · {st.stuckMinutes}분</span>
      </div>
      <div className="flex items-center gap-2 flex-wrap">
        <button onClick={() => onSave(f)} className="px-4 py-2 rounded-lg text-sm font-semibold" style={dirty ? { background: "#2b2417", color: "#fff" } : { background: "#fffaf0", color: "#2b2417", border: "1px solid #2b2417" }}>저장</button>
        <span className="text-[11px] font-semibold" style={{ color: dirty ? "var(--coral)" : "#8a7f5e" }}>{dirty ? "● 저장하지 않은 내용이 있어요" : log ? "✓ 저장됨" : "기록지의 그날 줄을 옮겨 적고 저장하세요"}</span>
      </div>
    </div>
  );
}

// 이번 수업 기록을 보고 가장 필요한 처방을 골라줌 (근거 문장과 함께)
function suggestPrescriptions(st, goal, profileType) {
  const out = [];
  const add = (text, why) => { if (!out.find(o => o.text === text)) out.push({ text, why }); };
  const wrong = st.gradedProblems - st.correct;
  if (st.stuckCount >= 2 || st.stuckMinutes >= 10) add(isDeepLimit(goal?.stuckLimit) ? PRESC_LIBRARY[1].items[4] : PRESC_LIBRARY[1].items[0], `★ 막힌 문제 ${st.stuckCount}개 · ${st.stuckMinutes}분${st.gaveUp ? ` · 못 푼 문제 ${st.gaveUp}개` : ""}`);
  if (st.accuracy != null && st.accuracy < 75 && st.secPerProblem != null && st.secPerProblem <= 180) add(PRESC_LIBRARY[0].items[1], `빠른데 정답률 ${st.accuracy}%`);
  else if (st.accuracy != null && st.accuracy < 75) add(PRESC_LIBRARY[0].items[2], `정답률 ${st.accuracy}%`);
  if (st.accuracy != null && st.accuracy >= 80 && st.secPerProblem != null && st.secPerProblem >= 300) add(PRESC_LIBRARY[1].items[1], `정답률은 ${st.accuracy}%인데 문제당 ${fmtSec(st.secPerProblem)}`);
  if (st.stuckCount >= 3 && st.stuckMinutes >= 25) add(PRESC_LIBRARY[2].items[0], "같은 수업에서 오래 막힌 문제가 많아요");
  if (wrong > 0 && st.byKind["오답정리"] === 0) add(PRESC_LIBRARY[4].items[0], `틀린 문제 ${wrong}개, 오답정리 시간 0분`);
  const goalMin = Number(goal?.goalMinutes) || 0;
  if (goalMin > 0 && st.minutes > 0 && st.minutes < goalMin * 0.7) add(PRESC_LIBRARY[3].items[1], `목표 ${goalMin}분 중 ${st.minutes}분`);
  const goalAcc = Number(goal?.goalAccuracy) || 0;
  if (goalAcc > 0 && st.accuracy != null && st.accuracy < goalAcc) add(PRESC_LIBRARY[0].items[0], `목표 정확도 ${goalAcc}% 미달 (${st.accuracy}%)`);
  if (out.length < 2 && profileType) {
    const g = PRESC_LIBRARY.find(x => x.type === profileType);
    if (g) add(g.items[0], `학생 유형: ${g.group.replace(/.*\(|\)/g, "")}`);
  }
  return out.slice(0, 3);
}

function PrescriptionPicker({ st, goal, profileType, value, onPick }) {

        </div>

// 지난 기록으로 오늘의 목표 추천: 문제당 평균보다 10% 빠르게, 정확도는 지난보다 5%p(70% 미만이면 10%p) 높게
// ★ 문제 최대 고민 시간: "5"(기본) / "10"(심화). 잠깐 썼던 "3"/"8"도 같은 뜻으로 읽음
const isDeepLimit = (v) => String(v) === "8" || String(v) === "10";
function recommendGoal(problems, hist, stuckLimit) {
  const n = Number(problems) || 0;
  if (!n) return null;
  const hasHist = hist && hist.secPerProblem != null;
  const sec = hasHist ? hist.secPerProblem : (isDeepLimit(stuckLimit) ? 300 : 120);
  const minutes = Math.max(5, Math.ceil((n * sec * 0.9) / 60 / 5) * 5);
  const baseAcc = hist && hist.accuracy != null ? hist.accuracy : null;
  const accuracy = baseAcc == null ? 80 : Math.min(95, Math.round((baseAcc + (baseAcc < 70 ? 10 : 5)) / 5) * 5);
  return { minutes, accuracy, basis: hasHist ? `지난 기록: 문제당 ${fmtSec(hist.secPerProblem)}${baseAcc == null ? "" : ` · 정답률 ${baseAcc}%`}` : "지난 기록이 없어서 기본값(문제당 " + (sec / 60) + "분 · 정확도 80%)으로 잡았어요" };
}

  // 예전 하루 한 줄 형식(교재·분 칸)으로 저장된 기록도 줄 형식으로 바꿔서 불러옴
  const init = () => {
    const existing = effLogRows(log).map(r => ({ ...r, id: r.id || uid(), material: r.material || "", minutes: r.minutes ?? "", problems: r.problems ?? "", correct: r.correct ?? "", stuck: r.stuck || "" }));
    return { goalProblems: log?.goalProblems ?? "", goalMinutes: log?.goalMinutes ?? "", goalAccuracy: log?.goalAccuracy ?? "", stuckLimit: isDeepLimit(log?.stuckLimit) ? "10" : "5", prescription: log?.prescription ?? "", rows: existing.length ? existing : Array.from({ length: 6 }, blankRow) };
  };
  const [f, setF] = useState(init);
  const [base, setBase] = useState(() => JSON.stringify(f));
  useEffect(() => { const v = init(); setF(v); setBase(JSON.stringify(v)); }, [log?.id, log?.updatedAt]);
  const dirty = JSON.stringify(f) !== base;
  const setRow = (id, patch) => setF({ ...f, rows: f.rows.map(r => r.id === id ? { ...r, ...patch } : r) });
  const st = effStats(f.rows);
  const num = (v) => v.replace(/[^0-9]/g, "");

        <Field label="목표: 정확도 (%)"><input className={inputCls} style={cell} inputMode="numeric" value={f.goalAccuracy} onChange={e => setF({ ...f, goalAccuracy: num(e.target.value) })} /></Field>
      </div>
      <div className="flex items-center gap-2 flex-wrap">
        <button onClick={() => {
          const g = recommendGoal(f.goalProblems, history, f.stuckLimit);
          if (!g) { alert("목표 문제 수를 먼저 적어주세요."); return; }
          setF({ ...f, goalMinutes: String(g.minutes), goalAccuracy: String(g.accuracy) });

        {[["5", "5분 (기본)"], ["10", "10분 (심화)"]].map(([v, label]) => (
          <button key={v} onClick={() => setF({ ...f, stuckLimit: v })} className="px-2 py-0.5 rounded-md text-[11px] font-semibold" style={String(f.stuckLimit) === v ? { background: "#c65a1f", color: "#fff" } : { border: "1px solid #ddcda0", color: "#5c543e" }}>{label}</button>
        ))}
      </div>
      {(() => { const g = recommendGoal(f.goalProblems, history, f.stuckLimit); return g ? <p className="text-[11px] -mt-1" style={{ color: "#6b6250" }}>추천: {f.goalProblems}문제를 <b>{g.minutes}분</b> 안에 · 정확도 <b>{g.accuracy}%</b> ({g.basis})</p> : null; })()}

}

function EfficiencyTab({ data, setData, scopeClassGroups }) {
  const scopedStudents = studentsInScope(data.students, scopeClassGroups);
  const [studentId, setStudentId] = useState("");
  const [date, setDate] = useState(todayStr());
  const logs = data.effLogs || [];
  const log = logs.find(l => l.studentId === studentId && l.date === date);
  const weekKey = mondayOf(date);
  const weekEnd = addDaysToDateStr(weekKey, 6);
  const wkey = `${studentId}:${weekKey}`;
  const weekly = (data.effWeekly || {})[wkey] || {};
  const [presc, setPresc] = useState(weekly.prescription || "");
  useEffect(() => { setPresc(weekly.prescription || ""); }, [wkey, weekly.prescription]);
  const profile = (data.effProfiles || {})[studentId] || {};
  const typeMonth = date.slice(0, 7);
  const monthType = effTypeOf(data, studentId, typeMonth);
  const typeHistory = effTypeHistory(data, studentId).filter(h => h.month !== typeMonth);
  const weekStats = effStats(effRowsBetween(data, studentId, weekKey, weekEnd));
  const prevStats = effStats(effRowsBetween(data, studentId, addDaysToDateStr(weekKey, -7), addDaysToDateStr(weekKey, -1)));
  // 기록상 추천: 그 달 기록 전체 기준
  const hint = effTypeHint(effStats(effRowsBetween(data, studentId, `${typeMonth}-01`, monthEndStr(typeMonth))));
  const recent = effLogsOf(data, studentId).sort((a, b) => b.date.localeCompare(a.date)).slice(0, 14);
  // 목표 추천용: 이 날짜 전 최근 4번 수업 기록
  const histStats = effStats(effLogsOf(data, studentId).filter(l => l.date < date).sort((a, b) => b.date.localeCompare(a.date)).slice(0, 4).flatMap(l => effLogRows(l)));

  const saveLog = (f) => {
    // 예전 하루 한 줄 형식 칸은 버리고 줄(rows) 형식으로 저장
    const { material, conceptMin, solveMin, reviewMin, problems, correct, stuck, ...rest } = log || {};
    const item = { ...(log ? rest : { id: uid(), studentId, date }), ...f, updatedAt: new Date().toISOString() };
    const others = logs.filter(l => l.id !== item.id);
    const empty = f.rows.length === 0 && !String(f.prescription || "").trim() && !f.goalProblems && !f.goalMinutes && !f.goalAccuracy;
    const alerts = syncEffAlert(data, data.alerts || [], studentId, date, empty ? null : item);
    setData({ ...data, effLogs: empty ? others : [...others, item], alerts });
  };
  const weekLogs = effLogsOf(data, studentId).filter(l => l.date >= weekKey && l.date <= weekEnd).sort((a, b) => a.date.localeCompare(b.date));
  const [goal, setGoal] = useState({ problems: weekly.goalProblems || "", hours: weekly.goalHours || "", accuracy: weekly.goalAccuracy || "" });
  useEffect(() => { setGoal({ problems: weekly.goalProblems || "", hours: weekly.goalHours || "", accuracy: weekly.goalAccuracy || "" }); }, [wkey, weekly.goalProblems, weekly.goalHours, weekly.goalAccuracy]);
  const weeklyDirty = presc.trim() !== (weekly.prescription || "") || goal.problems !== (weekly.goalProblems || "") || goal.hours !== (weekly.goalHours || "") || goal.accuracy !== (weekly.goalAccuracy || "");
  const savePresc = () => setData({ ...data, effWeekly: { ...(data.effWeekly || {}), [wkey]: { ...weekly, prescription: presc.trim(), goalProblems: goal.problems, goalHours: goal.hours, goalAccuracy: goal.accuracy } } });
  const setType = (t) => setData({ ...data, effProfiles: { ...(data.effProfiles || {}), [studentId]: { ...profile, months: { ...(profile.months || {}), [typeMonth]: t } } } });
  const diff = (a, b, unit, lowerIsBetter) => {
    if (a == null || b == null) return null;
    const d = a - b; if (d === 0) return <span style={{ color: "#8a7f5e" }}> (지난주와 같음)</span>;
    const good = lowerIsBetter ? d < 0 : d > 0;
    return <span style={{ color: good ? "#3d9a50" : "var(--coral)" }}> ({d > 0 ? "▲" : "▼"}{unit === "sec" ? fmtSec(Math.abs(d)) : `${Math.abs(d)}${unit}`})</span>;
  };

  return (
    <div className="flex flex-col gap-4">
      <div className="rounded-2xl p-4 flex flex-col gap-3" style={panel}>
        <h3 className="font-bold" style={{ fontFamily: "'Noto Serif KR', serif" }}>학습 효율 기록 입력</h3>
        <div className="grid grid-cols-2 gap-3">
          <Field label="학생"><StudentSelect students={scopedStudents} value={studentId} onChange={setStudentId} /></Field>
          <Field label="날짜"><input type="date" className={inputCls} style={inputStyle} value={date} onChange={e => setDate(e.target.value)} /></Field>
        </div>
        {!studentId ? <EmptyState text="학생을 선택하면 기록지를 입력할 수 있어요." /> : (
          <EffRowsEditor key={`${studentId}:${date}`} log={log} onSave={saveLog} profileType={monthType} history={histStats} />

        <p className="text-[11px]" style={{ color: "#8a7f5e" }}>기록지의 그날 수업 칸(1회 또는 2회)을 한 줄씩 옮겨 적고, 즉시 처방도 같이 저장하세요. ★ 막힌 문제는 "보자마자 풀이가 안 떠오른 문제"이고, 적힌 분은 그 문제에 쓴 시간이에요. ✕는 못 풀고 넘어간 문제예요 (✕·×·x 모두 인식). "★ 문제 최대 고민"은 원장님 참고용이고 학생 기록지에는 나오지 않아요. 저장하면 그날 오늘의 루틴 학부모 알림에 학습 효율 내용이 합쳐져요 (루틴 기록이 없으면 따로 대기 알림이 생겨요). 문제당 평균 풀이시간은 "문제풀이 시간 ÷ 문제 수"예요 (맞은·틀린·막힌 문제 모두 포함).</p>
      </div>

      {studentId && (
        <div className="rounded-2xl p-4 flex flex-col gap-3" style={panel}>
          <h3 className="font-bold" style={{ fontFamily: "'Noto Serif KR', serif" }}>이번 주 ({shortMD(weekKey)}~{shortMD(weekEnd)})</h3>
          <div className="grid grid-cols-2 gap-2 text-sm">
            {[
              ["학습시간", fmtMin(weekStats.minutes), diff(weekStats.minutes, prevStats.minutes || null, "분")],
              ["문제 수", `${weekStats.problems}개`, diff(weekStats.problems, prevStats.problems || null, "개")],
              ["정답률", weekStats.accuracy == null ? "-" : `${weekStats.accuracy}%`, diff(weekStats.accuracy, prevStats.accuracy, "%p")],
              ["문제당 평균", fmtSec(weekStats.secPerProblem), diff(weekStats.secPerProblem, prevStats.secPerProblem, "sec", true)],
              ["★ 막힌 문제", `${weekStats.stuckCount}개 · ${weekStats.stuckMinutes}분${weekStats.gaveUp ? ` · ✕${weekStats.gaveUp}` : ""}`, diff(weekStats.stuckCount, prevStats.stuckCount || null, "개", true)],
            ].map(([k, v, d]) => (
              <div key={k} className="rounded-lg p-2.5" style={{ background: "#efe6d0" }}>
                <div className="text-[11px]" style={{ color: "#7a6f52" }}>{k}</div>
                <div className="font-bold" style={{ color: "#2b2417" }}>{v}<span className="text-[10px] font-semibold">{d}</span></div>
              </div>
            ))}
          </div>
          <div className="rounded-xl p-3 flex flex-col gap-1.5" style={{ border: "1.5px solid var(--gold)", background: "#fffaf0" }}>
            <div className="text-xs font-bold" style={{ color: "var(--gold)" }}>이번 주 즉시 처방</div>
            {weekLogs.filter(l => (l.prescription || "").trim()).length === 0 ? <span className="text-xs" style={{ color: "#8a7f5e" }}>아직 없어요. 위 수업 기록 아래에 적으면 여기에 모여요.</span> :
              weekLogs.filter(l => (l.prescription || "").trim()).map(l => <div key={l.id} className="text-xs" style={{ color: "#2b2417" }}><b>{shortMD(l.date)}</b> · {l.prescription}</div>)}
            <p className="text-[11px] mt-1" style={{ color: "#6b6250" }}>이번 주 합계 — 이번 주: {fmtMin(weekStats.minutes)} · {weekStats.problems}개 · {weekStats.accuracy == null ? "-" : `${weekStats.accuracy}%`} · {fmtSec(weekStats.secPerProblem)} · ★{weekStats.stuckCount}회 / 지난주: {fmtMin(prevStats.minutes)} · {prevStats.problems}개 · {prevStats.accuracy == null ? "-" : `${prevStats.accuracy}%`} · {fmtSec(prevStats.secPerProblem)} · ★{prevStats.stuckCount}회</p>
          </div>
          <Field label={`학생 유형 (${Number(typeMonth.slice(5))}월 · 한 달에 한 번 정해요)`}>
            <div className="grid grid-cols-2 gap-1.5">
              {EFF_TYPES.map(t => (
                <button key={t.id} onClick={() => setType(monthType === t.id ? "" : t.id)} className="text-left p-2 rounded-lg text-xs" style={monthType === t.id ? { background: "#173226", color: "#fff" } : { background: "#efe6d0", color: "#4a4332", border: hint === t.id ? "1.5px dashed var(--gold)" : "1.5px solid transparent" }}>
                  <b>{t.id}. {t.name}</b>{hint === t.id && monthType !== t.id && <span style={{ color: "var(--gold)" }}> · {Number(typeMonth.slice(5))}월 기록상 추천</span>}
                  <div className="text-[10px] mt-0.5" style={{ opacity: 0.8 }}>{t.desc}</div>
                </button>
              ))}
            </div>
          </Field>
          {typeHistory.length > 0 && (
            <p className="text-[11px] -mt-1" style={{ color: "#6b6250" }}>

                  <li key={l.id} onClick={() => setDate(l.date)} className="text-xs p-2 rounded-md flex flex-wrap gap-x-3" style={{ background: l.date === date ? "#fde3c8" : "#efe6d0", cursor: "pointer", color: "#4a4332" }}>
                    <b style={{ color: "#2b2417" }}>{shortMD(l.date)}</b><span>{fmtMin(s.minutes)}</span><span>{s.problems}문제</span><span>정답률 {s.accuracy == null ? "-" : `${s.accuracy}%`}</span><span>문제당 {fmtSec(s.secPerProblem)}</span><span>★{s.stuckCount}</span>

// 월간 리포트용 학습 효율 섹션
function EffReportSection({ data, studentId, month }) {
  const [y, m] = month.split("-").map(Number);
  const last = `${month}-${String(new Date(y, m, 0).getDate()).padStart(2, "0")}`;
  const monthRows = effRowsBetween(data, studentId, `${month}-01`, last);
  if (monthRows.length === 0) return null;
  const st = effStats(monthRows);
  const weeks = progressWeeksOfMonth(month).map((w, i, arr) => {
    const to = i < arr.length - 1 ? addDaysToDateStr(arr[i + 1].key, -1) : last;
    const sessPresc = effLogsOf(data, studentId).filter(l => l.date >= w.key && l.date <= to && (l.prescription || "").trim()).sort((a, b) => a.date.localeCompare(b.date)).map(l => l.prescription.trim());
    return { ...w, from: w.key, to, stats: effStats(effRowsBetween(data, studentId, w.key, to)), presc: sessPresc.length ? sessPresc.join(" / ") : (((data.effWeekly || {})[`${studentId}:${mondayOf(w.key)}`] || {}).prescription || "") };
  });
  const typeId = effTypeOf(data, studentId, month);
  const type = EFF_TYPES.find(t => t.id === typeId);
  const total = st.minutes || 1;
  const pts = weeks.filter(w => w.stats.secPerProblem != null);
  const first = pts[0]?.stats.secPerProblem, lastSec = pts[pts.length - 1]?.stats.secPerProblem;
  const W = 600, H = 150, pl = 30, pr = 16, pt = 22, pb = 22;
  const maxS = Math.max(...pts.map(w => w.stats.secPerProblem), 60), minS = Math.min(...pts.map(w => w.stats.secPerProblem), maxS);
  const span = Math.max(60, maxS - minS);
  const xOf = (i) => pts.length === 1 ? (pl + W - pr) / 2 : pl + i * ((W - pl - pr) / (pts.length - 1));
  const yOf = (s) => pt + (1 - (s - (minS - span * 0.15)) / (span * 1.3)) * (H - pt - pb);
  const th = { padding: "5px 6px", background: "#efe6d0", color: "#5c543e", fontWeight: 600, fontSize: 11, textAlign: "center" };

          <thead><tr>{["주", "학습시간", "문제", "정답률", "문제당", "★막힘", "선생님 처방"].map(h => <th key={h} style={th}>{h}</th>)}</tr></thead>
          <tbody>
            {weeks.map(w => (

        </table>
      </div>
      {pts.length > 0 && (

          <div className="flex items-center justify-between flex-wrap gap-2">

                <text x={xOf(i)} y={H - 6} fontSize="9" fill="#7a6f52" textAnchor="middle">{w.label}</text>
              </g>
            ))}
          </svg>
        </div>
      )}
    </div>
  );
}

// ===== 학습 효율 → 학부모 알림 (오늘의 루틴 알림에 합쳐서 한 번에) =====
const EFF_ALERT_MARK = "\n\n📘 학습 효율 기록";
function effAlertBlock(log) {
  if (!log) return "";
  const st = effStats(effLogRows(log));
  const presc = (log.prescription || "").trim();
  if (st.minutes === 0 && st.problems === 0 && !presc) return "";
  const lines = [];
  if (st.minutes > 0) {
    const parts = EFF_KINDS.filter(k => st.byKind[k] > 0).map(k => `${k} ${st.byKind[k]}분`);
    lines.push(`공부 ${fmtMin(st.minutes)}${parts.length ? ` (${parts.join(" · ")})` : ""}`);
  }
  if (st.problems > 0) lines.push(`${st.problems}문제${st.accuracy == null ? "" : ` · 정답률 ${st.accuracy}%`}${st.secPerProblem == null ? "" : ` · 문제당 ${fmtSec(st.secPerProblem)}`}`);
  if (st.stuckCount > 0) lines.push(`★ 막힌 문제 ${st.stuckCount}개${st.stuckMinutes ? ` (총 ${st.stuckMinutes}분)` : ""}${st.gaveUp ? ` · 못 푼 문제 ${st.gaveUp}개` : ""}`);
  if (presc) lines.push(`선생님 처방: ${presc}`);
  return `${EFF_ALERT_MARK}\n${lines.join("\n")}`;
}
const stripEffBlock = (msg) => (msg || "").split(EFF_ALERT_MARK)[0];
// 학습 효율 기록을 저장했을 때: 그날 오늘의 루틴 알림(대기)이 있으면 거기에 합치고, 없으면 학습 효율 알림을 따로 만듦
function syncEffAlert(data, alerts, studentId, date, log) {
  const block = effAlertBlock(log);
  const routine = (data.routines || []).find(r => r.studentId === studentId && r.date === date);
  const pendingRoutine = routine && alerts.find(a => a.sourceKey === `routine:${routine.id}` && a.status === "대기");
  const effKey = `eff:${studentId}:${date}`;
  if (pendingRoutine) {
    const merged = alerts.map(a => a.id === pendingRoutine.id ? { ...a, message: stripEffBlock(a.message) + block } : a);
    return merged.filter(a => !(a.sourceKey === effKey && a.status === "대기"));
  }
  const student = data.students.find(s => s.id === studentId);
  return syncAlerts(alerts, effKey, !!block, () => ({
    studentId, kind: "학습 효율",
    message: `[루틴수학] ${student?.name || ""} 학생 ${shortMD(date)} 학습 기록${block.replace(EFF_ALERT_MARK, "")}`,
  }));
}

function buildMonthlyReportText(student, monthStr, itemAverages, overall, testAvg, avgPracticeCount, avgAccuracy, studyMinutes, hwRate) {
  const lines = [];
  lines.push("🗓️ 월간 ROUTINE 리포트");
  lines.push(`${student?.name || ""} / ${student?.grade || ""}`);
  lines.push(`${monthStr}`);
  lines.push("");
  lines.push(`이번 달 실제 달성률 ${overall === null ? "-" : `${overall}%`}`);
  lines.push(`이번 달 총 순공시간 ${formatMinutes(studyMinutes)}`);
  if (hwRate !== null) lines.push(`숙제 기한 내 제출률 ${hwRate}%`);
  lines.push("");
  itemAverages.forEach(it => {
    lines.push(`${it.label} ${it.avg === null ? "기록없음" : `${it.avg}%`}`);
  });
  if (avgPracticeCount !== null) lines.push(`하루 평균 문제풀이 ${avgPracticeCount}문제`);
  if (avgAccuracy !== null) lines.push(`평균 정답률 ${avgAccuracy}%`);
  if (testAvg !== null) lines.push(`테스트 평균 ${testAvg}점`);
  return lines.join("\n");
}

// 도장판 스타일: 30칸을 채우면 완성되는 형태 (size: "normal" | "small")
function StampGrid({ filled, total = 30, size = "normal", icon = "✓" }) {
  const dim = size === "small" ? 16 : 26;
  const gap = size === "small" ? 3 : 5;
  return (
    <div className="grid" style={{ gridTemplateColumns: `repeat(6, ${dim}px)`, gap }}>
      {Array.from({ length: total }, (_, i) => i + 1).map(n => {
        const isFilled = n <= filled;
        return (
          <div key={n} className="rounded-full flex items-center justify-center flex-shrink-0" style={{
            width: dim, height: dim,
            border: isFilled ? "2px solid #b3261e" : "1.5px dashed #ddcda0",
            background: isFilled ? "rgba(179,38,30,0.08)" : "transparent",
          }}>
            {isFilled && (icon === "🔥" ? <span style={{ fontSize: size === "small" ? 10 : 15 }}>🔥</span> : <span style={{ color: "#b3261e", fontSize: size === "small" ? 8 : 13, fontWeight: 700 }}>✓</span>)}
          </div>
        );
      })}
    </div>
  );
}

function studyBadgeProgress(data, studentId) {
  const totalDays = new Set(data.plannerBlocks.filter(b => b.studentId === studentId && b.done).map(b => b.date)).size;

function studyStreak(data, studentId) {
  const dateSet = new Set(data.plannerBlocks.filter(b => b.studentId === studentId && b.done).map(b => b.date));
  if (dateSet.size === 0) return 0;
  let streak = 0;
  let cursor = dateSet.has(todayStr()) ? todayStr() : addDaysToDateStr(todayStr(), -1); // 오늘 기록이 아직 없어도 스트릭이 바로 끊기지 않게 어제부터 확인
  while (dateSet.has(cursor)) {
    streak++;
    cursor = addDaysToDateStr(cursor, -1);
  }
  return streak;
}

function reviewStruggleStreak(data, studentId) {
  const records = data.routines
    .filter(r => r.studentId === studentId)
    .map(r => ({ date: r.date, review: (r.items || []).find(it => it.key === "review")?.result }))
    .filter(r => r.review === "P" || r.review === "C")
    .sort((a, b) => b.date.localeCompare(a.date)); // 최신순
  let streak = 0;
  for (const r of records) {
    if (r.review === "P") streak++;
    else break; // 완료(C)를 만나면 멈춤
  }
  return streak;
}

function weeklyRoutineStats(data, studentId, weekStart) {
  const weekRoutines = data.routines.filter(r => r.studentId === studentId && mondayOf(r.date) === weekStart);
  const perItem = {};
  ROUTINE_ITEM_DEFS.forEach(def => { perItem[def.key] = []; });
  const practiceCounts = [];
  const accuracies = [];
  const reviewBreakdown = { P: 0, C: 0 };
  const classBreakdown = { N: 0, R: 0 };
  weekRoutines.forEach(r => {
    const items = r.items || [];
    const practiceItem = items.find(it => it.key === "practice");
    const wrongItem = items.find(it => it.key === "wrong");
    const pc = Number(practiceItem?.result) || 0;
    const wc = Number(wrongItem?.result) || 0;
    if (pc > 0) {
      practiceCounts.push(pc);
      accuracies.push(Math.max(0, Math.min(100, Math.round(((pc - wc) / pc) * 100))));
    }
    const classItem = items.find(it => it.key === "class");
    if (classItem?.result === "N") classBreakdown.N++;
    else if (classItem?.result === "R") classBreakdown.R++;
    const reviewItem = items.find(it => it.key === "review");
    if (reviewItem?.result === "P") reviewBreakdown.P++;
    else if (reviewItem?.result === "C") reviewBreakdown.C++;

    items.forEach(it => {
      if (it.key === "wrong" || it.key === "practice" || it.key === "class" || it.key === "review") return; // 따로 집계
      if (it.key === "homework") {
        if (!it.result) return; // 아직 선택 안 한 날은 집계에서 제외
        const hwRate = it.result === "완료" ? 100 : (it.result === "기한초과" ? 50 : 0);
        perItem.homework.push(hwRate);
        return;
      }
      const rate = (it.kind === "boolean" || it.kind === "choice") ? (it.result ? 100 : 0) : 0;
      if (rate !== null && perItem[it.key]) perItem[it.key].push(rate);
    });
  });
  const itemAverages = ROUTINE_ITEM_DEFS.filter(def => def.key !== "wrong" && def.key !== "practice" && def.key !== "class" && def.key !== "review").map(def => {
    const arr = perItem[def.key];
    return { ...def, avg: arr.length ? Math.round(arr.reduce((a, b) => a + b, 0) / arr.length) : null };
  });
  const avgPracticeCount = practiceCounts.length ? Math.round(practiceCounts.reduce((a, b) => a + b, 0) / practiceCounts.length) : null;
  const avgAccuracy = accuracies.length ? Math.round(accuracies.reduce((a, b) => a + b, 0) / accuracies.length) : null;
  const validAverages = itemAverages.filter(x => x.avg !== null).map(x => x.avg);
  const overall = validAverages.length ? Math.round(validAverages.reduce((a, b) => a + b, 0) / validAverages.length) : null;
  const testScores = weekRoutines.filter(r => r.testScore != null).map(r => r.testScore);
  const testAvg = testScores.length ? Math.round(testScores.reduce((a, b) => a + b, 0) / testScores.length) : null;
  return { weekRoutines, itemAverages, overall, testAvg, avgPracticeCount, avgAccuracy, reviewBreakdown, classBreakdown };
}

function MessagesTab({ data, setData, scopeClassGroups }) {
  const [studentId, setStudentId] = useState("");

  const students = studentsInScope(data.students, scopeClassGroups);
  const scopedIds = new Set(students.map(s => s.id));
  const studentName = (id) => data.students.find(s => s.id === id)?.name || "-";
  const formatTime = (iso) => new Date(iso).toLocaleString("ko-KR", { month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit" });

  const byStudent = {};
  (data.messages || []).filter(m => scopedIds.has(m.studentId)).forEach(m => {
    (byStudent[m.studentId] = byStudent[m.studentId] || []).push(m);
  });
  const threadList = Object.keys(byStudent).map(sid => {
    const msgs = byStudent[sid].sort((a, b) => a.createdAt.localeCompare(b.createdAt));
    const last = msgs[msgs.length - 1];
    return { studentId: sid, last, needsReply: last.sender === "student" };
  }).sort((a, b) => b.last.createdAt.localeCompare(a.last.createdAt));

  const thread = studentId ? (data.messages || []).filter(m => m.studentId === studentId).sort((a, b) => a.createdAt.localeCompare(b.createdAt)) : [];

  const send = () => {
    if (!studentId || !text.trim()) return;
    const msg = { id: uid(), studentId, sender: "staff", text: text.trim(), createdAt: new Date().toISOString() };
    setData({ ...data, messages: [...(data.messages || []), msg] });

  return (
    <div className="flex flex-col gap-4">

                  <b>{studentName(t.studentId)}</b>
                  <div className="text-xs" style={{ color: "#7a6f52" }}>{t.last.text.length > 30 ? t.last.text.slice(0, 30) + "…" : t.last.text}</div>
                </div>
                {t.needsReply && <span className="text-[10px] font-bold px-2 py-0.5 rounded-full flex-shrink-0" style={{ background: "var(--coral)", color: "#fff" }}>답장 필요</span>}

              <div key={m.id} className={"max-w-[80%] p-2.5 rounded-xl text-sm " + (m.sender === "staff" ? "self-end" : "self-start")}

function isYoutubeUrl(u) {
  try {
    const h = new URL(u.trim()).hostname.replace(/^www\.|^m\./, "");
    return h === "youtube.com" || h === "youtu.be" || h === "youtube-nocookie.com";
  } catch (e) { return false; }
}

// ================= 자습실 시간표 (공용 로직) =================
function cellStatus(tt, day, period) {
  return tt?.cells?.[`${day}-${period}`] || "-";
}
function upsertTimetableCell(data, setData, studentId, weekStart, day, period, nextStatus, reason) {
  const existing = data.timetables.find(t => t.studentId === studentId && t.weekStart === weekStart);
  const key = `${day}-${period}`;
  if (existing) {
    const cells = { ...existing.cells, [key]: nextStatus };
    const reasons = { ...existing.reasons };
    if (nextStatus === "X" && reason) reasons[key] = reason; else delete reasons[key];
    setData({ ...data, timetables: data.timetables.map(t => t.id === existing.id ? { ...t, cells, reasons } : t) });
  } else {
    const cells = { [key]: nextStatus };
    const reasons = nextStatus === "X" && reason ? { [key]: reason } : {};
    setData({ ...data, timetables: [...data.timetables, { id: uid(), studentId, weekStart, cells, reasons }] });
  }
}
function occupancyToday(data, weekStart, day) {
  const counts = {};
  PERIODS.forEach(p => { counts[p] = 0; });
  if (!day) return counts;
  data.timetables.filter(t => t.weekStart === weekStart).forEach(t => {
    PERIODS.forEach(p => { if (cellStatus(t, day, p) === "O") counts[p]++; });
  });
  return counts;
}

// 학생: 자습실 시간표 등록 (편집 가능)
function StudentTimetable({ data, setData, studentId }) {
  const weekStart = mondayOf(todayStr());
  const my = data.timetables.find(t => t.studentId === studentId && t.weekStart === weekStart);
  const today = todayDayLabel();

  const tap = (day, period) => {
    const cur = cellStatus(my, day, period);
    if (cur === "-") { upsertTimetableCell(data, setData, studentId, weekStart, day, period, "O"); return; }
    if (cur === "O") {
      const reason = window.prompt("결석 사유(선택)", "") || "";
      upsertTimetableCell(data, setData, studentId, weekStart, day, period, "X", reason);
      return;
    }
    upsertTimetableCell(data, setData, studentId, weekStart, day, period, "-");
  };

  return (
    <div className="flex flex-col gap-3">
      <p className="text-xs" style={{ color: "#7a6f52" }}>칸을 누르면 이용(○) → 결석(X) → 해당없음(–) 순서로 바뀝니다.</p>
      <TimetableGrid data={data} studentId={studentId} weekStart={weekStart} today={today} onTap={tap} />
    </div>
  );
}

function dateForDayInWeek(weekStart, day) {
  const idx = DAYS.indexOf(day);
  if (idx < 0) return weekStart;
  const d = new Date(weekStart + "T00:00:00");
  d.setDate(d.getDate() + idx);
  return localDateStr(d);
}

function minutesBetween(start, end) {
  if (!start || !end) return 0;
  const [sh, sm] = start.split(":").map(Number);
  const [eh, em] = end.split(":").map(Number);
  let diff = (eh * 60 + em) - (sh * 60 + sm);
  if (diff < 0) diff += 24 * 60;
  return diff;
}
function formatMinutes(mins) {
  const h = Math.floor(mins / 60), m = mins % 60;
  if (h === 0) return `${m}분`;
  return m === 0 ? `${h}시간` : `${h}시간 ${m}분`;
}

  const dayStats = blockDates.map(d => {
    const blocks = data.plannerBlocks.filter(b => b.studentId === studentId && b.date === d);
    const rate = blocks.length ? Math.round((blocks.filter(b => b.done).length / blocks.length) * 100) : 0;
    const doneBlocks = blocks.filter(b => b.done);
    const pureMinutes = doneBlocks.reduce((s, b) => s + minutesBetween(b.start, b.end), 0);
    const subjectMinutesMap = {};
    doneBlocks.forEach(b => {
      if (!b.subject) return;
      subjectMinutesMap[b.subject] = (subjectMinutesMap[b.subject] || 0) + minutesBetween(b.start, b.end);
    });
    const subjectMinutes = Object.entries(subjectMinutesMap).map(([subject, minutes]) => ({ subject, minutes })).sort((a, b) => b.minutes - a.minutes);
    return { date: d, done: blocks.filter(b => b.done).length, total: blocks.length, rate, pureMinutes, subjectMinutes };
  });
  const avgMinutes = dayStats.length ? Math.round(dayStats.reduce((s, d) => s + d.pureMinutes, 0) / dayStats.length) : null;
  const weekOverall = weeklyPlannerTaskRate(data, studentId, mondayOf(todayStr()));
  const thisWeekStart = mondayOf(todayStr());
  const weekPureMinutes = data.plannerBlocks.filter(b => b.studentId === studentId && b.done && mondayOf(b.date) === thisWeekStart).reduce((s, b) => s + minutesBetween(b.start, b.end), 0);
  const recentTests = tests.slice(-8);
  const avgScore = recentTests.length ? Math.round(recentTests.reduce((s, t) => s + t.score, 0) / recentTests.length) : null;
  const recentRoutines = data.routines.filter(r => r.studentId === studentId).sort((a, b) => b.date.localeCompare(a.date)).slice(0, 7);
  const [routineViewDate, setRoutineViewDate] = useState(recentRoutines[0]?.date || todayStr());

  const currentMonth = todayStr().slice(0, 7);
  const monthlyTests = tests.filter(t => t.date && t.date.slice(0, 7) === currentMonth);
  const byType = {};
  const typeStats = {};
  TEST_TYPES.forEach(tp => {
    const all = monthlyTests.filter(t => (t.testType || "주간테스트") === tp);
    byType[tp] = all.slice(-5).reverse();
    typeStats[tp] = { count: all.length, avg: all.length ? Math.round(all.reduce((s, t) => s + t.score, 0) / all.length) : null };
  });

  const addComment = (text) => setData({ ...data, teacherComments: [...data.teacherComments, { id: uid(), studentId, date: todayStr(), text }] });
  const removeComment = (id) => setData({ ...data, teacherComments: data.teacherComments.filter(c => c.id !== id) });
  const addNote = (text) => setData({ ...data, counselingNotes: [...data.counselingNotes, { id: uid(), studentId, date: todayStr(), text }] });
  const removeNote = (id) => setData({ ...data, counselingNotes: data.counselingNotes.filter(c => c.id !== id) });
  const updateTestField = (testId, field, value) => setData({ ...data, tests: data.tests.map(t => t.id === testId ? { ...t, [field]: value } : t) });
  const recordRetestResult = (t, retestScoreStr) => {
    const retestScore = Number(retestScoreStr);
    if (isNaN(retestScore)) return;
    const didPass = retestScore >= t.passLine;
    const historyLine = `재시험 ${todayStr()}: ${retestScore}점 (${didPass ? "통과" : "재재시험 필요"})`;
    setData({
      ...data,
      tests: data.tests.map(x => x.id === t.id ? {
        ...x,
        score: retestScore,
        passed: didPass,
        retest: !didPass,
        retestDate: "",
        retestCount: (x.retestCount || 0) + 1,
        note: [x.note, historyLine].filter(Boolean).join("\n"),
      } : x),
    });
  };
  const plannerCheck = (data.plannerChecks || []).find(c => c.studentId === studentId && c.date === plannerViewDate);
  const togglePlannerCheck = () => {
    const checks = data.plannerChecks || [];
    const existing = checks.find(c => c.studentId === studentId && c.date === plannerViewDate);
    if (existing) setData({ ...data, plannerChecks: checks.filter(c => c.id !== existing.id) });
    else setData({ ...data, plannerChecks: [...checks, { id: uid(), studentId, date: plannerViewDate, checked: true }] });
  };

  return (
    <div className="flex flex-col gap-4">
      <div className="rounded-2xl p-4" style={panel}>
        <h3 className="font-bold mb-1" style={{ fontFamily: "'Noto Serif KR', serif" }}>학부모 리포트 요약</h3>
        <p className="text-xs mb-3" style={{ color: "#7a6f52" }}>{student?.name} 학생 · {student?.grade}{student?.classGroup ? ` · ${student.classGroup}` : ""}</p>
        <div className="flex gap-3 flex-wrap">
          <StatCard label="최근 숙제 제출률" value={submittedRate === null ? "-" : `${submittedRate}%`} tone={submittedRate !== null && submittedRate < PASS_RATE ? "var(--coral)" : "var(--gold)"} />
          <StatCard label="최근 평균 순공시간" value={avgMinutes === null ? "-" : formatMinutes(avgMinutes)} />
          <StatCard label="최근 테스트 평균" value={avgScore === null ? "-" : `${avgScore}점`} />
          <StatCard label="이번 주 누적 순공시간" value={formatMinutes(weekPureMinutes)} />
        </div>
      </div>

      <div className="rounded-2xl p-4" style={panel}>
        <h3 className="font-bold mb-3 flex items-center gap-2" style={{ fontFamily: "'Noto Serif KR', serif" }}>① 숙제 관리</h3>
        {recentHomeworks.length === 0 ? <EmptyState text="기록이 없습니다." /> : (
          <ul className="flex flex-col gap-2">
            {recentHomeworks.map(h => (
              <li key={h.id} className="flex flex-col gap-1.5 p-2.5 rounded-lg" style={{ background: "#efe6d0" }}>
                <div className="flex items-center justify-between">
                  <div className="text-sm" style={{ color: "#4a4332" }}>
                    <div>{h.date} · {h.title}</div>
                    {h.submitted && h.submittedAt && <div className="text-xs" style={{ color: "#7a6f52" }}>{new Date(h.submittedAt).toLocaleString("ko-KR", { month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit" })} 제출</div>}
                    {!h.submitted && h.dueDate && <div className="text-xs" style={{ color: h.dueDate < todayStr() ? "var(--coral)" : "#7a6f52" }}>{h.dueDate < todayStr() ? "기한 초과" : `기한 ${h.dueDate}`}</div>}
                  </div>
                  <div className="flex items-center gap-2 flex-shrink-0">
                    <span className="text-xs font-semibold px-2 py-0.5 rounded-full" style={{ background: h.submitted ? (h.submittedLate ? "var(--coral)" : "#4c8c5f") : "var(--coral)", color: "#fff" }}>{h.submitted ? "제출" : "미제출"}</span>
                    {h.submitted && canEdit && (
                      <button onClick={() => setData({ ...data, homeworks: data.homeworks.map(x => x.id === h.id ? { ...x, reviewedByStaff: !x.reviewedByStaff } : x) })} className="text-[10px] font-semibold px-1.5 py-0.5 rounded-full" style={{ background: h.reviewedByStaff ? "#4c8c5f" : "#e4d8ba", color: h.reviewedByStaff ? "#fff" : "#5c543e" }}>{h.reviewedByStaff ? "확인함" : "확인 안 함"}</button>
                    )}
                  </div>
                </div>
                {(() => {
                  const photoList = h.photos || (h.photo ? [h.photo] : []);
                  if (photoList.length === 0) return null;
                  return (
                    <div className="flex items-center gap-2 flex-wrap">
                      <span className="text-[10px] font-semibold px-1.5 py-0.5 rounded-full flex-shrink-0" style={{ background: "#e4d8ba", color: "#5c543e" }}>질문 {photoList.length}개</span>
                      {photoList.map((src, i) => (
                        <img key={i} src={src} onClick={() => setLightboxSrc(src)} alt="질문 사진" className="rounded-md cursor-pointer flex-shrink-0" style={{ height: 48, width: 48, objectFit: "cover", border: "1px solid #ddcda0" }} />
                      ))}
                    </div>
                  );
                })()}
              </li>
            ))}
          </ul>
        )}
      </div>

      <div className="rounded-2xl p-4" style={panel}>
        <h3 className="font-bold mb-1" style={{ fontFamily: "'Noto Serif KR', serif" }}>② 일일 학습량 (플래너 타임테이블)</h3>
        <div className="text-sm font-bold mb-2" style={{ color: weekOverall !== null && weekOverall < PASS_RATE ? "var(--coral)" : "var(--gold)" }}>이번 주 실제 달성률 {weekOverall === null ? "-" : `${weekOverall}%`}</div>
        {dayStats.length === 0 ? <EmptyState text="기록이 없습니다." /> : (
          <ul className="flex flex-col gap-2">
            {dayStats.map(d => (
              <li key={d.date} className="flex items-center justify-between p-2.5 rounded-lg flex-wrap gap-y-1" style={{ background: "#efe6d0" }}>
                <span className="text-xs" style={{ color: "#7a6f52" }}>{d.date}</span>
                <div className="flex items-center gap-1.5 flex-wrap justify-end">
                  <span className="text-sm font-semibold" style={{ color: "var(--gold)" }}>{formatMinutes(d.pureMinutes)}</span>
                  {d.subjectMinutes.map(sm => (
                    <span key={sm.subject} className="text-[10px] font-semibold px-1.5 py-0.5 rounded-full text-white" style={{ background: colorForSubject(sm.subject, studentSubjectList(data, studentId)) }}>{sm.subject} {formatMinutes(sm.minutes)}</span>
                  ))}
                </div>
              </li>
            ))}
          </ul>
        )}
      </div>

      <div className="rounded-2xl p-4 flex flex-col gap-3" style={panel}>
        <div className="flex items-center justify-between">
          <h3 className="font-bold" style={{ fontFamily: "'Noto Serif KR', serif" }}>플래너 자세히 보기</h3>
          <div className="flex items-center gap-2">
            <input type="date" className="rounded-lg px-2 py-1.5 text-xs" style={inputStyle} value={plannerViewDate} onChange={e => setPlannerViewDate(e.target.value)} />
            {canEdit ? (
              <button onClick={togglePlannerCheck} className="flex items-center gap-1 text-[10px] px-2 py-1.5 rounded-full font-semibold flex-shrink-0" style={{ background: plannerCheck ? "#4c8c5f" : "#e4d8ba", color: plannerCheck ? "#fff" : "#5c543e" }}>
                {plannerCheck && <Check size={10} />}{plannerCheck ? "확인함" : "확인"}
              </button>
            ) : (
              plannerCheck && (
                <span className="flex items-center gap-1 text-[10px] px-2 py-1.5 rounded-full font-semibold flex-shrink-0" style={{ background: "#4c8c5f", color: "#fff" }}>
                  <Check size={10} />선생님 확인함
                </span>
              )
            )}
          </div>
        </div>
        <PlannerTaskList data={data} setData={setData} studentId={studentId} date={plannerViewDate} readOnly adminDelete={canEdit} />
        <DayTimeline blocks={data.plannerBlocks.filter(b => b.studentId === studentId && b.date === plannerViewDate)} subjectList={studentSubjectList(data, studentId)} />
      </div>

      <div className="rounded-2xl p-4 flex flex-col gap-3" style={panel}>
        <div className="flex items-center justify-between">
          <h3 className="font-bold" style={{ fontFamily: "'Noto Serif KR', serif" }}>오늘의 루틴</h3>
          <input type="date" className="rounded-lg px-2 py-1.5 text-xs" style={inputStyle} value={routineViewDate} onChange={e => setRoutineViewDate(e.target.value)} />
        </div>
        <div className="pt-1">
          <h4 className="text-sm font-semibold mb-2" style={{ color: "#2b2417" }}>{routineViewDate} 기록</h4>
          {(() => {
            const dayRoutine = data.routines.find(r => r.studentId === studentId && r.date === routineViewDate);
            if (!dayRoutine) return <EmptyState text="이 날짜에 기록된 오늘의 루틴이 없습니다." />;
            const classItem = (dayRoutine.items || []).find(it => it.key === "class");
            const reviewItem = (dayRoutine.items || []).find(it => it.key === "review");
            const dp = (dayRoutine.items || []).find(it => it.key === "practice");
            const dw = (dayRoutine.items || []).find(it => it.key === "wrong");
            const dpc = Number(dp?.result) || 0, dwc = Number(dw?.result) || 0;
            const dacc = dpc > 0 ? Math.round(((dpc - dwc) / dpc) * 100) : null;
            const hwItem = (dayRoutine.items || []).find(it => it.key === "homework");
            return (
              <div className="flex flex-col gap-1.5">
                {classItem && (
                  <div className="text-sm" style={{ color: "#4a4332" }}>
                    <b style={{ color: "#2b2417" }}>{classItem.label}</b> · {classItem.result || "-"}{classItem.note && <span style={{ color: "#7a6f52" }}> — {classItem.note}</span>}
                  </div>
                )}
                {reviewItem && (
                  <div className="text-sm" style={{ color: "#4a4332" }}>
                    <b style={{ color: "#2b2417" }}>{reviewItem.label}</b> · {reviewItem.result || "-"}{reviewItem.note && <span style={{ color: "#7a6f52" }}> — {reviewItem.note}</span>}
                  </div>
                )}
                {dpc > 0 && <div className="text-sm" style={{ color: "#4a4332" }}><b style={{ color: "#2b2417" }}>문제풀이</b> · {dpc}문제 · 오답 {dwc} · 정답률 {dacc}%</div>}
                {hwItem && (
                  <div className="text-sm" style={{ color: "#4a4332" }}>
                    <b style={{ color: "#2b2417" }}>숙제</b>
                    {hwItem.note ? (
                      <div className="text-xs mt-0.5" style={{ color: "#7a6f52", whiteSpace: "pre-line" }}>{hwItem.note}</div>
                    ) : (
                      <span style={{ color: "#7a6f52" }}> · 해당없음</span>
                    )}
                  </div>
                )}
                {dayRoutine.testName && (() => {
                  const linkedTest = data.tests.find(t => t.id === `routine-${dayRoutine.id}`);
                  return (
                    <div className="text-sm flex items-center gap-2 flex-wrap" style={{ color: "#4a4332" }}>
                      <span><b style={{ color: "#2b2417" }}>{dayRoutine.testName}</b> · {dayRoutine.testScore}점</span>
                      {linkedTest && (
                        <>
                          <span className="px-2 py-0.5 rounded-full text-[11px] font-semibold" style={{ background: linkedTest.passed ? "#4c8c5f" : "var(--coral)", color: "#fff" }}>{linkedTest.passed ? "통과" : "미통과"}</span>
                          <span className="px-2 py-0.5 rounded-full text-[11px] font-semibold" style={{ background: linkedTest.retest ? "var(--coral)" : "#e4d8ba", color: linkedTest.retest ? "#fff" : "#5c543e" }}>{linkedTest.retest ? "재시험 필요" : "재시험 없음"}</span>
                        </>
                      )}
                    </div>
                  );
                })()}
                {dayRoutine.comment && <div className="text-sm mt-1" style={{ color: "#4a4332" }}><b style={{ color: "#2b2417" }}>코멘트</b> · {dayRoutine.comment}</div>}
              </div>
            );
          })()}
        </div>
        <div className="pt-2 mt-1" style={{ borderTop: "1px solid #e4d8ba" }}>
          <WeeklyRoutineBlock data={data} setData={setData} studentId={studentId} weekStart={mondayOf(todayStr())} showAlertButton={canEdit} bare hideTitle />
        </div>
        <div className="pt-2 mt-1 flex flex-col gap-2" style={{ borderTop: "1px solid #e4d8ba" }}>
          <input type="month" className="rounded-lg px-2 py-1.5 text-xs self-end" style={inputStyle} value={reportMonth} onChange={e => setReportMonth(e.target.value)} />
          <MonthlyRoutineBlock data={data} setData={setData} studentId={studentId} month={reportMonth} showAlertButton={canEdit} />
        </div>
      </div>

      <div className="rounded-2xl p-4" style={panel}>
        <h3 className="font-bold mb-3" style={{ fontFamily: "'Noto Serif KR', serif" }}>출결 기록</h3>
        {attendanceEntries.length === 0 ? <EmptyState text="기록이 없습니다." /> : (
          <ul className="flex flex-col gap-2">
            {attendanceEntries.map(a => (
              <li key={a.id} className="flex items-center justify-between p-2.5 rounded-lg" style={{ background: "#efe6d0" }}>
                <span className="text-xs" style={{ color: "#7a6f52" }}>{a.date}{a.time ? ` · ${a.time}` : ""}{a.source === "student" ? " · 학생 직접 체크인" : ""}</span>
                <span className="text-xs font-semibold px-2 py-0.5 rounded-full" style={{ background: a.status === "결석" ? "var(--coral)" : a.status === "지각" ? "var(--gold)" : "#4c8c5f", color: "#fff" }}>{a.status}</span>
              </li>
            ))}
          </ul>
        )}
      </div>

      <div className="rounded-2xl p-4" style={panel}>
        <h3 className="font-bold mb-3" style={{ fontFamily: "'Noto Serif KR', serif" }}>③ 테스트 기록 (이번 달)</h3>
        <div className="grid grid-cols-2 gap-2 mb-3">
          {TEST_TYPES.map(tp => (
            <div key={tp} className="rounded-lg p-2" style={{ background: "#efe6d0" }}>
              <div className="text-[11px]" style={{ color: "#7a6f52" }}>{tp} ({typeStats[tp].count}회)</div>
              <div className="text-sm font-bold" style={{ color: typeStats[tp].avg !== null && typeStats[tp].avg < PASS_RATE ? "var(--coral)" : "var(--gold)" }}>{typeStats[tp].avg === null ? "-" : `평균 ${typeStats[tp].avg}점`}</div>
            </div>
          ))}
        </div>
        {tests.length === 0 ? <EmptyState text="기록이 없습니다." /> : (
          <div className="flex flex-col gap-3">
            {TEST_TYPES.map(tp => (
              <div key={tp}>
                <div className="text-xs mb-1" style={{ color: "#7a6f52" }}>{tp}</div>
                {byType[tp].length === 0 ? (
                  <p className="text-xs" style={{ color: "#8a7f5e" }}>기록 없음</p>
                ) : (
                  <ul className="flex flex-col gap-1.5">
                    {byType[tp].map(t => {
                      const low = t.score < t.passLine;
                      const passed = t.passed !== undefined ? t.passed : !low;
                      return (
                        <li key={t.id} className="p-2 rounded-lg flex flex-col gap-1.5" style={{ background: "#efe6d0" }}>
                          <div className="flex items-center justify-between">
                            <span className="text-sm" style={{ color: "#4a4332" }}>{t.date} · {t.name}</span>
                            <span className="text-sm font-bold" style={{ color: low ? "var(--coral)" : "var(--gold)" }}>{t.score}점</span>
                          </div>
                          <div className="flex items-center gap-2 flex-wrap">
                            {canEdit ? (
                              <>
                                <button onClick={() => updateTestField(t.id, "passed", !passed)} className="px-2 py-0.5 rounded-full text-[11px] font-semibold" style={{ background: passed ? "#4c8c5f" : "var(--coral)", color: "#fff" }}>{passed ? "통과" : "미통과"}</button>
                                <button onClick={() => updateTestField(t.id, "retest", !t.retest)} className="px-2 py-0.5 rounded-full text-[11px] font-semibold" style={{ background: t.retest ? "var(--coral)" : "#e4d8ba", color: t.retest ? "#fff" : "#5c543e" }}>{t.retest ? "재시험 필요" : "재시험 없음"}</button>
                                {t.retest && (
                                  <>
                                    <input type="date" className="rounded-lg px-2 py-0.5 text-[11px]" style={inputStyle} value={t.retestDate || ""} onChange={e => updateTestField(t.id, "retestDate", e.target.value)} />
                                    <RetestResultInput onSubmit={(score) => recordRetestResult(t, score)} />
                                    {t.retestCount > 0 && <span className="text-[10px] px-1.5 py-0.5 rounded-full" style={{ background: "#e4d8ba", color: "#5c543e" }}>재시험 {t.retestCount}회째</span>}
                                  </>
                                )}
                              </>
                            ) : (
                              <>
                                <span className="px-2 py-0.5 rounded-full text-[11px] font-semibold" style={{ background: passed ? "#4c8c5f" : "var(--coral)", color: "#fff" }}>{passed ? "통과" : "미통과"}</span>
                                {t.retest && <span className="px-2 py-0.5 rounded-full text-[11px] font-semibold" style={{ background: "var(--coral)", color: "#fff" }}>재시험 필요{t.retestDate ? ` (${t.retestDate})` : ""}</span>}
                              </>
                            )}
                          </div>
                          {canEdit ? (
                            <input className={inputCls} style={{ ...inputStyle, padding: "6px 10px" }} placeholder="강사 메모 (선택)" value={t.note || ""} onChange={e => updateTestField(t.id, "note", e.target.value)} />
                          ) : (t.note && <p className="text-xs" style={{ color: "#7a6f52" }}>{t.note}</p>)}
                        </li>
                      );
                    })}
                  </ul>
                )}
              </div>
            ))}
          </div>
        )}
      </div>

      <div className="rounded-2xl p-4" style={panel}>
        <h3 className="font-bold mb-3 flex items-center gap-2" style={{ fontFamily: "'Noto Serif KR', serif" }}><TrendingUp size={18} color="var(--gold)" />④ 성적 추이</h3>
        {tests.length < 2 ? <EmptyState text="추이를 보려면 테스트 기록이 2건 이상 필요합니다." /> : (
          <div style={{ width: "100%", height: 160 }}>
            <ResponsiveContainer>
              <LineChart data={tests.map(t => ({ date: t.date.slice(5), score: t.score }))}>
                <XAxis dataKey="date" tick={{ fill: "#7a6f52", fontSize: 10 }} axisLine={{ stroke: "#e4d8ba" }} tickLine={false} />
                <YAxis tick={{ fill: "#7a6f52", fontSize: 10 }} axisLine={{ stroke: "#e4d8ba" }} tickLine={false} domain={[0, 100]} />
                <Tooltip contentStyle={{ background: "#fffcf6", border: "1px solid #e4d8ba", color: "#2b2417" }} />
                <Line type="monotone" dataKey="score" stroke="#e2822f" strokeWidth={2} dot={{ fill: "#e2822f", r: 3 }} />
              </LineChart>
            </ResponsiveContainer>
          </div>
        )}
      </div>

      <OneLineNotes title="⑤ 선생님 코멘트" icon={MessageSquare} items={comments} canEdit={canEdit} onAdd={addComment} onRemove={removeComment} />
      <OneLineNotes title="⑥ 상담 기록" icon={ClipboardSignature} items={notes} canEdit={canEdit} onAdd={addNote} onRemove={removeNote} accent="#7a8cc4" />
      <PhotoLightbox src={lightboxSrc} onClose={() => setLightboxSrc(null)} />
    </div>
  );
}

// ================= ADMIN: 전체 메뉴 홈 =================
const COMPONENT_MAP = {
  students: StudentsTab, planner: PlannerTab, homework: HomeworkTab,
  sessions: SessionsTab, tests: TestsTab, seats: SeatsAdminTab,
  videos: VideosTab, routine: AdminRoutineTab, alerts: AlertsTab,
  rules: RulesTab, attendance: AttendanceTab, teachers: TeachersTab,

function AdminPanel({ data, setData, patchData, onExit }) {
  const [openGroup, setOpenGroup] = useState(null);
  const [subTab, setSubTab] = useState(null);
  const group = GROUPS.find(g => g.id === openGroup);

  const openGroupById = (id, subTabId) => {
    const g = GROUPS.find(x => x.id === id);
    setOpenGroup(id);
    setSubTab(subTabId || g.tabs[0].id);
  };

  if (!group) return <AdminHome data={data} onOpen={openGroupById} onExit={onExit} />;

  const Comp = COMPONENT_MAP[subTab] || Dashboard;

  return (
    <div className="min-h-screen px-5 pb-6" style={{ background: "#f6f1e4", paddingTop: "max(24px, calc(env(safe-area-inset-top) + 16px))" }}>

        {group.tabs.length > 1 && (
          <div className="flex gap-2 mb-4 flex-wrap">

              const active = subTab === t.id;
              return (
                <button key={t.id} onClick={() => setSubTab(t.id)} className="px-3 py-1.5 rounded-full text-xs font-semibold"

        )}
        {Comp && <Comp data={data} setData={setData} patchData={patchData} />}

}
