<script>
  function showError(title, detail) {
    var root = document.getElementById('root');
    if (root) {
      root.innerHTML =
        '<div style="padding:20px;font-family:-apple-system,monospace;white-space:pre-wrap;word-break:break-word;color:#b91c1c;background:#fff;line-height:1.5;">' +

        '<div style="font-size:13px;">' + detail + '</div></div>';
    }
  }
  window.addEventListener('error', function (e) {
    showError('오류가 발생했어요', (e.error && e.error.stack) ? e.error.stack : (e.message || String(e)));
  });
  window.addEventListener('unhandledrejection', function (e) {
    var reason = e.reason;
    showError('오류가 발생했어요 (Promise)', (reason && reason.stack) ? reason.stack : String(reason));
  });
</script>

const TABLE = "app_storage";
function localKey(key, shared) { return `routine_math_storage:${shared ? "shared" : "local"}:${key}`; }

window.storage = {
  async get(key, shared = false) {
    if (supabase) {
      try {
        const { data, error } = await supabase.from(TABLE).select("value").eq("key", key).eq("shared", !!shared).maybeSingle();
        if (error) throw error;
        if (!data) return null;
        return { key, value: data.value, shared };
      } catch (e) { console.error("storage.get (supabase) 실패", e); return null; }
    }
    try {
      const raw = localStorage.getItem(localKey(key, shared));
      if (raw === null) return null;
      return { key, value: raw, shared };
    } catch (e) { console.error("storage.get (localStorage) 실패", e); return null; }
  },
  async set(key, value, shared = false) {
    if (supabase) {
      try {
        const { error } = await supabase.from(TABLE).upsert({ key, shared: !!shared, value, updated_at: new Date().toISOString() }, { onConflict: "key,shared" });
        if (error) throw error;
        return { key, value, shared };
      } catch (e) { console.error("storage.set (supabase) 실패", e); return null; }
    }
    try {
      localStorage.setItem(localKey(key, shared), value);
      return { key, value, shared };
    } catch (e) { console.error("storage.set (localStorage) 실패", e); return null; }
  },
  async delete(key, shared = false) {
    if (supabase) {
      try {
        const { error } = await supabase.from(TABLE).delete().eq("key", key).eq("shared", !!shared);
        if (error) throw error;
        return { key, deleted: true, shared };
      } catch (e) { console.error("storage.delete (supabase) 실패", e); return null; }
    }
    try {
      localStorage.removeItem(localKey(key, shared));
      return { key, deleted: true, shared };
    } catch (e) { console.error("storage.delete (localStorage) 실패", e); return null; }
  },
  async list(prefix = "", shared = false) {
    if (supabase) {
      try {
        let query = supabase.from(TABLE).select("key").eq("shared", !!shared);
        if (prefix) query = query.like("key", `${prefix}%`);
        const { data, error } = await query;
        if (error) throw error;
        return { keys: (data || []).map(r => r.key), prefix, shared };
      } catch (e) { console.error("storage.list (supabase) 실패", e); return null; }
    }
    try {
      const fullPrefix = localKey(prefix, shared);
      const keys = [];
      for (let i = 0; i < localStorage.length; i++) {
        const k = localStorage.key(i);
        if (k && k.startsWith(fullPrefix)) keys.push(k.replace(localKey("", shared), ""));
      }
      return { keys, prefix, shared };
    } catch (e) { console.error("storage.list (localStorage) 실패", e); return null; }
  },
};

function fileToDataURL(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (e) => resolve(e.target.result);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function useAppData() {
  const [data, setDataState] = useState(emptyData());
  const [loading, setLoading] = useState(true);
  const [saving, setSaving] = useState(false);
  const dataRef = useRef(data);
  const savingRef = useRef(saving);
  useEffect(() => { dataRef.current = data; }, [data]);
  useEffect(() => { savingRef.current = saving; }, [saving]);

  const fetchLatest = async () => {
    try {
      const res = await window.storage.get(STORAGE_KEY, true);
      if (res && res.value) {
        const parsed = { ...emptyData(), ...JSON.parse(res.value) };
        if (JSON.stringify(parsed) !== JSON.stringify(dataRef.current)) {
          setDataState(parsed);
        }
      }
    } catch (e) { /* 최초 실행 또는 네트워크 오류 - 무시 */ }
  };

  useEffect(() => {
    (async () => {
      await fetchLatest();
      setLoading(false);
    })();
  }, []);

  // 화면을 오래 켜놔도 "옛날 데이터"로 덮어쓰지 않도록, 주기적으로/탭이 다시 보일 때 최신 데이터를 다시 받아옴
  useEffect(() => {
    const interval = setInterval(() => { if (!savingRef.current) fetchLatest(); }, 20000);
    const onVisible = () => { if (document.visibilityState === "visible" && !savingRef.current) fetchLatest(); };
    document.addEventListener("visibilitychange", onVisible);
    window.addEventListener("focus", onVisible);
    return () => {
      clearInterval(interval);
      document.removeEventListener("visibilitychange", onVisible);
      window.removeEventListener("focus", onVisible);
    };
  }, []);

  const setData = async (next) => {
    setDataState(next);
    setSaving(true);
    try { await window.storage.set(STORAGE_KEY, JSON.stringify(next), true); }
    catch (e) { console.error("저장 실패", e); }
    setSaving(false);
  };

  return { data, setData, loading, saving };
}

function syncAlerts(alerts, sourceKey, shouldExist, buildAlert) {
  const existingPending = alerts.find(a => a.sourceKey === sourceKey && a.status === "대기");
  if (shouldExist) {
    if (existingPending) {
      return alerts.map(a => a.sourceKey === sourceKey && a.status === "대기" ? { ...a, ...buildAlert(), id: a.id, sourceKey, status: "대기" } : a);
    }
    return [...alerts, { id: uid(), sourceKey, status: "대기", createdAt: new Date().toISOString(), ...buildAlert() }];
  }
  return existingPending ? alerts.filter(a => !(a.sourceKey === sourceKey && a.status === "대기")) : alerts;
}

function PinBoxes({ value, onChange, length = 4 }) {
  const refs = useRef([]);
  const digits = value.split("").concat(Array(length).fill("")).slice(0, length);
  const setDigit = (i, v) => {
    if (!/^[0-9]?$/.test(v)) return;
    const next = digits.slice(); next[i] = v; onChange(next.join(""));
    if (v && i < length - 1) refs.current[i + 1]?.focus();
  };
  const onKeyDown = (i, e) => { if (e.key === "Backspace" && !digits[i] && i > 0) refs.current[i - 1]?.focus(); };
  return (
    <div className="flex gap-2">
      {digits.map((d, i) => (
        <input key={i} ref={el => (refs.current[i] = el)} value={d} onChange={e => setDigit(i, e.target.value)} onKeyDown={e => onKeyDown(i, e)}
          inputMode="numeric" maxLength={1} className="w-12 h-14 text-center text-xl rounded-xl outline-none"
          style={{ background: "#efe6d0", border: "1px solid #ddcda0", color: "var(--gold)" }} />
      ))}
    </div>
  );
}

// ================= 플래너 로직 =================
function applyPlannerEntry(data, setData, patch, id) {
  const student = data.students.find(s => s.id === patch.studentId);
  if (!student) return;
  const rate = patch.planned > 0 ? Math.round((patch.done / patch.planned) * 100) : 0;
  const finalId = id || uid();
  const planners = id ? data.planners.map(p => p.id === id ? { ...p, ...patch } : p) : [...data.planners, { id: finalId, ...patch }];
  const alerts = syncAlerts(data.alerts, `planner:${finalId}`, rate < PASS_RATE, () => ({
    studentId: patch.studentId, kind: "성취율 미달",
    message: `[루틴수학] ${student.name} 학생 ${patch.date} 플래너 성취율 ${rate}% 입니다 (계획 ${patch.planned} / 완료 ${patch.done}).`,
  }));
  setData({ ...data, planners, alerts });
}

function syncHomeworkAlert(entry, data) {
  const student = data.students.find(s => s.id === entry.studentId);
  return syncAlerts(data.alerts, `homework:${entry.id}`, !entry.submitted, () => ({
    studentId: entry.studentId, kind: "숙제 미제출",
    message: `[루틴수학] ${student?.name || ""} 학생 ${entry.date} "${entry.title}" 숙제가 미제출 상태입니다.`,
  }));
}

function fileToCompressedDataURL(file, maxWidth = 640, quality = 0.55) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        const scale = Math.min(1, maxWidth / img.width);
        const canvas = document.createElement("canvas");
        canvas.width = Math.round(img.width * scale);
        canvas.height = Math.round(img.height * scale);
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        resolve(canvas.toDataURL("image/jpeg", quality));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

              <li key={h.id} className="flex flex-col gap-2 p-3 rounded-lg" style={{ background: h.submitted ? "#efe6d0" : "#f8e3c9" }}>
                <div className="flex items-center justify-between">
                  <div className="text-sm" style={{ color: "#4a4332" }}>
                    <b style={{ color: "#2b2417" }}>{studentName(h.studentId)}</b> · {h.title}
                    {h.dueDate && <span className="text-[10px] ml-2 px-1.5 py-0.5 rounded-full" style={{ background: isOverdue(h) ? "var(--coral)" : "#e4d8ba", color: isOverdue(h) ? "#fff" : "#5c543e" }}>{isOverdue(h) ? "기한 초과" : `기한 ${h.dueDate}`}</span>}
                  </div>
                  <div className="flex items-center gap-2">
                    <button onClick={() => toggle(h)} className="px-3 py-1 rounded-full text-xs font-semibold flex items-center gap-1" style={{ background: h.submitted ? "#4c8c5f" : "var(--coral)", color: "#fff" }}>
                      {h.submitted ? <Check size={12} /> : <X size={12} />}{h.submitted ? "제출완료" : "미제출"}
                    </button>
                    <button onClick={() => remove(h.id)} className="p-1.5 rounded-md" style={{ background: "#efe3c8" }}><Trash2 size={14} color="var(--coral)" /></button>
                  </div>
                </div>
                {(h.submittedAt || (h.photos && h.photos.length > 0) || h.photo) && (
                  <div className="flex items-center gap-2 flex-wrap">
                    {h.submittedAt && <span className="text-xs flex-shrink-0" style={{ color: "#7a6f52" }}>{formatTime(h.submittedAt)} 제출</span>}
                    {(h.photos || (h.photo ? [h.photo] : [])).map((src, i) => (
                      <img key={i} src={src} onClick={() => window.open(src, "_blank")} alt="질문 사진" className="rounded-md cursor-pointer flex-shrink-0" style={{ height: 52, width: 52, objectFit: "cover", border: "1px solid #e4d8ba" }} />
                    ))}
                    {h.note && <p className="text-xs" style={{ color: "#7a6f52" }}>{h.note}</p>}
                  </div>
                )}
              </li>
            ))}
          </ul>
        )}
      </div>
    </div>
  );
}

// ================= ADMIN: 보강·클리닉 =================
function SessionsTab({ data, setData, scopeClassGroups }) {
  const [studentId, setStudentId] = useState("");
  const [type, setType] = useState("보강");
  const [date, setDate] = useState(todayStr());
  const [time, setTime] = useState("16:00");
  const [memo, setMemo] = useState("");
  const [filter, setFilter] = useState("");
  const scopedStudents = studentsInScope(data.students, scopeClassGroups);
  const scopedIds = new Set(scopedStudents.map(s => s.id));
  const studentName = (id) => data.students.find(s => s.id === id)?.name || "-";
  const syncForSession = (entry, alerts) => {
    const student = data.students.find(s => s.id === entry.studentId);
    return syncAlerts(alerts, `session:${entry.id}`, entry.status === "불참", () => ({
      studentId: entry.studentId, kind: `${entry.type} 불참`,
      message: `[루틴수학] ${student?.name || ""} 학생이 ${entry.date} ${entry.time} ${entry.type}에 불참했습니다.`,
    }));
  };
  const add = () => {
    if (!studentId) return;
    setData({ ...data, sessions: [...data.sessions, { id: uid(), studentId, type, date, time, status: "예정", memo }] });
    setStudentId(""); setMemo("");
  };
  const setStatus = (s, status) => {
    const updated = { ...s, status };
    setData({ ...data, sessions: data.sessions.map(x => x.id === s.id ? updated : x), alerts: syncForSession(updated, data.alerts) });
  };
  const remove = (id) => setData({ ...data, sessions: data.sessions.filter(s => s.id !== id), alerts: data.alerts.filter(a => a.sourceKey !== `session:${id}` || a.status !== "대기") });
  const list = data.sessions.filter(s => scopedIds.has(s.studentId) && (!filter || s.studentId === filter)).sort((a, b) => (a.date + a.time).localeCompare(b.date + b.time));
  const statusColor = { "예정": "#7a6f52", "완료": "#4c8c5f", "불참": "var(--coral)" };

  return (
    <div className="flex flex-col gap-4">
      <div className="rounded-2xl p-4 flex flex-col gap-3" style={panel}>
        <h3 className="font-bold" style={{ fontFamily: "'Noto Serif KR', serif" }}>보강·클리닉 일정 등록</h3>
        <div className="grid grid-cols-2 gap-3">
          <Field label="학생"><StudentSelect students={scopedStudents} value={studentId} onChange={setStudentId} /></Field>
          <Field label="유형">
            <select className={inputCls} style={inputStyle} value={type} onChange={e => setType(e.target.value)}>
              <option value="보강">보강</option><option value="클리닉">클리닉</option>
            </select>
          </Field>
          <Field label="날짜"><input type="date" className={inputCls} style={inputStyle} value={date} onChange={e => setDate(e.target.value)} /></Field>
          <Field label="시간"><input type="time" className={inputCls} style={inputStyle} value={time} onChange={e => setTime(e.target.value)} /></Field>
        </div>
        <Field label="메모 (선택)"><input className={inputCls} style={inputStyle} value={memo} onChange={e => setMemo(e.target.value)} /></Field>
        <button onClick={add} className="self-start px-4 py-2 rounded-lg text-sm font-semibold flex items-center gap-1" style={btnGold}><Plus size={16} />일정 추가</button>
      </div>
      <div className="rounded-2xl p-4" style={panel}>
        <div className="flex items-center justify-between mb-3">
          <h3 className="font-bold" style={{ fontFamily: "'Noto Serif KR', serif" }}>전체 일정 ({list.length}건)</h3>
          <StudentSelect students={scopedStudents} value={filter} onChange={setFilter} allowAll />
        </div>
        {list.length === 0 ? <EmptyState text="등록된 일정이 없습니다." /> : (
          <ul className="flex flex-col gap-2">
            {list.map(s => (
              <li key={s.id} className="flex items-center justify-between p-3 rounded-lg" style={{ background: "#efe6d0" }}>
                <div className="text-sm" style={{ color: "#4a4332" }}>
                  <b style={{ color: "#2b2417" }}>{studentName(s.studentId)}</b> · {s.type} · {s.date} {s.time}
                  {s.memo && <div className="text-xs" style={{ color: "#7a6f52" }}>{s.memo}</div>}
                </div>
                <div className="flex items-center gap-2">
                  <select value={s.status} onChange={e => setStatus(s, e.target.value)} className="text-xs font-semibold rounded-full px-2 py-1 border-0" style={{ color: "#fff", background: statusColor[s.status] }}>
                    <option value="예정">예정</option><option value="완료">완료</option><option value="불참">불참</option>
                  </select>
                  <button onClick={() => remove(s.id)} className="p-1.5 rounded-md" style={{ background: "#efe3c8" }}><Trash2 size={14} color="var(--coral)" /></button>
                </div>
              </li>
            ))}
          </ul>
        )}
      </div>
    </div>
  );
}

// ================= ADMIN: 테스트 결과 =================
function TestsTab({ data, setData, scopeClassGroups }) {
  const [studentId, setStudentId] = useState("");
  const [name, setName] = useState("");
  const [testType, setTestType] = useState(TEST_TYPES[0]);
  const [date, setDate] = useState(todayStr());
  const [score, setScore] = useState("");
  const [passLine, setPassLine] = useState("70");
  const [filter, setFilter] = useState("");
  const scopedStudents = studentsInScope(data.students, scopeClassGroups);
  const scopedIds = new Set(scopedStudents.map(s => s.id));
  const studentName = (id) => data.students.find(s => s.id === id)?.name || "-";
  const add = () => {
    if (!studentId || !name.trim() || score === "") return;
    const student = data.students.find(s => s.id === studentId);
    const entry = { id: uid(), studentId, name, testType, date, score: Number(score), passLine: Number(passLine), passed: Number(score) >= Number(passLine), retest: false, note: "" };
    const alerts = syncAlerts(data.alerts, `test:${entry.id}`, entry.score < entry.passLine, () => ({
      studentId, kind: "테스트 기준미달",
      message: `[루틴수학] ${student?.name || ""} 학생 [${testType}] "${entry.name}" 결과 ${entry.score}점 (기준 ${entry.passLine}점 미달)입니다.`,
    }));
    setData({ ...data, tests: [...data.tests, entry], alerts });
    setName(""); setScore("");
  };
  const remove = (id) => setData({ ...data, tests: data.tests.filter(t => t.id !== id), alerts: data.alerts.filter(a => a.sourceKey !== `test:${id}` || a.status !== "대기") });
  const updateTestField = (testId, field, value) => setData({ ...data, tests: data.tests.map(t => t.id === testId ? { ...t, [field]: value } : t) });
  const list = data.tests.filter(t => scopedIds.has(t.studentId) && (!filter || t.studentId === filter)).sort((a, b) => b.date.localeCompare(a.date));
  const summaryByType = filter ? TEST_TYPES.map(tp => {
    const arr = data.tests.filter(t => t.studentId === filter && (t.testType || "일일테스트") === tp);
    return { tp, count: arr.length, avg: arr.length ? Math.round(arr.reduce((s, t) => s + t.score, 0) / arr.length) : null };
  }) : null;

  return (
    <div className="flex flex-col gap-4">
      <div className="rounded-2xl p-4 flex flex-col gap-3" style={panel}>
        <h3 className="font-bold" style={{ fontFamily: "'Noto Serif KR', serif" }}>테스트 결과 입력</h3>
        <div className="grid grid-cols-2 gap-3">
          <Field label="학생"><StudentSelect students={scopedStudents} value={studentId} onChange={setStudentId} /></Field>
          <Field label="유형">
            <select className={inputCls} style={inputStyle} value={testType} onChange={e => setTestType(e.target.value)}>
              {TEST_TYPES.map(t => <option key={t}>{t}</option>)}
            </select>
          </Field>
          <Field label="날짜"><input type="date" className={inputCls} style={inputStyle} value={date} onChange={e => setDate(e.target.value)} /></Field>
          <Field label="시험명"><input className={inputCls} style={inputStyle} value={name} onChange={e => setName(e.target.value)} /></Field>
          <Field label="점수"><input type="number" className={inputCls} style={inputStyle} value={score} onChange={e => setScore(e.target.value)} /></Field>
          <Field label="기준 점수"><input type="number" className={inputCls} style={inputStyle} value={passLine} onChange={e => setPassLine(e.target.value)} /></Field>
        </div>
        <button onClick={add} className="self-start px-4 py-2 rounded-lg text-sm font-semibold flex items-center gap-1" style={btnGold}><Plus size={16} />결과 추가</button>
      </div>
      <div className="rounded-2xl p-4" style={panel}>
        <div className="flex items-center justify-between mb-3">
          <h3 className="font-bold" style={{ fontFamily: "'Noto Serif KR', serif" }}>테스트 기록 ({list.length}건)</h3>
          <StudentSelect students={scopedStudents} value={filter} onChange={setFilter} allowAll />
        </div>
        {summaryByType && (
          <div className="grid grid-cols-2 gap-2 mb-3">
            {summaryByType.map(s => (
              <div key={s.tp} className="rounded-lg p-2" style={{ background: "#efe6d0" }}>
                <div className="text-[11px]" style={{ color: "#7a6f52" }}>{s.tp} ({s.count}회)</div>
                <div className="text-sm font-bold" style={{ color: s.avg !== null && s.avg < PASS_RATE ? "var(--coral)" : "var(--gold)" }}>{s.avg === null ? "-" : `평균 ${s.avg}점`}</div>
              </div>
            ))}
          </div>
        )}
        {list.length === 0 ? <EmptyState text="등록된 테스트 결과가 없습니다." /> : (
          <ul className="flex flex-col gap-2">
            {list.map(t => {
              const low = t.score < t.passLine;
              const passed = t.passed !== undefined ? t.passed : !low;
              return (
                <li key={t.id} className="flex flex-col gap-2 p-3 rounded-lg" style={{ background: low ? "#f8e3c9" : "#efe6d0" }}>
                  <div className="flex items-center justify-between">
                    <div className="text-sm" style={{ color: "#4a4332" }}>
                      <b style={{ color: "#2b2417" }}>{studentName(t.studentId)}</b> · {t.name} · {t.date}
                      <span className="text-[10px] ml-2 px-1.5 py-0.5 rounded-full" style={{ background: "#e4d8ba", color: "#5c543e" }}>{t.testType || "주간테스트"}</span>
                      <span className="font-bold ml-2" style={{ color: low ? "var(--coral)" : "var(--gold)" }}>{t.score}점</span>
                      <span className="text-xs" style={{ color: "#7a6f52" }}> (기준 {t.passLine}점)</span>
                    </div>
                    <button onClick={() => remove(t.id)} className="p-1.5 rounded-md flex-shrink-0" style={{ background: "#efe3c8" }}><Trash2 size={14} color="var(--coral)" /></button>
                  </div>
                  <div className="flex items-center gap-2 flex-wrap">
                    <button onClick={() => updateTestField(t.id, "passed", !passed)} className="px-2.5 py-1 rounded-full text-xs font-semibold" style={{ background: passed ? "#4c8c5f" : "var(--coral)", color: "#fff" }}>{passed ? "통과" : "미통과"}</button>
                    <button onClick={() => updateTestField(t.id, "retest", !t.retest)} className="px-2.5 py-1 rounded-full text-xs font-semibold" style={{ background: t.retest ? "var(--coral)" : "#e4d8ba", color: t.retest ? "#fff" : "#5c543e" }}>{t.retest ? "재시험 필요" : "재시험 없음"}</button>
                  </div>
                  <input className={inputCls} style={{ ...inputStyle, padding: "6px 10px" }} placeholder="강사 메모 (선택)" value={t.note || ""} onChange={e => updateTestField(t.id, "note", e.target.value)} />
                </li>
              );
            })}
          </ul>
        )}
      </div>
    </div>
  );
}

// ================= 오늘의 루틴 =================
function DailyRoutineTab({ data, setData, scopeClassGroups }) {
  const [studentId, setStudentId] = useState("");
  const [date, setDate] = useState(todayStr());
  const [items, setItems] = useState(ROUTINE_ITEM_DEFS.map(d => ({ ...d, result: d.kind === "count" ? "" : (d.kind === "choice" ? "" : false) })));
  const [testName, setTestName] = useState("");
  const [testScore, setTestScore] = useState("");
  const [comment, setComment] = useState("");
  const [editingId, setEditingId] = useState(null);
  const students = studentsInScope(data.students, scopeClassGroups);
  const studentName = (id) => data.students.find(s => s.id === id)?.name || "-";

  const updateItem = (key, field, value) => setItems(items.map(it => it.key === key ? { ...it, [field]: value } : it));

  // 그날 기한인 숙제의 실제 제출 기록 (강사가 참고할 수 있도록 낱개로 보여주기만 함 — 최종 선택은 강사가 직접 클릭)
  const todaysHomeworks = studentId ? data.homeworks.filter(h => h.studentId === studentId && (h.dueDate || h.date) === date) : [];

  const practiceItem = items.find(it => it.key === "practice");
  const wrongItem = items.find(it => it.key === "wrong");
  const practiceCount = Number(practiceItem?.result) || 0;
  const wrongCount = Number(wrongItem?.result) || 0;
  const accuracy = practiceCount > 0 ? Math.max(0, Math.min(100, Math.round(((practiceCount - wrongCount) / practiceCount) * 100))) : null;

  const rateOf = (it) => {
    if (it.key === "homework") return it.result === "완료" ? 100 : (it.result === "기한초과" ? 50 : (it.result === "미제출" ? 0 : null));
    if (it.key === "wrong") return null; // 정답률로 따로 집계, 완료율 평균에는 안 넣음
    if (it.key === "practice") return Number(it.result) > 0 ? 100 : 0;
    if (it.key === "class") return null; // 새로 배움/복습은 종류 정보라 완료율에 안 넣음 (일수 breakdown으로 별도 표시)
    if (it.key === "review") return null; // 진행중 일수로 따로 집계, 완료율 평균에는 안 넣음
    if (it.kind === "boolean" || it.kind === "choice") return it.result ? 100 : 0;
    return 0;
  };

  const save = () => {
    if (!studentId) return;
    const student = data.students.find(s => s.id === studentId);
    const itemsToSave = items;
    const rates = itemsToSave.map(rateOf).filter(r => r !== null);
    const score = rates.length ? Math.round(rates.reduce((a, b) => a + b, 0) / rates.length) : 0;
    const routineId = editingId || uid();
    const existing = editingId ? data.routines.find(r => r.id === editingId) : null;
    const routine = { id: routineId, studentId, date, items: itemsToSave, testName, testScore: testScore ? Number(testScore) : null, comment, score, createdAt: existing?.createdAt || new Date().toISOString() };

    const attendance = data.attendance.find(a => a.studentId === studentId && a.date === date);
    const message = buildDailyReportText(student, date, itemsToSave, testName, testScore, comment, score, attendance);
    const alerts = syncAlerts(data.alerts, `routine:${routineId}`, true, () => ({ studentId, kind: "오늘의 루틴", message }));
    const routines = editingId ? data.routines.map(r => r.id === editingId ? routine : r) : [...data.routines, routine];

    // "오늘의 평가" 점수를 "테스트 기록"·"성적 추이"에도 반영되도록 data.tests에 함께 기록 (수정 시 같은 항목을 갱신)
    const linkedTestId = `routine-${routineId}`;
    let tests = data.tests.filter(t => t.id !== linkedTestId);
    if (testName.trim() && testScore !== "") {
      tests = [...tests, { id: linkedTestId, studentId, name: testName.trim(), testType: "일일테스트", date, score: Number(testScore), passLine: PASS_RATE, passed: Number(testScore) >= PASS_RATE, retest: false, note: "" }];
    }

    setData({ ...data, routines, alerts, tests });
    setTestName(""); setTestScore(""); setComment("");
    setItems(ROUTINE_ITEM_DEFS.map(d => ({ ...d, result: d.kind === "count" ? "" : (d.kind === "choice" ? "" : false) })));
    setEditingId(null);
  };

  const editRoutine = (r) => {
    setEditingId(r.id);
    setStudentId(r.studentId);
    setDate(r.date);
    setItems(ROUTINE_ITEM_DEFS.map(def => {
      const found = (r.items || []).find(it => it.key === def.key);
      return { ...def, result: found ? found.result : (def.kind === "count" ? "" : (def.kind === "choice" ? "" : false)), note: found?.note || "" };
    }));
    setTestName(r.testName || "");
    setTestScore(r.testScore != null ? String(r.testScore) : "");
    setComment(r.comment || "");
  };

  const cancelEdit = () => {
    setEditingId(null);
    setTestName(""); setTestScore(""); setComment("");
    setItems(ROUTINE_ITEM_DEFS.map(d => ({ ...d, result: d.kind === "count" ? "" : (d.kind === "choice" ? "" : false) })));
  };

  const removeRoutine = (id) => setData({ ...data, routines: data.routines.filter(r => r.id !== id), alerts: data.alerts.filter(a => a.sourceKey !== `routine:${id}` || a.status !== "대기"), tests: data.tests.filter(t => t.id !== `routine-${id}`) });

  const mine = data.routines.filter(r => studentsInScope(data.students, scopeClassGroups).some(s => s.id === r.studentId)).sort((a, b) => b.createdAt.localeCompare(a.createdAt)).slice(0, 10);

  return (
    <div className="flex flex-col gap-4">
      <div className="rounded-2xl p-4 flex flex-col gap-3" style={panel}>
        <h3 className="font-bold" style={{ fontFamily: "'Noto Serif KR', serif" }}>오늘의 루틴 입력</h3>
        <div className="grid grid-cols-2 gap-3">
          <Field label="학생"><StudentSelect students={students} value={studentId} onChange={setStudentId} /></Field>
          <Field label="날짜"><input type="date" className={inputCls} style={inputStyle} value={date} onChange={e => setDate(e.target.value)} /></Field>
        </div>
        <div className="flex flex-col gap-2">
          <p className="text-[11px]" style={{ color: "#8a7f5e" }}>진도수업: N=새로 배움 · R=복습 중 &nbsp;|&nbsp; 개념복습: P=진행중 · C=완료 &nbsp;|&nbsp; 숙제: 완료=기한 내 · 기한초과 · 미제출</p>
          {items.map(it => {
            if (it.kind === "count") {
              return (
                <div key={it.key} className="flex items-center gap-2 p-2 rounded-lg" style={{ background: "#efe6d0" }}>
                  <span className="text-sm w-16 flex-shrink-0" style={{ color: "#2b2417" }}>{it.label}</span>
                  <input type="number" min="0" className={inputCls} style={inputStyle} placeholder="0" value={it.result} onChange={e => updateItem(it.key, "result", e.target.value)} />
                  <span className="text-xs flex-shrink-0" style={{ color: "#7a6f52" }}>{it.unit}</span>
                </div>
              );
            }
            if (it.kind === "choice") {
              return (
                <div key={it.key} className="flex flex-col gap-1.5 p-2 rounded-lg" style={{ background: "#efe6d0" }}>
                  <div className="flex items-center gap-2">
                    <span className="text-sm w-16 flex-shrink-0" style={{ color: "#2b2417" }}>{it.label}</span>
                    <div className="ml-auto flex gap-1.5 flex-wrap justify-end">
                      {it.options.map(opt => (
                        <button key={opt.value} onClick={() => updateItem(it.key, "result", opt.value)} className="px-2.5 py-1.5 rounded-full text-[11px] font-bold"
                          style={{ background: it.result === opt.value ? "#4c8c5f" : "#e4d8ba", color: it.result === opt.value ? "#fff" : "#5c543e" }}>{opt.value}</button>
                      ))}
                    </div>
                  </div>
                  {it.key === "homework" ? (
                    todaysHomeworks.length === 0 ? (
                      <p className="text-[11px]" style={{ color: "#8a7f5e" }}>참고 — 이 날짜 기한인 숙제가 없어요</p>
                    ) : (
                      <div className="flex flex-col gap-1">

          <ul className="flex flex-col gap-2">
            {mine.map(r => {
              const p = (r.items || []).find(it => it.key === "practice");

                    <span className="text-sm" style={{ color: "#2b2417" }}><b>{studentName(r.studentId)}</b> · {r.date}</span>

                      ))}

                      <button onClick={() => removeRoutine(r.id)} className="p-1 rounded-md" style={{ background: "#efe3c8" }}><Trash2 size={12} color="var(--coral)" /></button>

                  </div>

                  {r.testName && <div className="text-xs mt-1" style={{ color: "#7a6f52" }}>{r.testName} {r.testScore}점</div>}
                </li>
              );
            })}
          </ul>
        )}
      </div>
    </div>
  );
}

function buildDailyReportText(student, date, items, testName, testScore, comment, score, attendance) {
  const lines = [];
  lines.push("🌱 오늘의 ROUTINE");
  lines.push(`${student?.name || ""} / ${student?.grade || ""}`);
  lines.push("");
  if (attendance) {
    lines.push(`출결: ${attendance.status}${attendance.time ? ` (${attendance.time})` : ""}`);
  } else {
    lines.push("출결: 기록 없음");
  }
  lines.push("");
  lines.push("오늘 할 일 · 결과");
  const practiceItem = items.find(it => it.key === "practice");
  const wrongItem = items.find(it => it.key === "wrong");
  const pc = Number(practiceItem?.result) || 0, wc = Number(wrongItem?.result) || 0;
  items.forEach(it => {
    if (it.key === "wrong") return; // 문제풀이 줄에서 함께 표기
    if (it.key === "practice") {
      if (pc > 0) {
        const acc = Math.max(0, Math.min(100, Math.round(((pc - wc) / pc) * 100)));
        lines.push(`문제풀이 · ${pc}문제 (오답 ${wc}문제 · 정답률 ${acc}%)`);
      } else {
        lines.push(`문제풀이 · 기록 없음`);
      }
    } else if (it.kind === "boolean") {
      let statusText = "해당없음";
      if (it.result !== null) {
        if (it.result) statusText = "✅ 제출완료";
        else statusText = it.overdue ? "❌ 기한 초과" : "❌ 미완료";
      }
      lines.push(`${it.label} · ${statusText}`);
    } else if (it.kind === "choice") {
      const opt = (it.options || []).find(o => o.value === it.result);
      lines.push(`${it.label} · ${opt ? `${opt.value} (${opt.label})` : "-"}${it.note ? ` — ${it.note}` : ""}`);
    }
  });
  if (testName) {
    lines.push("");
    lines.push("오늘의 평가");
    lines.push(testName);
    lines.push(`${testScore}점`);
  }
  if (comment) {
    lines.push("");
    lines.push("선생님 코멘트");
    lines.push(comment);
  }
  return lines.join("\n");
}

function buildWeeklyReportText(student, weekStart, itemAverages, overall, testAvg, avgPracticeCount, avgAccuracy, reviewBreakdown, classBreakdown) {
  const lines = [];
  lines.push("📊 주간 ROUTINE");
  lines.push(`${student?.name || ""} / ${student?.grade || ""}`);
  lines.push("");
  lines.push(`이번 주 실제 달성률 ${overall === null ? "-" : `${overall}%`}`);
  lines.push("");
  if (classBreakdown && (classBreakdown.N + classBreakdown.R) > 0) {
    lines.push(`진도수업 새로 배움 ${classBreakdown.N}일 · 복습 중 ${classBreakdown.R}일`);
  }
  if (reviewBreakdown && (reviewBreakdown.P + reviewBreakdown.C) > 0) {
    const reviewRate = Math.round((reviewBreakdown.C / (reviewBreakdown.P + reviewBreakdown.C)) * 100);
    lines.push(`개념복습 진행중 ${reviewBreakdown.P}일 · 완료율 ${reviewRate}%`);
  }
  itemAverages.forEach(it => {
    lines.push(`${it.label} ${it.avg === null ? "기록없음" : `${it.avg}%`}`);
  });
  if (avgPracticeCount !== null) lines.push(`하루 평균 문제풀이 ${avgPracticeCount}문제`);
  if (avgAccuracy !== null) lines.push(`평균 정답률 ${avgAccuracy}%`);
  if (testAvg !== null) lines.push(`테스트 평균 ${testAvg}점`);
  return lines.join("\n");
}

function weeklyPlannerTaskRate(data, studentId, weekStart) {
  const tasks = (data.plannerTasks || []).filter(t => t.studentId === studentId && mondayOf(t.date) === weekStart);
  if (tasks.length === 0) return null;
  const done = tasks.filter(t => t.done).length;
  return Math.round((done / tasks.length) * 100);
}

function weeklyRoutineStats(data, studentId, weekStart) {
  const weekRoutines = data.routines.filter(r => r.studentId === studentId && mondayOf(r.date) === weekStart);
  const perItem = {};
  ROUTINE_ITEM_DEFS.forEach(def => { perItem[def.key] = []; });
  const practiceCounts = [];
  const accuracies = [];
  const reviewBreakdown = { P: 0, C: 0 };
  const classBreakdown = { N: 0, R: 0 };
  weekRoutines.forEach(r => {
    const items = r.items || [];
    const practiceItem = items.find(it => it.key === "practice");
    const wrongItem = items.find(it => it.key === "wrong");
    const pc = Number(practiceItem?.result) || 0;
    const wc = Number(wrongItem?.result) || 0;
    if (pc > 0) {
      practiceCounts.push(pc);
      accuracies.push(Math.max(0, Math.min(100, Math.round(((pc - wc) / pc) * 100))));
    }
    const classItem = items.find(it => it.key === "class");
    if (classItem?.result === "N") classBreakdown.N++;
    else if (classItem?.result === "R") classBreakdown.R++;
    const reviewItem = items.find(it => it.key === "review");
    if (reviewItem?.result === "P") reviewBreakdown.P++;
    else if (reviewItem?.result === "C") reviewBreakdown.C++;

    items.forEach(it => {
      if (it.key === "wrong" || it.key === "practice" || it.key === "class" || it.key === "review") return; // 따로 집계
      if (it.key === "homework") {
        if (!it.result) return; // 아직 선택 안 한 날은 집계에서 제외
        const hwRate = it.result === "완료" ? 100 : (it.result === "기한초과" ? 50 : 0);
        perItem.homework.push(hwRate);
        return;
      }
      const rate = (it.kind === "boolean" || it.kind === "choice") ? (it.result ? 100 : 0) : 0;
      if (rate !== null && perItem[it.key]) perItem[it.key].push(rate);
    });
  });
  const itemAverages = ROUTINE_ITEM_DEFS.filter(def => def.key !== "wrong" && def.key !== "practice" && def.key !== "class" && def.key !== "review").map(def => {
    const arr = perItem[def.key];
    return { ...def, avg: arr.length ? Math.round(arr.reduce((a, b) => a + b, 0) / arr.length) : null };
  });
  const avgPracticeCount = practiceCounts.length ? Math.round(practiceCounts.reduce((a, b) => a + b, 0) / practiceCounts.length) : null;
  const avgAccuracy = accuracies.length ? Math.round(accuracies.reduce((a, b) => a + b, 0) / accuracies.length) : null;
  const validAverages = itemAverages.filter(x => x.avg !== null).map(x => x.avg);
  const overall = validAverages.length ? Math.round(validAverages.reduce((a, b) => a + b, 0) / validAverages.length) : null;
  const testScores = weekRoutines.filter(r => r.testScore != null).map(r => r.testScore);
  const testAvg = testScores.length ? Math.round(testScores.reduce((a, b) => a + b, 0) / testScores.length) : null;
  return { weekRoutines, itemAverages, overall, testAvg, avgPracticeCount, avgAccuracy, reviewBreakdown, classBreakdown };
}

        <ul className="flex flex-col gap-1.5">
          {(classBreakdown.N + classBreakdown.R) > 0 && (

              <span className="text-sm" style={{ color: "#2b2417" }}>진도수업</span>
              <span className="text-sm font-bold" style={{ color: "var(--gold)" }}>새로 배움 {classBreakdown.N}일 · 복습 중 {classBreakdown.R}일</span>
            </li>
          )}
          {(reviewBreakdown.P + reviewBreakdown.C) > 0 && (
            <li className="flex items-center justify-between p-2 rounded-lg" style={{ background: "#efe6d0" }}>
              <span className="text-sm" style={{ color: "#2b2417" }}>개념복습</span>
              <span className="text-sm font-bold" style={{ color: "var(--gold)" }}>진행중 {reviewBreakdown.P}일 · 완료율 {Math.round((reviewBreakdown.C / (reviewBreakdown.P + reviewBreakdown.C)) * 100)}%</span>
            </li>
          )}
          {itemAverages.map(it => (

              <span className="text-sm" style={{ color: "#2b2417" }}>{it.label}</span>
              <span className="text-sm font-bold" style={{ color: it.avg !== null && it.avg < PASS_RATE ? "var(--coral)" : "var(--gold)" }}>{it.avg === null ? "기록없음" : `${it.avg}%`}</span>
            </li>
          ))}

            <li className="flex items-center justify-between p-2 rounded-lg" style={{ background: "#efe6d0" }}>
              <span className="text-sm" style={{ color: "#2b2417" }}>하루 평균 문제풀이</span>
              <span className="text-sm font-bold" style={{ color: "var(--gold)" }}>{avgPracticeCount}문제</span>
            </li>
          )}
          {avgAccuracy !== null && (
            <li className="flex items-center justify-between p-2 rounded-lg" style={{ background: "#efe6d0" }}>
              <span className="text-sm" style={{ color: "#2b2417" }}>평균 정답률</span>
              <span className="text-sm font-bold" style={{ color: avgAccuracy < PASS_RATE ? "var(--coral)" : "var(--gold)" }}>{avgAccuracy}%</span>
            </li>
          )}
          {testAvg !== null && (
            <li className="flex items-center justify-between p-2 rounded-lg" style={{ background: "#efe6d0" }}>
              <span className="text-sm" style={{ color: "#2b2417" }}>테스트 평균</span>
              <span className="text-sm font-bold" style={{ color: "var(--gold)" }}>{testAvg}점</span>
            </li>
          )}
        </ul>
      )}
      {showAlertButton && weekRoutines.length > 0 && (
        <button onClick={sendReport} className="self-start px-4 py-2 rounded-lg text-sm font-semibold" style={btnGold}>이번주 리포트 알림 생성</button>
      )}
    </>
  );

  if (bare) return inner;
  return <div className="rounded-2xl p-4 flex flex-col gap-3" style={panel}>{inner}</div>;
}

function MessagesTab({ data, setData, scopeClassGroups }) {
  const [studentId, setStudentId] = useState("");

  const scopedIds = new Set(students.map(s => s.id));
  const studentName = (id) => data.students.find(s => s.id === id)?.name || "-";
  const formatTime = (iso) => new Date(iso).toLocaleString("ko-KR", { month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit" });

  const byStudent = {};
  (data.messages || []).filter(m => scopedIds.has(m.studentId)).forEach(m => {
    (byStudent[m.studentId] = byStudent[m.studentId] || []).push(m);
  });
  const threadList = Object.keys(byStudent).map(sid => {
    const msgs = byStudent[sid].sort((a, b) => a.createdAt.localeCompare(b.createdAt));
    const last = msgs[msgs.length - 1];
    return { studentId: sid, last, needsReply: last.sender === "student" };
  }).sort((a, b) => b.last.createdAt.localeCompare(a.last.createdAt));

  const thread = studentId ? (data.messages || []).filter(m => m.studentId === studentId).sort((a, b) => a.createdAt.localeCompare(b.createdAt)) : [];

  const send = () => {
    if (!studentId || !text.trim()) return;
    const msg = { id: uid(), studentId, sender: "staff", text: text.trim(), createdAt: new Date().toISOString() };
    setData({ ...data, messages: [...(data.messages || []), msg] });
    setText("");
  };

  return (
    <div className="flex flex-col gap-4">
      <div className="rounded-2xl p-4" style={panel}>
        <Field label="학생 선택"><StudentSelect students={students} value={studentId} onChange={setStudentId} /></Field>

        <div className="rounded-2xl p-4" style={panel}>

            {threadList.map(t => (
              <li key={t.studentId} onClick={() => setStudentId(t.studentId)} className="flex items-center justify-between p-2.5 rounded-lg cursor-pointer" style={{ background: t.studentId === studentId ? "#efe3c8" : "#efe6d0" }}>
                <div className="text-sm" style={{ color: "#2b2417" }}>
                  <b>{studentName(t.studentId)}</b>
                  <div className="text-xs" style={{ color: "#7a6f52" }}>{t.last.text.length > 30 ? t.last.text.slice(0, 30) + "…" : t.last.text}</div>
                </div>
                {t.needsReply && <span className="text-[10px] font-bold px-2 py-0.5 rounded-full flex-shrink-0" style={{ background: "var(--coral)", color: "#fff" }}>답장 필요</span>}
              </li>
            ))}
          </ul>
        </div>

function VideosTab({ data, setData }) {
  const [mode, setMode] = useState("link"); // "link" | "file"
  const [title, setTitle] = useState("");
  const [url, setUrl] = useState("");
  const [target, setTarget] = useState("ALL");
  const [file, setFile] = useState(null);
  const [fileError, setFileError] = useState("");
  const [uploading, setUploading] = useState(false);

  const onPickFile = (f) => {
    setFileError("");
    if (!f) { setFile(null); return; }
    if (!f.type.startsWith("video/")) { setFileError("영상 파일만 업로드할 수 있어요."); setFile(null); return; }
    if (f.size > MAX_VIDEO_FILE_BYTES) {
      setFileError(`파일이 너무 큽니다 (${(f.size / 1024 / 1024).toFixed(1)}MB). 4MB 이하 영상만 직접 업로드할 수 있어요. 더 큰 영상은 유튜브 등에 올린 뒤 링크로 등록해 주세요.`);
      setFile(null);
      return;
    }
    setFile(f);
  };

  const add = async () => {
    if (!title.trim()) return;
    if (mode === "link") {
      if (!url.trim()) return;
      setData({ ...data, videos: [...data.videos, { id: uid(), title, url, target, type: "link", createdAt: new Date().toISOString() }] });
      setTitle(""); setUrl("");
    } else {
      if (!file) return;
      setUploading(true);
      try {
        const dataUrl = await fileToDataURL(file);
        setData({ ...data, videos: [...data.videos, { id: uid(), title, url: dataUrl, target, type: "file", createdAt: new Date().toISOString() }] });
        setTitle(""); setFile(null);
      } catch (e) {
        setFileError("파일 처리 중 오류가 발생했습니다.");
      }
      setUploading(false);
    }
  };

  const remove = (id) => setData({ ...data, videos: data.videos.filter(v => v.id !== id) });

  return (
    <div className="flex flex-col gap-4">
      <div className="rounded-2xl p-4 flex flex-col gap-3" style={panel}>
        <h3 className="font-bold" style={{ fontFamily: "'Noto Serif KR', serif" }}>강의 업로드</h3>
        <div className="flex gap-2">
          {[{ id: "link", label: "링크로 등록" }, { id: "file", label: "파일 업로드" }].map(m => (
            <button key={m.id} onClick={() => { setMode(m.id); setFileError(""); }} className="flex-1 py-2 rounded-lg text-xs font-semibold"
              style={{ background: mode === m.id ? "var(--gold)" : "#efe6d0", color: mode === m.id ? "#1a1508" : "#6b6250" }}>{m.label}</button>
          ))}
        </div>
        <Field label="제목"><input className={inputCls} style={inputStyle} value={title} onChange={e => setTitle(e.target.value)} placeholder="예: 공통수학2 이차함수 개념정리" /></Field>
        {mode === "link" ? (
          <Field label="영상 링크(URL)"><input className={inputCls} style={inputStyle} value={url} onChange={e => setUrl(e.target.value)} placeholder="https://..." /></Field>
        ) : (
          <Field label="영상 파일 (최대 4MB)">
            <input type="file" accept="video/*" className={inputCls} style={inputStyle} onChange={e => onPickFile(e.target.files[0])} />
            {file && <span className="text-[11px]" style={{ color: "#7a6f52" }}>선택됨: {file.name} ({(file.size / 1024 / 1024).toFixed(1)}MB)</span>}
            {fileError && <span className="text-[11px]" style={{ color: "var(--coral)" }}>{fileError}</span>}
          </Field>
        )}
        <Field label="대상 학년">
          <select className={inputCls} style={inputStyle} value={target} onChange={e => setTarget(e.target.value)}>
            <option value="ALL">전체 학생</option>
            {GRADES.map(g => <option key={g} value={g}>{g}</option>)}
          </select>
        </Field>
        <button onClick={add} disabled={uploading} className="self-start px-4 py-2 rounded-lg text-sm font-semibold flex items-center gap-1" style={btnGold}>
          <Plus size={16} />{uploading ? "업로드 중…" : "업로드"}
        </button>
        <p className="text-[11px]" style={{ color: "#8a7f5e" }}>파일 업로드는 앱 저장 공간을 함께 쓰므로 용량이 작은 영상(4MB 이하)만 가능해요. 긴 강의 영상은 유튜브 등에 올린 뒤 "링크로 등록"을 이용해 주세요.</p>
      </div>
      <div className="rounded-2xl p-4" style={panel}>
        <h3 className="font-bold mb-3" style={{ fontFamily: "'Noto Serif KR', serif" }}>업로드된 강의 ({data.videos.length})</h3>
        {data.videos.length === 0 ? <EmptyState text="등록된 강의가 없습니다." /> : (
          <ul className="flex flex-col gap-2">
            {data.videos.map(v => (
              <li key={v.id} className="flex items-center justify-between p-3 rounded-lg" style={{ background: "#efe6d0" }}>

                </div>
                <button onClick={() => remove(v.id)} className="p-1.5 rounded-md" style={{ background: "#efe3c8" }}><Trash2 size={14} color="var(--coral)" /></button>
              </li>
            ))}

        )}
      </div>
    </div>
  );

// ================= 자습실 시간표 (공용 로직) =================
function cellStatus(tt, day, period) {
  return tt?.cells?.[`${day}-${period}`] || "-";
}
function upsertTimetableCell(data, setData, studentId, weekStart, day, period, nextStatus, reason) {
  const existing = data.timetables.find(t => t.studentId === studentId && t.weekStart === weekStart);
  const key = `${day}-${period}`;
  if (existing) {
    const cells = { ...existing.cells, [key]: nextStatus };
    const reasons = { ...existing.reasons };
    if (nextStatus === "X" && reason) reasons[key] = reason; else delete reasons[key];
    setData({ ...data, timetables: data.timetables.map(t => t.id === existing.id ? { ...t, cells, reasons } : t) });
  } else {
    const cells = { [key]: nextStatus };
    const reasons = nextStatus === "X" && reason ? { [key]: reason } : {};
    setData({ ...data, timetables: [...data.timetables, { id: uid(), studentId, weekStart, cells, reasons }] });
  }
}
function occupancyToday(data, weekStart, day) {
  const counts = {};
  PERIODS.forEach(p => { counts[p] = 0; });
  if (!day) return counts;
  data.timetables.filter(t => t.weekStart === weekStart).forEach(t => {
    PERIODS.forEach(p => { if (cellStatus(t, day, p) === "O") counts[p]++; });
  });
  return counts;
}

// 학생: 자습실 시간표 등록 (편집 가능)
function StudentTimetable({ data, setData, studentId }) {
  const weekStart = mondayOf(todayStr());
  const my = data.timetables.find(t => t.studentId === studentId && t.weekStart === weekStart);
  const today = todayDayLabel();

  const tap = (day, period) => {
    const cur = cellStatus(my, day, period);
    if (cur === "-") { upsertTimetableCell(data, setData, studentId, weekStart, day, period, "O"); return; }
    if (cur === "O") {
      const reason = window.prompt("결석 사유(선택)", "") || "";
      upsertTimetableCell(data, setData, studentId, weekStart, day, period, "X", reason);
      return;
    }
    upsertTimetableCell(data, setData, studentId, weekStart, day, period, "-");
  };

  return (
    <div className="flex flex-col gap-3">
      <p className="text-xs" style={{ color: "#7a6f52" }}>칸을 누르면 이용(○) → 결석(X) → 해당없음(–) 순서로 바뀝니다.</p>
      <TimetableGrid data={data} studentId={studentId} weekStart={weekStart} today={today} onTap={tap} />
    </div>
  );
}

  const [end, setEnd] = useState("21:30");

    if (!selectedGroup || selectedDays.length === 0) return;
    const block = { id: uid(), days: DAYS.filter(d => selectedDays.includes(d)), start, end };

function dateForDayInWeek(weekStart, day) {
  const idx = DAYS.indexOf(day);
  if (idx < 0) return weekStart;
  const d = new Date(weekStart + "T00:00:00");
  d.setDate(d.getDate() + idx);
  return d.toISOString().slice(0, 10);
}

function minutesBetween(start, end) {
  if (!start || !end) return 0;
  const [sh, sm] = start.split(":").map(Number);
  const [eh, em] = end.split(":").map(Number);
  let diff = (eh * 60 + em) - (sh * 60 + sm);
  if (diff < 0) diff += 24 * 60;
  return diff;
}
function formatMinutes(mins) {
  const h = Math.floor(mins / 60), m = mins % 60;
  if (h === 0) return `${m}분`;
  return m === 0 ? `${h}시간` : `${h}시간 ${m}분`;
}

// 반별 출석 인정 기준 시각 편집 (반마다 다른 시간 지정 가능, 없으면 기본값 적용)
function AttendanceCutoffEditor({ data, setData, groups }) {
  const [drafts, setDrafts] = useState({ ...(data.attendanceCutoffTimes || {}) });
  const [defaultDraft, setDefaultDraft] = useState(data.attendanceCutoffDefault || "16:00");
  const [savedKey, setSavedKey] = useState(null);

  const saveGroup = (g) => {
    setData({ ...data, attendanceCutoffTimes: { ...(data.attendanceCutoffTimes || {}), [g]: drafts[g] } });
    setSavedKey(g);
    setTimeout(() => setSavedKey(null), 1500);
  };
  const saveDefault = () => {
    setData({ ...data, attendanceCutoffDefault: defaultDraft });
    setSavedKey("__default__");
    setTimeout(() => setSavedKey(null), 1500);
  };

  return (
    <div className="rounded-2xl p-4 flex flex-col gap-3" style={panel}>
      <h3 className="font-bold" style={{ fontFamily: "'Noto Serif KR', serif" }}>출석 인정 기준 시각 (반별)</h3>
      <p className="text-[11px]" style={{ color: "#8a7f5e" }}>학생이 앱에서 "출석하기"를 누를 때, 자기 반에 설정된 기준 시각 이전이면 출석 · 이후면 지각으로 자동 기록돼요. 반이 없거나 아래 목록에 없는 반은 기본 기준 시각이 적용됩니다.</p>
      <div className="flex gap-2 items-end">
        <Field label="기본 기준 시각"><input type="time" className={inputCls} style={inputStyle} value={defaultDraft} onChange={e => setDefaultDraft(e.target.value)} /></Field>
        <button onClick={saveDefault} className="px-4 py-2.5 rounded-lg text-sm font-semibold" style={btnGold}>{savedKey === "__default__" ? "저장됨" : "저장"}</button>
      </div>
      {groups.length === 0 ? (
        <p className="text-xs" style={{ color: "#8a7f5e" }}>등록된 반이 없습니다. 학생 등록 시 "반/그룹"을 입력하면 여기에 나타나요.</p>
      ) : groups.map(g => (
        <div key={g} className="flex gap-2 items-end">
          <Field label={g}>
            <input type="time" className={inputCls} style={inputStyle}
              value={drafts[g] ?? data.attendanceCutoffDefault ?? "16:00"}
              onChange={e => setDrafts({ ...drafts, [g]: e.target.value })} />
          </Field>
          <button onClick={() => saveGroup(g)} className="px-4 py-2.5 rounded-lg text-sm font-semibold" style={btnGold}>{savedKey === g ? "저장됨" : "저장"}</button>
        </div>
      ))}
    </div>
  );
}

function AttendanceTab({ data, setData, scopeClassGroups }) {
  const [date, setDate] = useState(todayStr());
  const students = studentsInScope(data.students, scopeClassGroups);
  const extraGroups = [...new Set(data.students.map(s => s.classGroup).filter(Boolean))].filter(g => !CLASS_GROUPS.includes(g)).sort();
  const allGroups = [...CLASS_GROUPS, ...extraGroups];
  const groups = scopeClassGroups && scopeClassGroups.length ? allGroups.filter(g => scopeClassGroups.includes(g)) : allGroups;
  const entryFor = (studentId) => data.attendance.find(a => a.studentId === studentId && a.date === date);

  const setStatus = (studentId, status) => {
    const existing = entryFor(studentId);
    const student = data.students.find(s => s.id === studentId);
    let attendance;
    if (existing) attendance = data.attendance.map(a => a.id === existing.id ? { ...a, status } : a);
    else attendance = [...data.attendance, { id: uid(), studentId, date, status }];
    const alerts = syncAlerts(data.alerts, `attendance:${studentId}:${date}`, status === "결석", () => ({
      studentId, kind: "결석",
      message: `[루틴수학] ${student?.name || ""} 학생이 ${date} 결석 처리되었습니다.`,
    }));
    setData({ ...data, attendance, alerts });
  };

  const statusColor = { "출석": "#4c8c5f", "지각": "var(--gold)", "결석": "var(--coral)" };

  return (
    <div className="flex flex-col gap-4">
      <div className="rounded-2xl p-4" style={panel}>
        <Field label="날짜"><input type="date" className={inputCls} style={inputStyle} value={date} onChange={e => setDate(e.target.value)} /></Field>
      </div>
      <AttendanceCutoffEditor data={data} setData={setData} groups={groups} />
      <div className="rounded-2xl p-4" style={panel}>
        <h3 className="font-bold mb-3" style={{ fontFamily: "'Noto Serif KR', serif" }}>{date} 출결 ({students.length}명)</h3>
        {students.length === 0 ? <EmptyState text="학생이 없습니다." /> : (
          <ul className="flex flex-col gap-2">
            {students.map(s => {
              const entry = entryFor(s.id);
              const cur = entry?.status;
              return (
                <li key={s.id} className="flex items-center justify-between p-2.5 rounded-lg" style={{ background: "#efe6d0" }}>
                  <div className="text-sm" style={{ color: "#2b2417" }}>
                    {s.name}

const REQUEST_TYPES = [
  { id: "결석", label: "결석 신고", icon: Calendar },
  { id: "보강변경", label: "보강 시간 변경", icon: Repeat },
  { id: "클리닉변경", label: "클리닉 시간 변경", icon: FlaskConical },
];
const reqStatusColor = { "대기": "#7a6f52", "승인": "#4c8c5f", "거절": "var(--coral)" };

function RequestForm({ type, studentId, onSubmit, onCancel }) {
  const [targetDate, setTargetDate] = useState("");
  const [desiredDate, setDesiredDate] = useState("");
  const [desiredTime, setDesiredTime] = useState("");
  const [reason, setReason] = useState("");
  const needsDesired = type !== "결석";
  const submit = () => {
    if (!targetDate || !reason.trim()) return;
    if (needsDesired && (!desiredDate || !desiredTime)) return;
    onSubmit({ id: uid(), studentId, type, targetDate, desiredDate, desiredTime, reason, status: "대기", createdAt: new Date().toISOString(), adminNote: "" });
  };
  return (
    <div className="flex flex-col gap-3 p-4 rounded-2xl" style={panel}>
      <h3 className="font-bold" style={{ fontFamily: "'Noto Serif KR', serif" }}>{REQUEST_TYPES.find(t => t.id === type)?.label}</h3>
      <div>
        <label className="text-xs" style={{ color: "#7a6f52" }}>{type === "결석" ? "결석 날짜" : "기존 일정 날짜"}</label>
        <input type="date" className={inputCls} style={{ ...inputStyle, marginTop: 4 }} value={targetDate} onChange={e => setTargetDate(e.target.value)} />
      </div>
      {needsDesired && (
        <div className="grid grid-cols-2 gap-2">
          <div><label className="text-xs" style={{ color: "#7a6f52" }}>희망 날짜</label><input type="date" className={inputCls} style={{ ...inputStyle, marginTop: 4 }} value={desiredDate} onChange={e => setDesiredDate(e.target.value)} /></div>
          <div><label className="text-xs" style={{ color: "#7a6f52" }}>희망 시간</label><input type="time" className={inputCls} style={{ ...inputStyle, marginTop: 4 }} value={desiredTime} onChange={e => setDesiredTime(e.target.value)} /></div>
        </div>
      )}
      <div><label className="text-xs" style={{ color: "#7a6f52" }}>사유</label><textarea rows={3} className={inputCls} style={{ ...inputStyle, marginTop: 4 }} value={reason} onChange={e => setReason(e.target.value)} /></div>
      <div className="flex gap-2">
        <button onClick={submit} className="px-4 py-2 rounded-lg text-sm font-semibold" style={btnGold}>제출</button>
        <button onClick={onCancel} className="px-4 py-2 rounded-lg text-sm" style={{ border: "1px solid #ddcda0", color: "#5c543e" }}>취소</button>
      </div>
      <p className="text-[11px]" style={{ color: "#8a7f5e" }}>제출하면 관리자에게 바로 전달되어 확인 후 승인/거절됩니다.</p>
    </div>
  );
}

function RequestsTab({ data, setData }) {
  const studentName = (id) => data.students.find(s => s.id === id)?.name || "-";

    const note = status === "거절" ? (window.prompt("거절 사유(선택)", "") || "") : "";

  };
  const pending = data.requests.filter(r => r.status === "대기").sort((a, b) => a.createdAt.localeCompare(b.createdAt));

  const Row = ({ r }) => (
    <li className="p-3 rounded-xl" style={{ background: "#efe6d0" }}>
      <div className="flex items-center justify-between">
        <span className="text-sm font-semibold" style={{ color: "#2b2417" }}>{studentName(r.studentId)} · {REQUEST_TYPES.find(t => t.id === r.type)?.label}</span>

        <div className="flex gap-2 mt-2">
          <button onClick={() => respond(r, "승인")} className="px-3 py-1 rounded-md text-xs font-semibold flex items-center gap-1" style={{ background: "#4c8c5f", color: "#fff" }}><Check size={12} />승인</button>
          <button onClick={() => respond(r, "거절")} className="px-3 py-1 rounded-md text-xs font-semibold flex items-center gap-1" style={{ background: "var(--coral)", color: "#fff" }}><X size={12} />거절</button>
        </div>

      </div>
      <div className="rounded-2xl p-4" style={panel}>
        <h3 className="font-bold mb-3" style={{ fontFamily: "'Noto Serif KR', serif" }}>처리 완료 ({handled.length})</h3>

function TeacherTodayTab({ data, scopeClassGroups }) {
  const [date, setDate] = useState(todayStr());
  const students = studentsInScope(data.students, scopeClassGroups);
  const groups = {};
  students.forEach(s => { const g = s.classGroup || "미배정"; (groups[g] = groups[g] || []).push(s); });
  const groupNames = Object.keys(groups).sort();

  const testFor = (id) => data.tests.filter(t => t.studentId === id && t.date === date);
  const homeworkFor = (id) => data.homeworks.filter(h => h.studentId === id && h.date === date);
  const attendanceFor = (id) => data.attendance.find(a => a.studentId === id && a.date === date);

  const attColor = { "출석": "#4c8c5f", "지각": "var(--gold)", "결석": "var(--coral)" };

  return (
    <div className="flex flex-col gap-4">
      <div className="rounded-2xl p-4" style={panel}>
        <Field label="날짜"><input type="date" className={inputCls} style={inputStyle} value={date} onChange={e => setDate(e.target.value)} /></Field>
      </div>
      {groupNames.length === 0 ? <EmptyState text="담당반에 등록된 학생이 없습니다." /> : (
        groupNames.map(g => (
          <div key={g} className="rounded-2xl p-4" style={panel}>
            <h3 className="font-bold mb-3" style={{ fontFamily: "'Noto Serif KR', serif" }}>{g} ({groups[g].length}명)</h3>
            <ul className="flex flex-col gap-2">
              {groups[g].map(s => {
                const tests = testFor(s.id);
                const hws = homeworkFor(s.id);
                const att = attendanceFor(s.id);
                return (
                  <li key={s.id} className="p-2.5 rounded-lg" style={{ background: "#efe6d0" }}>
                    <div className="flex items-center justify-between mb-1">
                      <span className="text-sm font-semibold" style={{ color: "#2b2417" }}>{s.name}</span>
                      <span className="text-xs font-semibold px-2 py-0.5 rounded-full" style={{ background: att ? attColor[att.status] : "#e4d8ba", color: att ? "#fff" : "#5c543e" }}>
                        {att ? att.status : "미기록"}
                      </span>
                    </div>
                    <div className="flex flex-wrap gap-1.5 text-xs" style={{ color: "#7a6f52" }}>
                      {tests.length === 0 ? <span>테스트 없음</span> : tests.map(t => (
                        <span key={t.id} className="px-2 py-0.5 rounded-full" style={{ background: t.score < t.passLine ? "#f8e3c9" : "#e4d8ba", color: t.score < t.passLine ? "var(--coral)" : "#5c543e" }}>{t.name} {t.score}점</span>
                      ))}
                      {hws.length === 0 ? <span>숙제 없음</span> : hws.map(h => (
                        <span key={h.id} className="px-2 py-0.5 rounded-full" style={{ background: h.submitted ? "#e4d8ba" : "#f8e3c9", color: h.submitted ? "#5c543e" : "var(--coral)" }}>{h.title} · {h.submitted ? `제출${h.submittedAt ? ` (${new Date(h.submittedAt).toLocaleTimeString("ko-KR", { hour: "2-digit", minute: "2-digit" })})` : ""}` : "미제출"}</span>
                      ))}
                    </div>
                  </li>
                );
              })}
            </ul>
          </div>
        ))
      )}
    </div>
  );
}

function TeachersTab({ data, setData }) {
  const [form, setForm] = useState({ name: "", pin: "", classGroups: "" });
  const [editingId, setEditingId] = useState(null);
  const reset = () => { setForm({ name: "", pin: "", classGroups: "" }); setEditingId(null); };
  const submit = () => {
    if (!form.name.trim() || form.pin.length !== 4) return;
    const classGroups = form.classGroups.split(",").map(s => s.trim()).filter(Boolean);
    if (editingId) setData({ ...data, teachers: data.teachers.map(t => t.id === editingId ? { ...t, name: form.name, pin: form.pin, classGroups } : t) });

    reset();
  };
  const edit = (t) => { setForm({ name: t.name, pin: t.pin, classGroups: (t.classGroups || []).join(", ") }); setEditingId(t.id); };
  const remove = (id) => setData({ ...data, teachers: data.teachers.filter(t => t.id !== id) });

  return (
    <div className="flex flex-col gap-4">
      <div className="rounded-2xl p-4 flex flex-col gap-3" style={panel}>
        <h3 className="font-bold" style={{ fontFamily: "'Noto Serif KR', serif" }}>{editingId ? "강사 정보 수정" : "강사 등록"}</h3>
        <div className="grid grid-cols-2 gap-3">
          <Field label="이름"><input className={inputCls} style={inputStyle} value={form.name} onChange={e => setForm({ ...form, name: e.target.value })} placeholder="예: 이우영" /></Field>
          <Field label="PIN (4자리)"><input className={inputCls} style={inputStyle} value={form.pin} maxLength={4} onChange={e => setForm({ ...form, pin: e.target.value.replace(/\D/g, "") })} /></Field>
        </div>
        <Field label="담당반 (쉼표로 구분)"><input className={inputCls} style={inputStyle} value={form.classGroups} onChange={e => setForm({ ...form, classGroups: e.target.value })} placeholder="예: 고1-3, 고1-4" /></Field>
        <div className="flex gap-2">
          <button onClick={submit} className="px-4 py-2 rounded-lg text-sm font-semibold flex items-center gap-1" style={btnGold}><Plus size={16} />{editingId ? "수정 저장" : "강사 추가"}</button>

        </div>
      </div>
      <div className="rounded-2xl p-4" style={panel}>
        <h3 className="font-bold mb-3" style={{ fontFamily: "'Noto Serif KR', serif" }}>강사 명단 ({data.teachers.length}명)</h3>
        {data.teachers.length === 0 ? <EmptyState text="등록된 강사가 없습니다." /> : (
          <ul className="flex flex-col gap-2">
            {data.teachers.map(t => (
              <li key={t.id} className="flex items-center justify-between p-3 rounded-lg" style={{ background: "#efe6d0" }}>
                <div className="text-sm"><b style={{ color: "#2b2417" }}>{t.name}</b> <span style={{ color: "#7a6f52" }}>· 담당반: {(t.classGroups || []).join(", ") || "없음"}</span></div>
                <div className="flex gap-2">
                  <button onClick={() => edit(t)} className="p-1.5 rounded-md" style={{ background: "#efe3c8" }}><Pencil size={14} color="#5c543e" /></button>
                  <button onClick={() => remove(t.id)} className="p-1.5 rounded-md" style={{ background: "#efe3c8" }}><Trash2 size={14} color="var(--coral)" /></button>
                </div>
              </li>
            ))}
          </ul>
        )}
      </div>
    </div>
  );
}

// 오늘 할 일 계획 (과목별로 묶어서 체크리스트로 표시, 타임테이블과 같은 과목 색상 사용)

  const bySubject = {};
  tasks.forEach(t => { (bySubject[t.subject] = bySubject[t.subject] || []).push(t); });

  const add = () => {
    if (!subject.trim() || !content.trim()) return;
    setData({ ...data, plannerTasks: [...(data.plannerTasks || []), { id: uid(), studentId, date, subject: subject.trim(), content: content.trim(), done: false }] });
    setContent("");
  };
  const toggle = (t) => setData({ ...data, plannerTasks: data.plannerTasks.map(x => x.id === t.id ? { ...x, done: !x.done } : x) });

  return (

          <div className="grid grid-cols-2 gap-2">

          </div>
          <button onClick={add} className="self-start px-4 py-2 rounded-lg text-sm font-semibold flex items-center gap-1" style={btnGold}><Plus size={16} />추가</button>

// 순공 타이머: 시작/멈춤을 누르면 쉬는 시간은 자동으로 빠지고, 끝나면 오늘 플래너에 자동 기록됨
function StudyTimer({ data, setData, studentId }) {
  const storageKey = `routine_math_timer_${studentId}`;
  const loadSaved = () => {
    try {
      const raw = localStorage.getItem(storageKey);
      return raw ? JSON.parse(raw) : null;
    } catch (e) { return null; }
  };
  const saved = loadSaved();
  const [running, setRunning] = useState(saved?.running || false);
  const [elapsedMs, setElapsedMs] = useState(saved?.elapsedMs || 0);
  const [segmentStart, setSegmentStart] = useState(saved?.segmentStart || null);
  const [subject, setSubject] = useState(saved?.subject || "");
  const [, forceTick] = useState(0);

  // 화면이 꺼졌다 켜지거나(폰이 백그라운드에서 페이지를 새로고침해도) 이어서 계산되도록 로컬에 저장
  useEffect(() => {
    try { localStorage.setItem(storageKey, JSON.stringify({ running, elapsedMs, segmentStart, subject })); }
    catch (e) { /* 저장 공간 문제 - 무시 */ }
  }, [running, elapsedMs, segmentStart, subject]);

  useEffect(() => {
    if (!running) return;
    const id = setInterval(() => forceTick(t => t + 1), 1000);
    return () => clearInterval(id);
  }, [running]);

  const currentElapsedMs = elapsedMs + (running && segmentStart ? (Date.now() - segmentStart) : 0);
  const totalSeconds = Math.floor(currentElapsedMs / 1000);
  const hh = String(Math.floor(totalSeconds / 3600)).padStart(2, "0");
  const mm = String(Math.floor((totalSeconds % 3600) / 60)).padStart(2, "0");
  const ss = String(totalSeconds % 60).padStart(2, "0");

  const start = () => { setSegmentStart(Date.now()); setRunning(true); };
  const pause = () => { setElapsedMs(elapsedMs + (Date.now() - segmentStart)); setSegmentStart(null); setRunning(false); };
  const reset = () => {
    setElapsedMs(0); setSegmentStart(null); setRunning(false);
    try { localStorage.removeItem(storageKey); } catch (e) { /* 무시 */ }
  };

  // 참고: 화면 꺼짐/다른 앱 전환은 웹에서 구분할 방법이 없어서(둘 다 동일하게 "숨김" 처리됨),
  // 진행중일 때 자동으로 멈추게 하면 정상적인 "화면 끄고 책으로 공부" 상황까지 멈춰버려서
  // 이 기능은 빼고, 실제 시계 시각 기준으로 계속 흘러가게 둡니다.

  const saveToPlanner = () => {
    const totalMinutes = Math.round(currentElapsedMs / 60000);
    if (totalMinutes < 1) return;
    const now = new Date();
    const pad = (n) => String(n).padStart(2, "0");
    const end = `${pad(now.getHours())}:${pad(now.getMinutes())}`;
    const startDate = new Date(now.getTime() - totalMinutes * 60000);
    const startStr = `${pad(startDate.getHours())}:${pad(startDate.getMinutes())}`;
    setData({ ...data, plannerBlocks: [...data.plannerBlocks, { id: uid(), studentId, date: todayStr(), start: startStr, end, subject: subject.trim() || "타이머 공부", done: true }] });
    reset();
    setSubject("");
  };

  return (
    <div className="rounded-2xl p-4 flex flex-col gap-3" style={panel}>
      <h3 className="font-bold flex items-center gap-2" style={{ fontFamily: "'Noto Serif KR', serif" }}>⏱ 순공 타이머</h3>
      <div className="text-center py-3">
        <div className="text-4xl font-bold tabular-nums" style={{ color: "#2b2417", fontFamily: "'Noto Serif KR', serif" }}>{hh}:{mm}:{ss}</div>
      </div>
      <Field label="무슨 공부 (선택)"><input className={inputCls} style={inputStyle} value={subject} onChange={e => setSubject(e.target.value)} placeholder="예: 공통수학2 복습" /></Field>
      {!running ? (
        <button onClick={start} className="w-full py-3 rounded-xl text-sm font-bold" style={btnGold}>{currentElapsedMs > 0 ? "이어서 공부하기" : "공부 시작"}</button>
      ) : (
        <button onClick={pause} className="w-full py-3 rounded-xl text-sm font-bold" style={{ background: "var(--coral)", color: "#fff" }}>쉬는 중 (탭해서 멈춤)</button>
      )}
      <p className="text-[11px] text-center" style={{ color: "var(--coral)" }}>⚠️ 공부 시작 후 카톡·유튜브 등 다른 앱을 열면 공부시간이 초기화돼요</p>
      {currentElapsedMs > 0 && !running && (
        <div className="flex gap-2">
          <button onClick={saveToPlanner} className="flex-1 py-2.5 rounded-lg text-sm font-semibold" style={{ background: "#4c8c5f", color: "#fff" }}>순공시간으로 저장</button>
          <button onClick={reset} className="px-4 py-2.5 rounded-lg text-sm" style={{ border: "1px solid #ddcda0", color: "#5c543e" }}>초기화</button>
        </div>
      )}
      <p className="text-[11px]" style={{ color: "#8a7f5e" }}>공부할 때 "공부 시작", 쉴 때 눌러서 멈추고, 다시 누르면 이어서 계산돼요. 다 끝나면 "순공시간으로 저장"을 누르면 오늘 플래너에 자동으로 기록돼요.</p>
    </div>
  );
}

// 하루 학습 타임테이블 (사진 속 다이어리처럼 시간대별 막대로 시각화)
const SUBJECT_PALETTE = ["#e2822f", "#4c8c5f", "#7a8cc4", "#c65a1f", "#b08a3e", "#5c8a8a", "#a15c8f", "#6b7f4f"];
function colorForSubject(subject) {
  const s = subject || "";
  let hash = 0;
  for (let i = 0; i < s.length; i++) hash = (hash * 31 + s.charCodeAt(i)) >>> 0;
  return SUBJECT_PALETTE[hash % SUBJECT_PALETTE.length];
}

function DayTimeline({ blocks }) {
  if (blocks.length === 0) return <EmptyState text="이 날짜에 기록된 공부 시간이 없습니다." />;
  const toMinutes = (hhmm) => { const [h, m] = (hhmm || "00:00").split(":").map(Number); return h * 60 + m; };
  const minStart = Math.min(...blocks.map(b => toMinutes(b.start)));
  const maxEnd = Math.max(...blocks.map(b => toMinutes(b.end)));
  const rangeStart = Math.max(0, Math.floor(minStart / 60) * 60 - 60);
  const rangeEnd = Math.min(24 * 60, Math.ceil(maxEnd / 60) * 60 + 60);
  const totalMinutes = Math.max(60, rangeEnd - rangeStart);
  const rowHeight = 34;
  const totalHeight = (totalMinutes / 60) * rowHeight;
  const hourMarks = [];
  for (let m = rangeStart; m <= rangeEnd; m += 60) hourMarks.push(m);
  const subjects = [...new Set(blocks.map(b => b.subject).filter(Boolean))];

  return (
    <div className="flex flex-col gap-2">
      <div className="flex gap-2">
        <div className="flex-shrink-0" style={{ width: 30 }}>
          {hourMarks.map(m => (
            <div key={m} style={{ height: rowHeight, color: "#a89d84" }} className="text-[10px] relative">
              <span style={{ position: "absolute", top: -6 }}>{m / 60}시</span>
            </div>
          ))}
        </div>
        <div className="relative flex-1 rounded-lg" style={{ height: totalHeight, background: "#fffcf6", border: "1px solid #e4d8ba" }}>
          {hourMarks.map((m, i) => (
            <div key={m} style={{ position: "absolute", top: i * rowHeight, left: 0, right: 0, borderTop: "1px solid #f2ead6" }} />
          ))}
          {hourMarks.slice(0, -1).flatMap((m, i) => (
            [1, 2, 3, 4, 5].map(sub => (
              <div key={`${m}-${sub}`} style={{ position: "absolute", top: i * rowHeight + (sub * rowHeight) / 6, left: 0, right: 0, borderTop: "1px dotted #f6efdd" }} />
            ))
          ))}
          {blocks.map(b => {
            const roundTo10 = (mins) => Math.round(mins / 10) * 10;
            const s = roundTo10(toMinutes(b.start)), e = Math.max(s + 10, roundTo10(toMinutes(b.end)));
            const top = ((s - rangeStart) / 60) * rowHeight;
            const height = Math.max(8, ((e - s) / 60) * rowHeight - 2);
            return (
              <div key={b.id} className="absolute rounded-md px-2 text-[10px] font-semibold flex items-center overflow-hidden whitespace-nowrap"
                style={{ top: top + 1, height, left: 3, right: 3, background: b.done === false ? "#e4d8ba" : colorForSubject(b.subject), color: b.done === false ? "#7a6f52" : "#fffcf6", opacity: b.done === false ? 0.7 : 1 }}>
                {b.subject}
              </div>
            );
          })}
        </div>
      </div>
      {subjects.length > 0 && (
        <div className="flex flex-wrap gap-x-3 gap-y-1 px-1">
          {subjects.map(subj => (
            <div key={subj} className="flex items-center gap-1.5">
              <span className="w-2.5 h-2.5 rounded-full flex-shrink-0" style={{ background: colorForSubject(subj) }} />
              <span className="text-[10px]" style={{ color: "#7a6f52" }}>{subj}</span>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

                  <button onClick={() => remove(b.id)} className="p-1 rounded-md" style={{ background: "#efe3c8" }}><Trash2 size={12} color="var(--coral)" /></button>

              return (
                <li key={d} className="flex items-center justify-between p-2.5 rounded-lg" style={{ background: "#efe6d0" }}>

                  <span className="text-sm font-bold" style={{ color: "var(--gold)" }}>{formatMinutes(pureMinutes)}</span>
                </li>
              );
            })}
          </ul>
        )}
      </div>
    </div>
  );
}

function StudentHomeworkTab({ data, setData, studentId }) {
  const mine = data.homeworks.filter(h => h.studentId === studentId).sort((a, b) => b.date.localeCompare(a.date));
  const [openPhotoFor, setOpenPhotoFor] = useState(null);
  const [uploadingId, setUploadingId] = useState(null);

  const photosOf = (h) => h.photos || (h.photo ? [h.photo] : []);

  const toggle = (h) => {
    const nextSubmitted = !h.submitted;
    const updated = { ...h, submitted: nextSubmitted, submittedAt: nextSubmitted ? new Date().toISOString() : null };
    setData({ ...data, homeworks: data.homeworks.map(x => x.id === h.id ? updated : x), alerts: syncHomeworkAlert(updated, data) });
  };

  const onPickPhoto = async (h, files) => {
    if (!files || files.length === 0) return;
    setUploadingId(h.id);
    try {
      const newUrls = [];
      for (const file of Array.from(files)) {
        const dataUrl = await fileToCompressedDataURL(file);
        newUrls.push(dataUrl);
      }
      setData({ ...data, homeworks: data.homeworks.map(x => x.id === h.id ? { ...x, photos: [...photosOf(x), ...newUrls], photo: null } : x) });
    } catch (e) {
      console.error("사진 처리 실패", e);
    }
    setUploadingId(null);
  };

  const removeOnePhoto = (h, index) => setData({ ...data, homeworks: data.homeworks.map(x => x.id === h.id ? { ...x, photos: photosOf(x).filter((_, i) => i !== index), photo: null } : x) });
  const removeAllPhotos = (h) => setData({ ...data, homeworks: data.homeworks.map(x => x.id === h.id ? { ...x, photos: [], photo: null, note: "" } : x) });

  return (
    <div className="rounded-2xl p-4" style={panel}>
      <h3 className="font-bold mb-3" style={{ fontFamily: "'Noto Serif KR', serif" }}>숙제 제출</h3>
      {mine.length === 0 ? <EmptyState text="등록된 숙제가 없습니다." /> : (
        <ul className="flex flex-col gap-3">
          {mine.map(h => {
            const photos = photosOf(h);
            return (
              <li key={h.id} className="p-3 rounded-lg flex flex-col gap-2" style={{ background: h.submitted ? "#efe6d0" : "#f8e3c9" }}>
                <div className="flex items-center justify-between">
                  <span className="text-sm" style={{ color: "#2b2417" }}>
                    {h.date} · {h.title}
                    {h.dueDate && <span className="text-[10px] ml-2 px-1.5 py-0.5 rounded-full" style={{ background: (!h.submitted && h.dueDate < todayStr()) ? "var(--coral)" : "#e4d8ba", color: (!h.submitted && h.dueDate < todayStr()) ? "#fff" : "#5c543e" }}>{(!h.submitted && h.dueDate < todayStr()) ? "기한 초과" : `기한 ${h.dueDate}`}</span>}
                  </span>
                  <button onClick={() => toggle(h)} className="px-3 py-1 rounded-full text-xs font-semibold flex items-center gap-1" style={{ background: h.submitted ? "#4c8c5f" : "var(--coral)", color: "#fff" }}>
                    {h.submitted ? <Check size={12} /> : <ClipboardCheck size={12} />}{h.submitted ? "제출완료 (취소)" : "제출하기"}
                  </button>
                </div>
                <div className="flex items-center gap-2 flex-wrap">
                  <label className="text-xs underline cursor-pointer" style={{ color: "var(--gold)" }}>
                    {uploadingId === h.id ? "처리 중…" : photos.length > 0 ? "사진 더 올리기" : "모르는 문제 사진 올리기"}
                    <input type="file" accept="image/*" capture="environment" multiple className="hidden" onChange={e => onPickPhoto(h, e.target.files)} />
                  </label>
                  {photos.length > 0 && (
                    <>
                      <button onClick={() => setOpenPhotoFor(openPhotoFor === h.id ? null : h.id)} className="text-xs underline" style={{ color: "#7a6f52" }}>
                        {openPhotoFor === h.id ? "접기" : `보기 (${photos.length}장)`}
                      </button>
                      <button onClick={() => removeAllPhotos(h)} className="text-xs" style={{ color: "var(--coral)" }}>전체삭제</button>
                    </>
                  )}
                </div>
                {photos.length > 0 && openPhotoFor === h.id && (
                  <div className="flex gap-2 overflow-x-auto pb-1">
                    {photos.map((src, i) => (
                      <div key={i} className="relative flex-shrink-0">
                        <img src={src} alt="모르는 문제" className="rounded-lg" style={{ height: 160 }} />
                        <button onClick={() => removeOnePhoto(h, i)} className="absolute top-1 right-1 w-5 h-5 rounded-full flex items-center justify-center" style={{ background: "rgba(0,0,0,0.55)" }}>
                          <X size={12} color="#fff" />
                        </button>
                      </div>
                    ))}
                  </div>
                )}
              </li>
            );
          })}
        </ul>
      )}
      <p className="text-[11px] mt-3" style={{ color: "#8a7f5e" }}>사진은 앱 저장 공간을 함께 쓰기 때문에 너무 많이 쌓이면 저장이 안 될 수 있어요. 확인이 끝난 사진은 삭제해 주세요.</p>
    </div>
  );
}

function StudentClassroom({ data, setData, studentId }) {
  const student = data.students.find(s => s.id === studentId);

  useEffect(() => {
    const seen = new Set(student?.seenVideoIds || []);

    const unseenIds = matching.filter(v => !seen.has(v.id)).map(v => v.id);
    if (unseenIds.length > 0) {
      setData({ ...data, students: data.students.map(s => s.id === studentId ? { ...s, seenVideoIds: [...(s.seenVideoIds || []), ...unseenIds] } : s) });

    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [data.videos.length, studentId]);

    <div className="flex flex-col gap-4">
