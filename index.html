// 학생: 오늘 출석 체크인 (도착 시 직접 누르면 기준 시각과 비교해 출석/지각 자동 기록)
function StudentAttendanceCheckin({ data, setData, studentId }) {
  const today = todayStr();
  const todays = data.attendance.find(a => a.studentId === studentId && a.date === today);
  const student = data.students.find(s => s.id === studentId);
  const cutoff = (student?.classGroup && data.attendanceCutoffTimes?.[student.classGroup]) || data.attendanceCutoffDefault || "16:00";

  const checkIn = () => {
    const now = new Date();
    const time = `${String(now.getHours()).padStart(2, "0")}:${String(now.getMinutes()).padStart(2, "0")}`;
    const status = time <= cutoff ? "출석" : "지각";
    const entry = { id: uid(), studentId, date: today, status, time, source: "student" };
    const alerts = syncAlerts(data.alerts, `attendance:${studentId}:${today}`, status === "지각", () => ({
      studentId, kind: "지각",
      message: `[루틴수학] ${student?.name || ""} 학생이 ${today} ${time}에 지각 체크인했습니다.`,
    }));
    setData({ ...data, attendance: [...data.attendance, entry], alerts });
  };

  const statusColor = { "출석": "#4c8c5f", "지각": "var(--gold)", "결석": "var(--coral)" };

  return (
    <div className="rounded-2xl p-5" style={{ background: "#173226" }}>
      <div className="text-[10px] tracking-[0.3em] mb-3" style={{ color: "var(--gold)" }}>ROUTINE MATH ACADEMY</div>
      <h3 className="text-lg font-bold mb-1" style={{ color: "#f4efe1", fontFamily: "'Noto Serif KR', serif" }}>오늘 출석 체크인</h3>
      <p className="text-xs mb-4" style={{ color: "rgba(244,239,225,0.6)" }}>{today} · 기준 시각 {cutoff}{student?.classGroup ? ` (${student.classGroup} 반 기준)` : " (기본 기준)"} 이전 출석 / 이후 지각</p>
      {todays ? (
        <div className="rounded-xl p-4 flex items-center justify-between" style={{ background: "#1f4534" }}>
          <span className="text-sm" style={{ color: "#f4efe1" }}>{todays.time ? `${todays.time} 도착` : "체크인 완료"}</span>
          <span className="text-xs font-bold px-3 py-1 rounded-full" style={{ background: statusColor[todays.status], color: "#fff" }}>{todays.status}</span>
        </div>
      ) : (
        <button onClick={checkIn} className="w-full py-3.5 rounded-xl text-sm font-semibold" style={btnGold}>출석하기</button>
      )}
    </div>
  );
}

function App() {
  const { data, setData, loading, saving } = useAppData();
  const [view, setView] = useState("gate");
  const [studentId, setStudentId] = useState(null);
  const [teacherId, setTeacherId] = useState(null);

  // 새 버전이 배포되면 자동으로 최신 코드를 다시 받아옴 (학생 기기에서 캐시 지우기 불필요)
  useEffect(() => {
    const checkVersion = async () => {
      try {
        const res = await fetch("./version.txt", { cache: "no-store" });
        if (!res.ok) return;
        const v = (await res.text()).trim();
        if (v && typeof APP_VERSION !== "undefined" && v !== APP_VERSION) {
          const url = new URL(window.location.href);
          url.searchParams.set("v", v);
          window.location.replace(url.toString());
        }
      } catch (e) { /* version.txt 없음 또는 네트워크 오류 - 무시 */ }
    };
    checkVersion();
    const interval = setInterval(checkVersion, 30 * 1000);
    return () => clearInterval(interval);
  }, []);

  useEffect(() => {
    if (document.getElementById("routine-font-link")) return;
    const link = document.createElement("link");
    link.id = "routine-font-link"; link.rel = "stylesheet";
    link.href = "https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700&family=Pretendard:wght@400;500;600&display=swap";
    document.head.appendChild(link);
  }, []);

  useEffect(() => {
    document.title = "루틴수학";
    const setMeta = (name, content) => {
      let m = document.querySelector(`meta[name="${name}"]`);
      if (!m) { m = document.createElement("meta"); m.name = name; document.head.appendChild(m); }
      m.content = content;
    };
    setMeta("apple-mobile-web-app-title", "루틴수학");
    setMeta("apple-mobile-web-app-capable", "yes");
    setMeta("mobile-web-app-capable", "yes");
  }, []);

  // 홈 화면 아이콘 배지: 학부모 알림 대기 + 요청 대기 + 답장 필요한 1:1 문의 합계
  // (Badging API — 홈 화면에 추가한 상태에서 앱을 최근에 열어본 적이 있어야 갱신돼요.
  //  앱을 아예 안 열고 있어도 실시간으로 뜨게 하려면 별도의 푸시 알림 서버가 필요해요.)
  useEffect(() => {
    if (loading) return;
    if (!("setAppBadge" in navigator)) return;
    const total = data.alerts.filter(a => a.status === "대기").length
      + data.requests.filter(r => r.status === "대기").length
      + pendingMessageThreads(data);
    try {
      if (total > 0) navigator.setAppBadge(total).catch(() => {});
      else navigator.clearAppBadge().catch(() => {});
    } catch (e) { /* Badging API 미지원 브라우저는 무시 */ }
  }, [data, loading]);

  if (loading) return <div className="min-h-screen flex items-center justify-center" style={{ background: "#f6f1e4" }}><Loader2 className="animate-spin" color="var(--gold)" /></div>;

  const teacher = data.teachers.find(t => t.id === teacherId);

  return (
    <div style={{ "--gold": "#e2822f", "--coral": "#c65a1f" }}>
      <style>{`* { font-family: 'Pretendard', sans-serif; } h1,h2,h3 { color: #2b2417; } input:focus, select:focus, textarea:focus { border-color: var(--gold) !important; }`}</style>

      {view === "gate" && <RoleGate onStudent={() => setView("studentLogin")} onTeacher={() => setView("teacherLogin")} onAdmin={() => setView("adminGate")} />}

      {view === "studentLogin" && (
        <PhoneLoginCard heading="학생 로그인" sub="강의실 · 플래너 · 자습실"
          onSubmit={(name, pin) => { const m = findByPhone(data.students, name, pin); if (m) { setStudentId(m.id); setView("student"); return true; } return false; }}
          onBack={() => setView("gate")} />
      )}
      {view === "student" && <StudentHome data={data} setData={setData} studentId={studentId} onLogout={() => { try { localStorage.removeItem(`routine_math_timer_${studentId}`); } catch (e) { /* 무시 */ } setStudentId(null); setView("gate"); }} />}

      {view === "teacherLogin" && (
        <TeacherLoginCard data={data} onLogin={(id) => { setTeacherId(id); setView("teacher"); }} onBack={() => setView("gate")} />
      )}
      {view === "teacher" && teacher && <TeacherHome data={data} setData={setData} teacher={teacher} onLogout={() => { setTeacherId(null); setView("gate"); }} />}

      {view === "adminGate" && <AdminGate onPass={() => setView("admin")} onBack={() => setView("gate")} />}
      {view === "admin" && <AdminPanel data={data} setData={setData} onExit={() => setView("gate")} />}

      {saving && <div className="fixed bottom-2 left-1/2 -translate-x-1/2 text-[10px] px-2 py-1 rounded-full" style={{ background: "#fffcf6", color: "#7a6f52" }}>저장 중…</div>}
    </div>
  );
}


try {
  ReactDOM.createRoot(document.getElementById("root")).render(<App />);
} catch (e) {
  window.showError("앱 실행 중 오류", (e && e.stack) ? e.stack : String(e));
}
</script>
</body>
</html>
